<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page non trouvée - MedSupply Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#0A2647",
              secondary: "#144272",
              accent: "#2C74B3",
              success: "#16A34A",
              warning: "#D97706",
              danger: "#DC2626",
              background: "#F8FAFC",
              surface: "#FFFFFF",
              border: "#E2E8F0",
              textPrimary: "#0F172A",
              textSecondary: "#64748B",
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="bg-background min-h-screen flex items-center justify-center p-4">
    <div class="text-center">
      <div
        class="w-32 h-32 bg-primary bg-opacity-10 rounded-full flex items-center justify-center mx-auto mb-6"
      >
        <i data-lucide="alert-triangle" class="w-16 h-16 text-primary"></i>
      </div>

      <h1 class="text-4xl font-bold text-textPrimary mb-2">404</h1>
      <p class="text-xl text-textSecondary mb-6">Page non trouvée</p>

      <p class="text-textSecondary mb-8 max-w-md mx-auto">
        La page que vous recherchez n'existe pas ou a été déplacée.
      </p>

      <a
        href="/medsupply-cloud/pages/auth/login.html"
        class="inline-flex items-center gap-2 bg-primary hover:bg-secondary text-white font-medium px-6 py-3 rounded-lg transition-colors"
      >
        <i data-lucide="home" class="w-4 h-4"></i>
        <span>Retour à l'accueil</span>
      </a>
    </div>

    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
