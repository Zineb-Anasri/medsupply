<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Détail Produit - MedSupply Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#0A2647",
            secondary: "#144272",
            accent: "#2C74B3",
            success: "#16A34A",
            warning: "#D97706",
            danger: "#DC2626",
            background: "#F8FAFC",
            surface: "#FFFFFF",
            border: "#E2E8F0",
            textPrimary: "#0F172A",
            textSecondary: "#64748B",
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-background">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <aside id="sidebar" class="bg-white border-r border-gray-200 flex-shrink-0"></aside>
    
    <!-- Main Content -->
    <div class="flex-1 flex flex-col ">
      <!-- Header -->
      <header id="header"></header>
      
      <!-- Content -->
      <main id="main-content" class="flex-1 p-6 overflow-y-auto">
        <!-- Breadcrumb -->
        <nav class="flex items-center gap-2 text-sm mb-6">
          <a href="catalog.html" class="text-textSecondary hover:text-accent">Catalogue</a>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i>
          <span class="text-textPrimary font-medium" id="breadcrumb-name">Chargement...</span>
        </nav>

        <div class="flex flex-col lg:flex-row gap-8">
          <!-- Left: Product Image -->
          <div class="w-full lg:w-1/2">
            <div class="bg-surface rounded-xl shadow-sm border border-border p-6 sticky top-6">
              <div class="aspect-square bg-gray-100 rounded-lg overflow-hidden mb-4">
                ${product.imageUrl 
                  ? `<img src="${product.imageUrl}" alt="${product.name}" class="w-full h-full object-cover">`
                  : `<div class="w-full h-full flex items-center justify-center bg-primary bg-opacity-10">
                      <i data-lucide="package" class="w-24 h-24 text-primary"></i>
                    </div>`
                }
              </div>
              <div class="flex gap-2">
                <div class="w-20 h-20 bg-gray-100 rounded-lg overflow-hidden cursor-pointer border-2 border-accent">
                  <img src="${product.imageUrl}" alt="" class="w-full h-full object-cover">
                </div>
                <div class="w-20 h-20 bg-gray-100 rounded-lg overflow-hidden cursor-pointer border-2 border-transparent hover:border-gray-300">
                  <img src="${product.imageUrl}" alt="" class="w-full h-full object-cover">
                </div>
              </div>
            </div>
          </div>

          <!-- Right: Product Info -->
          <div class="w-full lg:w-1/2">
            <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
              <!-- Category Badge -->
              <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-blue-100 text-blue-800 mb-4" id="product-category">--</span>

              <!-- Product Name -->
              <h1 class="text-3xl font-bold text-textPrimary mb-2" id="product-name">Chargement...</h1>

              <!-- Brand & Reference -->
              <p class="text-textSecondary mb-4">
                <span id="product-brand">--</span> · <span class="font-mono" id="product-reference">--</span>
              </p>

              <!-- Price -->
              <div class="mb-6">
                <p class="text-4xl font-bold text-accent" id="product-price">--</p>
                <p class="text-sm text-textSecondary">Prix unitaire</p>
              </div>

              <!-- Stock Status -->
              <div class="mb-6" id="stock-status">
                <!-- Stock badge will be rendered here -->
              </div>

              <!-- Warranty -->
              <div class="flex items-center gap-2 mb-6 text-textSecondary">
                <i data-lucide="shield-check" class="w-5 h-5"></i>
                <span>Garantie <span id="product-warranty">--</span> mois</span>
              </div>

              <!-- Quantity Input & Add to Quote Button -->
              <div class="flex items-center gap-4 mb-6">
                <div class="flex items-center border border-border rounded-lg">
                  <button onclick="decreaseQuantity()" class="px-4 py-2 hover:bg-gray-50 transition-colors">
                    <i data-lucide="minus" class="w-4 h-4"></i>
                  </button>
                  <input type="number" id="quantity" value="1" min="1"
                    class="w-16 px-4 py-2 text-center border-x border-border focus:outline-none">
                  <button onclick="increaseQuantity()" class="px-4 py-2 hover:bg-gray-50 transition-colors">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                  </button>
                </div>
                <button onclick="openQuoteModal()" class="flex-1 bg-primary hover:bg-secondary text-white font-medium py-3 rounded-lg transition-colors">
                  Demander un devis
                </button>
              </div>

              <!-- Specs Table -->
              <div class="border-t border-border pt-6">
                <h3 class="font-semibold text-textPrimary mb-4">Spécifications</h3>
                <table class="w-full">
                  <tbody class="divide-y divide-border">
                    <tr>
                      <td class="py-3 text-textSecondary">Référence</td>
                      <td class="py-3 text-textPrimary font-mono" id="spec-reference">--</td>
                    </tr>
                    <tr>
                      <td class="py-3 text-textSecondary">Marque</td>
                      <td class="py-3 text-textPrimary" id="spec-brand">--</td>
                    </tr>
                    <tr>
                      <td class="py-3 text-textSecondary">Catégorie</td>
                      <td class="py-3 text-textPrimary" id="spec-category">--</td>
                    </tr>
                    <tr>
                      <td class="py-3 text-textSecondary">Fournisseur</td>
                      <td class="py-3 text-textPrimary" id="spec-supplier">--</td>
                    </tr>
                    <tr>
                      <td class="py-3 text-textSecondary">Garantie</td>
                      <td class="py-3 text-textPrimary" id="spec-warranty">--</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>

            <!-- Description -->
            <div class="bg-surface rounded-xl shadow-sm border border-border p-6 mt-6">
              <h3 class="font-semibold text-textPrimary mb-4">Description</h3>
              <p class="text-textSecondary leading-relaxed" id="product-description">--</p>
            </div>
          </div>
        </div>

        <!-- Related Products -->
        <div class="mt-8">
          <h2 class="text-xl font-bold text-textPrimary mb-4">Produits similaires</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4" id="related-products">
            <!-- Related products will be loaded dynamically -->
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Quote Modal -->
  <div id="quote-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-surface rounded-xl shadow-lg border border-border p-6 w-full max-w-md">
      <h3 class="text-lg font-bold text-textPrimary mb-4">Demander un devis</h3>
      <div class="mb-4">
        <label class="block text-sm font-medium text-textPrimary mb-2">Quantité</label>
        <input type="number" id="modal-quantity" min="1"
          class="w-full px-4 py-3 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all">
      </div>
      <div class="mb-4">
        <label class="block text-sm font-medium text-textPrimary mb-2">Message (optionnel)</label>
        <textarea id="modal-message" rows="3"
          class="w-full px-4 py-3 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all resize-none"
          placeholder="Ajoutez un message à votre demande..."></textarea>
      </div>
      <div class="flex justify-end gap-2">
        <button onclick="closeQuoteModal()" class="bg-gray-200 hover:bg-gray-300 text-textPrimary font-medium px-4 py-2 rounded-lg transition-colors">
          Annuler
        </button>
        <button onclick="submitQuote()" class="bg-primary hover:bg-secondary text-white font-medium px-4 py-2 rounded-lg transition-colors">
          Envoyer
        </button>
      </div>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    requireAuth(["CLIENT"]);
    const currentUser = getCurrentUser();
  </script>
  <script src="../../js/router.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/header.js"></script>
  <script src="../../js/utils/format.js"></script>
  <script>
    initPage("CLIENT");

    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');

    async function loadProduct() {
      try {
        const response = await apiFetch(`/client/catalog/${productId}`);
        const product = response.data;

        // Update breadcrumb
        document.getElementById('breadcrumb-name').textContent = product.name;

        // Update product image
        const imageContainer = document.querySelector('.aspect-square');
        if (product.imageUrl) {
          imageContainer.innerHTML = `<img src="${product.imageUrl}" alt="${product.name}" class="w-full h-full object-cover">`;
        } else {
          imageContainer.innerHTML = `<div class="w-full h-full flex items-center justify-center bg-primary bg-opacity-10"><i data-lucide="package" class="w-24 h-24 text-primary"></i></div>`;
        }

        // Update product info
        document.getElementById('product-category').textContent = product.category;
        document.getElementById('product-name').textContent = product.name;
        document.getElementById('product-brand').textContent = product.brand;
        document.getElementById('product-reference').textContent = product.reference;
        document.getElementById('product-price').textContent = formatCurrency(product.unitPrice);
        document.getElementById('product-warranty').textContent = product.warrantyMonths;

        // Update stock status
        const stockStatus = document.getElementById('stock-status');
        if (product.quantity === 0) {
          stockStatus.innerHTML = `<span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-red-100 text-red-800"><i data-lucide="x-circle" class="w-4 h-4 mr-1"></i>Rupture de stock</span>`;
        } else if (product.quantity <= product.minQuantity) {
          stockStatus.innerHTML = `<span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-yellow-100 text-yellow-800"><i data-lucide="alert-triangle" class="w-4 h-4 mr-1"></i>Stock limité (${product.quantity} unités)</span>`;
        } else {
          stockStatus.innerHTML = `<span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-green-100 text-green-800"><i data-lucide="check-circle" class="w-4 h-4 mr-1"></i>En stock (${product.quantity} unités)</span>`;
        }

        // Update specs table
        document.getElementById('spec-reference').textContent = product.reference;
        document.getElementById('spec-brand').textContent = product.brand;
        document.getElementById('spec-category').textContent = product.category;
        document.getElementById('spec-supplier').textContent = product.supplier;
        document.getElementById('spec-warranty').textContent = `${product.warrantyMonths} mois`;

        // Update description
        document.getElementById('product-description').textContent = product.description || 'Aucune description disponible.';

        // Load related products
        loadRelatedProducts(product.category, product.productId);

        lucide.createIcons();
      } catch (error) {
        console.error("Failed to load product:", error);
      }
    }

    async function loadRelatedProducts(category, currentProductId) {
      try {
        const response = await apiFetch(`/client/catalog/related?category=${category}&exclude=${currentProductId}`);
        const products = response.data || [];
        const container = document.getElementById('related-products');

        if (products.length === 0) {
          container.innerHTML = `<p class="text-textSecondary col-span-full">Aucun produit similaire</p>`;
        } else {
          container.innerHTML = products.slice(0, 4).map(product => `
            <div class="bg-surface rounded-xl shadow-sm border border-border overflow-hidden hover:shadow-md transition-shadow cursor-pointer" onclick="viewProduct('${product.productId}')">
              <div class="aspect-[4/3] bg-gray-100 relative">
                ${product.imageUrl 
                  ? `<img src="${product.imageUrl}" alt="${product.name}" class="w-full h-full object-cover">`
                  : `<div class="w-full h-full flex items-center justify-center bg-primary bg-opacity-10">
                      <i data-lucide="package" class="w-8 h-8 text-primary"></i>
                    </div>`
                }
              </div>
              <div class="p-3">
                <h4 class="font-medium text-textPrimary text-sm mb-1">${product.name}</h4>
                <p class="text-accent font-bold">${formatCurrency(product.unitPrice)}</p>
              </div>
            </div>
          `).join('');
        }

        lucide.createIcons();
      } catch (error) {
        console.error("Failed to load related products:", error);
      }
    }

    function decreaseQuantity() {
      const input = document.getElementById('quantity');
      if (parseInt(input.value) > 1) {
        input.value = parseInt(input.value) - 1;
      }
    }

    function increaseQuantity() {
      const input = document.getElementById('quantity');
      input.value = parseInt(input.value) + 1;
    }

    function openQuoteModal() {
      const quantity = document.getElementById('quantity').value;
      document.getElementById('modal-quantity').value = quantity;
      document.getElementById('quote-modal').classList.remove('hidden');
    }

    function closeQuoteModal() {
      document.getElementById('quote-modal').classList.add('hidden');
      document.getElementById('modal-message').value = '';
    }

    async function submitQuote() {
      const quantity = document.getElementById('modal-quantity').value;
      const message = document.getElementById('modal-message').value;

      try {
        await apiFetch('/client/quotes', {
          method: 'POST',
          body: JSON.stringify({
            productId: productId,
            quantity: parseInt(quantity),
            message: message
          })
        });
        closeQuoteModal();
        alert('Demande de devis envoyée avec succès !');
      } catch (error) {
        console.error("Failed to submit quote:", error);
        alert('Erreur lors de l\'envoi de la demande de devis');
      }
    }

    function viewProduct(productId) {
      window.location.href = `product-detail.html?id=${productId}`;
    }

    // Load product on page load
    if (productId) {
      loadProduct();
    } else {
      window.location.href = '/medsupply-cloud/pages/catalog.html';
    }
  </script>
</body>
</html>
