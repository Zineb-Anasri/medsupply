<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Détail Produit - MedSupply Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#0A2647",
            secondary: "#144272",
            accent: "#2C74B3",
            success: "#16A34A",
            warning: "#D97706",
            danger: "#DC2626",
            background: "#F8FAFC",
            surface: "#FFFFFF",
            border: "#E2E8F0",
            textPrimary: "#0F172A",
            textSecondary: "#64748B",
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-background">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <aside id="sidebar" class="bg-white border-r border-gray-200 flex-shrink-0"></aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-w-0">
      <!-- Header -->
      <header id="header"></header>

      <!-- Content -->
      <main id="main-content" class="flex-1 p-6 overflow-y-auto">
        <!-- Breadcrumb -->
        <nav class="flex items-center gap-2 text-sm mb-6">
          <a href="catalog.html" class="text-textSecondary hover:text-accent">Catalogue</a>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i>
          <span class="text-textPrimary font-medium" id="breadcrumb-name">Chargement...</span>
        </nav>

        <div class="flex flex-col lg:flex-row gap-8">
          <!-- Left: Product Image -->
          <div class="w-full lg:w-1/2">
            <div class="bg-surface rounded-xl shadow-sm border border-border p-6 sticky top-6">
              <div id="image-container" class="aspect-square bg-gray-100 rounded-lg overflow-hidden">
                <div class="w-full h-full flex items-center justify-center bg-primary bg-opacity-10">
                  <i data-lucide="package" class="w-24 h-24 text-primary"></i>
                </div>
              </div>
            </div>
          </div>

          <!-- Right: Product Info -->
          <div class="w-full lg:w-1/2">
            <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
              <!-- Product Name -->
              <h1 class="text-3xl font-bold text-textPrimary mb-2" id="product-name">Chargement...</h1>

              <!-- Reference -->
              <p class="text-textSecondary mb-4">
                Référence : <span class="font-mono" id="product-reference">--</span>
              </p>

              <!-- Price -->
              <div class="mb-6">
                <p class="text-4xl font-bold text-accent" id="product-price">--</p>
                <p class="text-sm text-textSecondary">Prix unitaire</p>
              </div>

              <!-- Warranty -->
              <div id="warranty-row" class="flex items-center gap-2 mb-6 text-textSecondary hidden">
                <i data-lucide="shield-check" class="w-5 h-5"></i>
                <span>Garantie <span id="product-warranty">--</span></span>
              </div>

              <!-- Quantity Input & Request Quote Button -->
              <div class="flex items-center gap-4 mb-6">
                <div class="flex items-center border border-border rounded-lg">
                  <button onclick="decreaseQuantity()" class="px-4 py-2 hover:bg-gray-50 transition-colors">
                    <i data-lucide="minus" class="w-4 h-4"></i>
                  </button>
                  <input type="number" id="quantity" value="1" min="1"
                    class="w-16 px-4 py-2 text-center border-x border-border focus:outline-none">
                  <button onclick="increaseQuantity()" class="px-4 py-2 hover:bg-gray-50 transition-colors">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                  </button>
                </div>
                <button onclick="openQuoteModal()" class="flex-1 bg-accent hover:bg-secondary text-white font-medium py-3 rounded-lg transition-colors">
                  Demander un devis
                </button>
              </div>

              <!-- Specs Table -->
              <div class="border-t border-border pt-6">
                <h3 class="font-semibold text-textPrimary mb-4">Spécifications</h3>
                <table class="w-full">
                  <tbody class="divide-y divide-border">
                    <tr>
                      <td class="py-3 text-textSecondary">Référence</td>
                      <td class="py-3 text-textPrimary font-mono" id="spec-reference">--</td>
                    </tr>
                    <tr id="spec-warranty-row">
                      <td class="py-3 text-textSecondary">Garantie</td>
                      <td class="py-3 text-textPrimary" id="spec-warranty">--</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>

            <!-- Description -->
            <div class="bg-surface rounded-xl shadow-sm border border-border p-6 mt-6">
              <h3 class="font-semibold text-textPrimary mb-4">Description</h3>
              <p class="text-textSecondary leading-relaxed" id="product-description">Chargement...</p>
            </div>
          </div>
        </div>

        <!-- Related Products -->
        <div class="mt-8 hidden" id="related-section">
          <h2 class="text-xl font-bold text-textPrimary mb-4">Produits similaires</h2>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4" id="related-products">
            <!-- Related products will be loaded dynamically -->
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Quote Modal -->
  <div id="quote-modal" class="fixed inset-0 bg-black bg-opacity-50 items-center justify-center hidden z-50">
    <div class="bg-surface rounded-xl shadow-lg border border-border p-6 w-full max-w-md">
      <h3 class="text-lg font-bold text-textPrimary mb-4">Demander un devis</h3>
      <p class="text-sm text-textSecondary mb-4" id="modal-product-name">--</p>
      <div class="mb-6">
        <label class="block text-sm font-medium text-textPrimary mb-2">Quantité</label>
        <input type="number" id="modal-quantity" min="1" value="1"
          class="w-full px-4 py-3 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all">
      </div>
      <div class="flex justify-end gap-2">
        <button onclick="closeQuoteModal()" class="bg-gray-200 hover:bg-gray-300 text-textPrimary font-medium px-4 py-2 rounded-lg transition-colors">
          Annuler
        </button>
        <button id="modal-submit-btn" onclick="submitQuote()" class="bg-accent hover:bg-secondary text-white font-medium px-4 py-2 rounded-lg transition-colors">
          Envoyer la demande
        </button>
      </div>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    requireAuth(["CLIENT"]);
  </script>
  <script src="../../js/router.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/header.js"></script>
  <script src="../../js/components/badge.js"></script>
  <script src="../../js/components/toast.js"></script>
  <script src="../../js/components/modal.js"></script>
  <script src="../../js/utils/format.js"></script>
  <script>
    initPage("CLIENT");
    renderSidebar(getCurrentRole().toLowerCase());
    renderHeader();

    const productId = new URLSearchParams(window.location.search).get('id');
    let currentProduct = null;

    function escapeHtml(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    async function loadProduct() {
      const r = await apiFetch('/products/' + productId);
      if (!r || !r.ok) {
        showToast(r?.data?.message || 'Produit introuvable', 'error');
        window.location.href = 'catalog.html';
        return;
      }
      const product = r.data.product;
      if (!product) {
        showToast('Produit introuvable', 'error');
        window.location.href = 'catalog.html';
        return;
      }
      currentProduct = product;

      // Breadcrumb + name
      document.getElementById('breadcrumb-name').textContent = product.name || ('#' + String(product.id).slice(0, 8));
      document.getElementById('product-name').textContent = product.name || ('#' + String(product.id).slice(0, 8));
      document.getElementById('modal-product-name').textContent = product.name || '';

      // Image
      const imageContainer = document.getElementById('image-container');
      if (product.imageUrl) {
        imageContainer.innerHTML =
          '<img src="' + escapeHtml(product.imageUrl) + '" alt="' + escapeHtml(product.name || '') + '" class="w-full h-full object-cover">';
      } else {
        imageContainer.innerHTML =
          '<div class="w-full h-full flex items-center justify-center bg-primary bg-opacity-10"><i data-lucide="package" class="w-24 h-24 text-primary"></i></div>';
      }

      // Reference + price
      document.getElementById('product-reference').textContent = product.reference || '--';
      document.getElementById('spec-reference').textContent = product.reference || '--';
      document.getElementById('product-price').textContent =
        (product.unitPrice != null) ? formatCurrency(product.unitPrice) : '--';

      // Warranty (hide if null)
      if (product.warrantyMonths != null) {
        document.getElementById('product-warranty').textContent = product.warrantyMonths + ' mois';
        document.getElementById('spec-warranty').textContent = product.warrantyMonths + ' mois';
        document.getElementById('warranty-row').classList.remove('hidden');
      } else {
        document.getElementById('warranty-row').classList.add('hidden');
        document.getElementById('spec-warranty-row').classList.add('hidden');
      }

      // Description
      document.getElementById('product-description').textContent =
        product.description || 'Aucune description disponible.';

      lucide.createIcons();

      // Related products
      loadRelatedProducts(product);
    }

    async function loadRelatedProducts(product) {
      if (!product.categoryId) {
        document.getElementById('related-section').classList.add('hidden');
        return;
      }
      const r = await apiFetch('/products?categoryId=' + encodeURIComponent(product.categoryId));
      if (!r || !r.ok) return;
      const related = (r.data.products || [])
        .filter(p => p.id !== product.id)
        .slice(0, 4);

      const section = document.getElementById('related-section');
      const container = document.getElementById('related-products');
      if (related.length === 0) {
        section.classList.add('hidden');
        return;
      }
      section.classList.remove('hidden');
      container.innerHTML = related.map(p => `
        <a href="product-detail.html?id=${encodeURIComponent(p.id)}"
           class="block bg-surface rounded-xl shadow-sm border border-border overflow-hidden hover:shadow-md transition-shadow">
          <div class="aspect-[4/3] bg-gray-100 relative">
            ${p.imageUrl
              ? `<img src="${escapeHtml(p.imageUrl)}" alt="${escapeHtml(p.name || '')}" class="w-full h-full object-cover">`
              : `<div class="w-full h-full flex items-center justify-center bg-primary bg-opacity-10"><i data-lucide="package" class="w-8 h-8 text-primary"></i></div>`}
          </div>
          <div class="p-3">
            <h4 class="font-medium text-textPrimary text-sm mb-1 truncate">${escapeHtml(p.name || ('#' + String(p.id).slice(0, 8)))}</h4>
            <p class="text-accent font-bold">${p.unitPrice != null ? formatCurrency(p.unitPrice) : '--'}</p>
          </div>
        </a>
      `).join('');
      lucide.createIcons();
    }

    function decreaseQuantity() {
      const input = document.getElementById('quantity');
      const val = parseInt(input.value, 10) || 1;
      if (val > 1) input.value = val - 1;
    }

    function increaseQuantity() {
      const input = document.getElementById('quantity');
      const val = parseInt(input.value, 10) || 1;
      input.value = val + 1;
    }

    function openQuoteModal() {
      const quantity = parseInt(document.getElementById('quantity').value, 10) || 1;
      document.getElementById('modal-quantity').value = quantity;
      openModal('quote-modal');
    }

    function closeQuoteModal() {
      closeModal('quote-modal');
    }

    async function submitQuote() {
      const qty = parseInt(document.getElementById('modal-quantity').value, 10);
      if (!qty || qty < 1) {
        showToast('Veuillez saisir une quantité valide', 'warning');
        return;
      }
      const btn = document.getElementById('modal-submit-btn');
      btn.disabled = true;
      btn.textContent = 'Envoi...';

      const r = await apiFetch('/quotes', {
        method: 'POST',
        body: JSON.stringify({ items: [{ productId: productId, quantity: qty }] })
      });

      btn.disabled = false;
      btn.textContent = 'Envoyer la demande';

      if (!r || !r.ok) {
        showToast(r?.data?.message || "Erreur lors de la création du devis", 'error');
        return;
      }
      closeQuoteModal();
      showToast('Demande de devis créée', 'success');
      setTimeout(() => { window.location.href = 'quotes.html'; }, 900);
    }

    if (productId) {
      loadProduct();
    } else {
      window.location.href = 'catalog.html';
    }
  </script>
</body>
</html>
