<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Détail Commande - MedSupply Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: {
      primary: "#0A2647", secondary: "#144272", accent: "#2C74B3",
      success: "#16A34A", warning: "#D97706", danger: "#DC2626",
      background: "#F8FAFC", surface: "#FFFFFF", border: "#E2E8F0",
      textPrimary: "#0F172A", textSecondary: "#64748B" } } } };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style> body { font-family: 'Inter', sans-serif; } .font-mono { font-family: 'JetBrains Mono', monospace; } </style>
</head>
<body class="bg-background">
  <div class="flex h-screen">
    <aside id="sidebar" class="bg-white border-r border-gray-200 flex-shrink-0"></aside>
    <div class="flex-1 flex flex-col">
      <header id="header"></header>
      <main id="main-content" class="flex-1 p-6 overflow-y-auto">
        <div class="flex items-center gap-3 mb-6">
          <a href="/medsupply-cloud/pages/client/orders.html" class="p-2 rounded-lg hover:bg-gray-100"><i data-lucide="arrow-left" class="w-5 h-5 text-textSecondary"></i></a>
          <div><h1 class="text-2xl font-bold text-textPrimary" id="order-title">Commande</h1><p class="text-textSecondary" id="order-sub">Chargement...</p></div>
        </div>
        <div id="content" class="grid grid-cols-1 lg:grid-cols-3 gap-6"><p class="text-textSecondary">Chargement...</p></div>
      </main>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script>requireAuth(["CLIENT"]);</script>
  <script src="../../js/router.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/header.js"></script>
  <script src="../../js/components/badge.js"></script>
  <script src="../../js/components/toast.js"></script>
  <script src="../../js/utils/format.js"></script>
  <script>
    initPage("CLIENT");
    renderSidebar(getCurrentRole().toLowerCase());
    renderHeader();

    const orderId = new URLSearchParams(location.search).get("id");
    const STEPS = ["PENDING", "PROCESSING", "SHIPPED", "DELIVERED", "COMPLETED"];
    let productMap = {};

    async function load() {
      if (!orderId) { location.href = "orders.html"; return; }
      const pr = await apiFetch("/products");
      if (pr && pr.ok) (pr.data.products || []).forEach((p) => (productMap[p.id] = p));

      const r = await apiFetch(`/orders/${orderId}`);
      if (!r || !r.ok) { document.getElementById("content").innerHTML = `<p class="text-danger">${r?.data?.message || "Commande introuvable"}</p>`; return; }

      // payment (best effort from the client's payment list)
      let payment = null;
      const pay = await apiFetch("/payments");
      if (pay && pay.ok) payment = (pay.data.payments || []).find((p) => p.orderId === orderId) || null;

      render(r.data.order, r.data.items || [], payment);
    }

    function render(order, items, payment) {
      document.getElementById("order-title").textContent = "Commande #" + order.orderId.slice(0, 8);
      document.getElementById("order-sub").innerHTML = `Passée le ${formatDate(order.createdAt)} &middot; ${renderBadge(order.status)}`;

      const idx = STEPS.indexOf(order.status);
      const stepper = STEPS.map((s, i) => `
        <div class="flex-1 flex flex-col items-center text-center">
          <div class="w-8 h-8 rounded-full flex items-center justify-center ${i <= idx ? "bg-accent text-white" : "bg-gray-200 text-gray-400"}">
            ${i < idx ? '<i data-lucide="check" class="w-4 h-4"></i>' : i + 1}
          </div>
          <span class="text-[11px] mt-1 ${i <= idx ? "text-textPrimary font-medium" : "text-textSecondary"}">${renderBadge(s).replace(/<[^>]+>/g, "")}</span>
        </div>`).join('<div class="flex-1 h-px bg-gray-200 mt-4"></div>');

      const rows = items.map((it) => {
        const p = productMap[it.productId] || {};
        return `<tr class="border-b border-border">
          <td class="px-4 py-3"><p class="font-medium text-textPrimary">${p.name || "Produit #" + it.productId.slice(0, 8)}</p><p class="text-xs text-textSecondary font-mono">${p.reference || ""}</p></td>
          <td class="px-4 py-3 text-center">${it.quantity}</td>
          <td class="px-4 py-3 text-right">${it.unitPrice != null ? formatCurrency(it.unitPrice) : "—"}</td>
          <td class="px-4 py-3 text-right font-semibold">${it.totalPrice != null ? formatCurrency(it.totalPrice) : (it.unitPrice != null ? formatCurrency(it.unitPrice * it.quantity) : "—")}</td>
        </tr>`;
      }).join("");

      const payCard = payment
        ? `<div class="bg-surface rounded-xl shadow-sm border border-border p-6">
             <h3 class="font-semibold text-textPrimary mb-3">Paiement</h3>
             <div class="flex items-center justify-between mb-2"><span class="text-textSecondary text-sm">Statut</span>${renderBadge(payment.status)}</div>
             <div class="flex items-center justify-between mb-2"><span class="text-textSecondary text-sm">Payé</span><span class="font-medium">${formatCurrency(payment.paidAmount || 0)} / ${formatCurrency(payment.amount || 0)}</span></div>
             ${["PENDING", "PARTIAL", "OVERDUE"].includes(payment.status) ? `<a href="payments.html" class="mt-3 block text-center bg-accent hover:bg-secondary text-white font-medium py-2 rounded-lg">Régler</a>` : ""}
           </div>`
        : `<div class="bg-surface rounded-xl shadow-sm border border-border p-6"><h3 class="font-semibold text-textPrimary mb-1">Paiement</h3><p class="text-sm text-textSecondary">Aucun paiement enregistré pour le moment.</p></div>`;

      document.getElementById("content").innerHTML = `
        <div class="lg:col-span-2 space-y-6">
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <h2 class="font-semibold text-textPrimary mb-6">Suivi</h2>
            <div class="flex items-start">${stepper}</div>
          </div>
          <div class="bg-surface rounded-xl shadow-sm border border-border overflow-hidden">
            <div class="px-6 py-4 border-b border-border"><h2 class="font-semibold text-textPrimary">Articles</h2></div>
            <table class="w-full text-sm">
              <thead class="bg-gray-50 text-xs uppercase text-textSecondary"><tr><th class="px-4 py-2 text-left">Produit</th><th class="px-4 py-2 text-center">Qté</th><th class="px-4 py-2 text-right">PU</th><th class="px-4 py-2 text-right">Total</th></tr></thead>
              <tbody>${rows || `<tr><td colspan="4" class="px-4 py-6 text-center text-textSecondary">Aucun article</td></tr>`}</tbody>
            </table>
          </div>
        </div>
        <div class="space-y-6">
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <p class="text-textSecondary text-sm">Montant total</p>
            <p class="text-3xl font-bold text-textPrimary">${order.totalAmount != null ? formatCurrency(order.totalAmount) : "—"}</p>
          </div>
          ${payCard}
        </div>`;
      lucide.createIcons();
    }

    load();
  </script>
</body>
</html>
