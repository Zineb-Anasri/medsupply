<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nouveau Devis - MedSupply Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#0A2647", secondary: "#144272", accent: "#2C74B3",
              success: "#16A34A", warning: "#D97706", danger: "#DC2626",
              background: "#F8FAFC", surface: "#FFFFFF", border: "#E2E8F0",
              textPrimary: "#0F172A", textSecondary: "#64748B",
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
      body { font-family: "Inter", sans-serif; }
      .font-mono { font-family: "JetBrains Mono", monospace; }
    </style>
  </head>
  <body class="bg-background">
    <div class="flex h-screen">
      <aside id="sidebar" class="bg-white border-r border-gray-200 flex-shrink-0"></aside>
      <div class="flex-1 flex flex-col">
        <header id="header"></header>
        <main id="main-content" class="flex-1 p-6 overflow-y-auto">
          <div class="flex items-center gap-3 mb-6">
            <a href="/medsupply-cloud/pages/client/quotes.html" class="p-2 rounded-lg hover:bg-gray-100">
              <i data-lucide="arrow-left" class="w-5 h-5 text-textSecondary"></i>
            </a>
            <div>
              <h1 class="text-2xl font-bold text-textPrimary">Nouveau devis</h1>
              <p class="text-textSecondary">Sélectionnez les produits et quantités souhaités</p>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Catalog -->
            <div class="lg:col-span-2 bg-surface rounded-xl shadow-sm border border-border p-6">
              <div class="flex items-center gap-3 mb-4">
                <div class="relative flex-1">
                  <i data-lucide="search" class="w-4 h-4 text-textSecondary absolute left-3 top-1/2 -translate-y-1/2"></i>
                  <input id="product-search" oninput="renderCatalog()" type="text" placeholder="Rechercher un produit..."
                         class="w-full pl-9 pr-4 py-2 border border-border rounded-lg outline-none focus:ring-2 focus:ring-accent" />
                </div>
              </div>
              <div id="catalog" class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-[60vh] overflow-y-auto">
                <p class="text-textSecondary">Chargement du catalogue...</p>
              </div>
            </div>

            <!-- Selection -->
            <div class="bg-surface rounded-xl shadow-sm border border-border p-6 h-fit">
              <h2 class="text-lg font-semibold text-textPrimary mb-4">Articles sélectionnés</h2>
              <div id="cart" class="space-y-3 mb-4">
                <p class="text-textSecondary text-sm">Aucun article. Ajoutez des produits depuis le catalogue.</p>
              </div>
              <div class="border-t border-border pt-4 flex items-center justify-between mb-4">
                <span class="text-textSecondary">Total estimé</span>
                <span class="font-bold text-textPrimary" id="cart-total">0,00 MAD</span>
              </div>
              <p class="text-xs text-textSecondary mb-4">Prix indicatifs (catalogue). L'administrateur confirmera les prix dans le devis.</p>
              <button id="submit-btn" onclick="submitQuote()" disabled
                      class="w-full bg-accent hover:bg-secondary disabled:opacity-50 disabled:cursor-not-allowed text-white font-medium px-4 py-3 rounded-lg transition-colors flex items-center justify-center gap-2">
                <i data-lucide="send" class="w-5 h-5"></i> Envoyer la demande
              </button>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script>requireAuth(["CLIENT"]);</script>
    <script src="../../js/router.js"></script>
    <script src="../../js/components/sidebar.js"></script>
    <script src="../../js/components/header.js"></script>
    <script src="../../js/components/badge.js"></script>
    <script src="../../js/components/toast.js"></script>
    <script src="../../js/utils/format.js"></script>
    <script>
      initPage("CLIENT");
      renderSidebar(getCurrentRole().toLowerCase());
      renderHeader();

      let products = [];
      const cart = {}; // productId -> { product, quantity }

      async function loadProducts() {
        const r = await apiFetch("/products");
        if (!r || !r.ok) {
          document.getElementById("catalog").innerHTML =
            `<p class="text-danger">${r?.data?.message || "Erreur de chargement du catalogue"}</p>`;
          return;
        }
        products = r.data.products || [];
        renderCatalog();
      }

      function renderCatalog() {
        const q = (document.getElementById("product-search").value || "").toLowerCase();
        const list = products.filter(
          (p) => !q || (p.name || "").toLowerCase().includes(q) || (p.reference || "").toLowerCase().includes(q)
        );
        const el = document.getElementById("catalog");
        if (list.length === 0) { el.innerHTML = `<p class="text-textSecondary">Aucun produit trouvé</p>`; return; }
        el.innerHTML = list.map((p) => `
          <div class="border border-border rounded-lg p-3 flex flex-col justify-between">
            <div>
              <p class="font-medium text-textPrimary text-sm leading-tight">${p.name || "Produit"}</p>
              <p class="text-xs text-textSecondary font-mono">${p.reference || ""}</p>
              <p class="text-sm font-semibold text-accent mt-1">${p.unitPrice != null ? formatCurrency(p.unitPrice) : "—"}</p>
            </div>
            <button onclick="addToCart('${p.id}')" class="mt-2 text-sm bg-blue-50 hover:bg-blue-100 text-accent font-medium py-1.5 rounded-lg transition-colors flex items-center justify-center gap-1">
              <i data-lucide="plus" class="w-4 h-4"></i> Ajouter
            </button>
          </div>`).join("");
        lucide.createIcons();
      }

      function addToCart(productId) {
        const product = products.find((p) => p.id === productId);
        if (!product) return;
        if (!cart[productId]) cart[productId] = { product, quantity: 0 };
        cart[productId].quantity += 1;
        renderCart();
      }

      function setQty(productId, qty) {
        qty = parseInt(qty, 10);
        if (!cart[productId]) return;
        if (!qty || qty < 1) { delete cart[productId]; } else { cart[productId].quantity = qty; }
        renderCart();
      }

      function renderCart() {
        const items = Object.values(cart);
        const el = document.getElementById("cart");
        const submitBtn = document.getElementById("submit-btn");
        if (items.length === 0) {
          el.innerHTML = `<p class="text-textSecondary text-sm">Aucun article. Ajoutez des produits depuis le catalogue.</p>`;
          document.getElementById("cart-total").textContent = formatCurrency(0);
          submitBtn.disabled = true;
          return;
        }
        let total = 0;
        el.innerHTML = items.map(({ product, quantity }) => {
          total += (product.unitPrice || 0) * quantity;
          return `
          <div class="flex items-center gap-2">
            <div class="flex-1 min-w-0">
              <p class="text-sm font-medium text-textPrimary truncate">${product.name}</p>
              <p class="text-xs text-textSecondary">${formatCurrency(product.unitPrice || 0)} / u.</p>
            </div>
            <input type="number" min="1" value="${quantity}" onchange="setQty('${product.id}', this.value)"
                   class="w-16 px-2 py-1 border border-border rounded text-sm text-center" />
            <button onclick="setQty('${product.id}', 0)" class="text-danger hover:bg-red-50 p-1 rounded">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>`;
        }).join("");
        document.getElementById("cart-total").textContent = formatCurrency(total);
        submitBtn.disabled = false;
        lucide.createIcons();
      }

      async function submitQuote() {
        const items = Object.values(cart).map(({ product, quantity }) => ({ productId: product.id, quantity }));
        if (items.length === 0) { showToast("Ajoutez au moins un produit", "warning"); return; }
        const btn = document.getElementById("submit-btn");
        btn.disabled = true;
        const r = await apiFetch("/quotes", { method: "POST", body: JSON.stringify({ items }) });
        if (r && r.ok && r.data.success) {
          showToast("Demande de devis envoyée", "success");
          setTimeout(() => (location.href = "quotes.html"), 800);
        } else {
          showToast(r?.data?.message || "Échec de l'envoi", "error");
          btn.disabled = false;
        }
      }

      loadProducts();
    </script>
  </body>
</html>
