<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tableau de bord - Client - MedSupply Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#0A2647",
              secondary: "#144272",
              accent: "#2C74B3",
              success: "#16A34A",
              warning: "#D97706",
              danger: "#DC2626",
              background: "#F8FAFC",
              surface: "#FFFFFF",
              border: "#E2E8F0",
              textPrimary: "#0F172A",
              textSecondary: "#64748B",
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="bg-background">
    <div class="flex h-screen">
      <!-- Sidebar -->
      <aside
        id="sidebar"
        class="bg-white border-r border-gray-200 flex-shrink-0"
      ></aside>

      <!-- Main Content -->
      <div class="flex-1 flex flex-col ">
        <!-- Header -->
        <header id="header"></header>

        <!-- Content -->
        <main id="main-content" class="flex-1 p-6 overflow-y-auto">
          <!-- Quick Actions -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <a
              href="/medsupply-cloud/pages/client/quote-new.html"
              class="bg-surface rounded-xl shadow-sm border border-border p-6 hover:border-accent transition-colors cursor-pointer"
            >
              <div class="flex items-center gap-4">
                <div
                  class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center"
                >
                  <i data-lucide="file-plus" class="w-6 h-6 text-blue-600"></i>
                </div>
                <div>
                  <p class="font-semibold text-textPrimary">Nouveau devis</p>
                  <p class="text-sm text-textSecondary">Créer une demande</p>
                </div>
              </div>
            </a>

            <a
              href="/medsupply-cloud/pages/client/catalog.html"
              class="bg-surface rounded-xl shadow-sm border border-border p-6 hover:border-accent transition-colors cursor-pointer"
            >
              <div class="flex items-center gap-4">
                <div
                  class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center"
                >
                  <i
                    data-lucide="shopping-bag"
                    class="w-6 h-6 text-green-600"
                  ></i>
                </div>
                <div>
                  <p class="font-semibold text-textPrimary">Catalogue</p>
                  <p class="text-sm text-textSecondary">
                    Parcourir les produits
                  </p>
                </div>
              </div>
            </a>

            <a
              href="/medsupply-cloud/pages/client/marketplace.html"
              class="bg-surface rounded-xl shadow-sm border border-border p-6 hover:border-accent transition-colors cursor-pointer"
            >
              <div class="flex items-center gap-4">
                <div
                  class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center"
                >
                  <i data-lucide="gavel" class="w-6 h-6 text-purple-600"></i>
                </div>
                <div>
                  <p class="font-semibold text-textPrimary">Marché</p>
                  <p class="text-sm text-textSecondary">Appels d'offres</p>
                </div>
              </div>
            </a>
          </div>

          <!-- Stats Cards -->
          <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div
              class="bg-surface rounded-xl shadow-sm border border-border p-6"
            >
              <p class="text-textSecondary text-sm">Commandes actives</p>
              <p class="text-2xl font-bold text-textPrimary" id="stat-orders">
                0
              </p>
            </div>
            <div
              class="bg-surface rounded-xl shadow-sm border border-border p-6"
            >
              <p class="text-textSecondary text-sm">Devis en cours</p>
              <p class="text-2xl font-bold text-textPrimary" id="stat-quotes">
                0
              </p>
            </div>
            <div
              class="bg-surface rounded-xl shadow-sm border border-border p-6"
            >
              <p class="text-textSecondary text-sm">Paiements en attente</p>
              <p class="text-2xl font-bold text-textPrimary" id="stat-payments">
                0
              </p>
            </div>
            <div
              class="bg-surface rounded-xl shadow-sm border border-border p-6"
            >
              <p class="text-textSecondary text-sm">Livraisons en cours</p>
              <p
                class="text-2xl font-bold text-textPrimary"
                id="stat-deliveries"
              >
                0
              </p>
            </div>
          </div>

          <!-- Recent Orders -->
          <div
            class="bg-surface rounded-xl shadow-sm border border-border p-6 mb-6"
          >
            <div class="flex items-center justify-between mb-4">
              <h2 class="text-lg font-semibold text-textPrimary">
                Commandes récentes
              </h2>
              <a
                href="/medsupply-cloud/pages/client/orders.html"
                class="text-accent text-sm hover:underline"
                >Voir tout</a
              >
            </div>
            <div id="recent-orders" class="space-y-3">
              <p class="text-textSecondary">Chargement...</p>
            </div>
          </div>

          <!-- Recent Notifications -->
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between mb-4">
              <h2 class="text-lg font-semibold text-textPrimary">
                Notifications
              </h2>
              <a
                href="/medsupply-cloud/notifications.html"
                class="text-accent text-sm hover:underline"
                >Voir tout</a
              >
            </div>
            <div id="recent-notifications" class="space-y-3">
              <p class="text-textSecondary">Chargement...</p>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script>
      requireAuth(["CLIENT"]);
    </script>
    <script src="../../js/router.js"></script>
    <script src="../../js/components/sidebar.js"></script>
    <script src="../../js/components/header.js"></script>
    <script src="../../js/components/badge.js"></script>
    <script src="../../js/components/toast.js"></script>
    <script src="../../js/utils/format.js"></script>
    <script>
      initPage("CLIENT");
      const role = getCurrentRole();
      if (role) {
        renderSidebar(role.toLowerCase());
      }
      renderHeader();

      async function loadDashboardData() {
        try {
          // Load recent orders
          const ordersResponse = await apiFetch("/orders");
          const orders = ordersResponse?.data?.orders || [];
          document.getElementById("stat-orders").textContent = orders.length;

          const ordersContainer = document.getElementById("recent-orders");
          if (orders.length === 0) {
            ordersContainer.innerHTML =
              "<p class='text-textSecondary'>Aucune commande récente</p>";
          } else {
            ordersContainer.innerHTML = orders
              .slice(0, 5)
              .map(
                (order) => `
            <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
              <div>
                <p class="font-medium text-textPrimary">Commande #${order.orderId.toString().substring(0, 8)}</p>
                <p class="text-sm text-textSecondary">${formatDate(order.createdAt)}</p>
              </div>
              <div class="text-right">
                ${renderBadge(order.status)}
                <p class="text-sm font-medium text-textPrimary">${formatCurrency(order.totalAmount)}</p>
              </div>
            </div>
          `,
              )
              .join("");
          }

          // Load recent notifications
          const notificationsResponse = await apiFetch("/notifications/unread");
          const notifications =
            notificationsResponse?.data?.notifications || [];
          document.getElementById("stat-quotes").textContent =
            notifications.length;

          const notificationsContainer = document.getElementById(
            "recent-notifications",
          );
          if (notifications.length === 0) {
            notificationsContainer.innerHTML =
              "<p class='text-textSecondary'>Aucune notification récente</p>";
          } else {
            notificationsContainer.innerHTML = notifications
              .slice(0, 5)
              .map(
                (notif) => `
            <div class="flex items-center gap-3 p-3 bg-gray-50 rounded-lg">
              <div class="w-2 h-2 bg-blue-500 rounded-full"></div>
              <div class="flex-1">
                <p class="text-sm font-medium text-textPrimary">${notif.title}</p>
                <p class="text-xs text-textSecondary">${formatRelativeTime(notif.createdAt)}</p>
              </div>
            </div>
          `,
              )
              .join("");
          }

          lucide.createIcons();
        } catch (error) {
          console.error("Failed to load dashboard data:", error);
        }
      }

      loadDashboardData();
    </script>
  </body>
</html>
