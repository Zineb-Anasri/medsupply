<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouvel Appel d'Offres - MedSupply Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#0A2647",
            secondary: "#144272",
            accent: "#2C74B3",
            success: "#16A34A",
            warning: "#D97706",
            danger: "#DC2626",
            background: "#F8FAFC",
            surface: "#FFFFFF",
            border: "#E2E8F0",
            textPrimary: "#0F172A",
            textSecondary: "#64748B",
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-background">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <aside id="sidebar" class="bg-white border-r border-gray-200 flex-shrink-0"></aside>
    
    <!-- Main Content -->
    <div class="flex-1 flex flex-col ">
      <!-- Header -->
      <header id="header"></header>
      
      <!-- Content -->
      <main id="main-content" class="flex-1 p-6 overflow-y-auto">
        <!-- Breadcrumb -->
        <nav class="flex items-center gap-2 text-sm mb-6">
          <a href="marketplace.html" class="text-textSecondary hover:text-accent">Marketplace</a>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i>
          <span class="text-textPrimary font-medium">Nouvel appel d'offres</span>
        </nav>

        <!-- Page Header -->
        <div class="mb-6">
          <h1 class="text-2xl font-bold text-textPrimary">Lancer un appel d'offres</h1>
          <p class="text-textSecondary">Créez un nouvel appel d'offres pour vos fournisseurs</p>
        </div>

        <!-- Form -->
        <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
          <div class="space-y-6">
            <!-- Title -->
            <div>
              <label class="block text-sm font-medium text-textPrimary mb-2">Titre *</label>
              <input type="text" id="tender-title"
                class="w-full px-4 py-3 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all"
                placeholder="Ex: Fourniture d'équipements médicaux pour le service de réanimation">
            </div>

            <!-- Description -->
            <div>
              <label class="block text-sm font-medium text-textPrimary mb-2">Description détaillée *</label>
              <textarea id="tender-description" rows="5"
                class="w-full px-4 py-3 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all resize-none"
                placeholder="Décrivez en détail les produits et services recherchés, les spécifications techniques, les conditions de livraison, etc."></textarea>
            </div>

            <!-- Budget and Deadline -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              <div>
                <label class="block text-sm font-medium text-textPrimary mb-2">Budget maximum (MAD)</label>
                <input type="number" id="tender-budget" min="0" step="0.01"
                  class="w-full px-4 py-3 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all"
                  placeholder="Budget indicatif (optionnel)">
              </div>
              <div>
                <label class="block text-sm font-medium text-textPrimary mb-2">Date limite de soumission *</label>
                <input type="datetime-local" id="tender-deadline"
                  class="w-full px-4 py-3 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all">
              </div>
            </div>

            <!-- Products Needed -->
            <div>
              <div class="flex items-center justify-between mb-4">
                <label class="block text-sm font-medium text-textPrimary">Produits nécessaires</label>
                <button onclick="addProductRow()" class="text-accent hover:text-secondary font-medium text-sm flex items-center gap-1">
                  <i data-lucide="plus" class="w-4 h-4"></i>
                  <span>Ajouter un produit</span>
                </button>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full">
                  <thead class="bg-gray-50 border-b border-border">
                    <tr>
                      <th class="px-4 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Nom du produit</th>
                      <th class="px-4 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Quantité</th>
                      <th class="px-4 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Spécifications</th>
                      <th class="px-4 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Action</th>
                    </tr>
                  </thead>
                  <tbody id="products-table-body" class="divide-y divide-border">
                    <tr>
                      <td class="px-4 py-3">
                        <input type="text" class="product-name w-full px-3 py-2 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all text-sm" placeholder="Nom du produit">
                      </td>
                      <td class="px-4 py-3">
                        <input type="number" class="product-qty w-24 px-3 py-2 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all text-sm" placeholder="Qté" min="1">
                      </td>
                      <td class="px-4 py-3">
                        <input type="text" class="product-specs w-full px-3 py-2 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all text-sm" placeholder="Spécifications">
                      </td>
                      <td class="px-4 py-3">
                        <button onclick="removeProductRow(this)" class="p-2 hover:bg-red-100 rounded transition-colors">
                          <i data-lucide="trash-2" class="w-4 h-4 text-red-600"></i>
                        </button>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>

            <!-- Submit Button -->
            <div class="flex justify-end gap-4">
              <button onclick="window.location.href='marketplace.html'" class="bg-gray-200 hover:bg-gray-300 text-textPrimary font-medium px-6 py-3 rounded-lg transition-colors">
                Annuler
              </button>
              <button onclick="submitTender()" class="bg-primary hover:bg-secondary text-white font-medium px-6 py-3 rounded-lg transition-colors">
                Publier l'appel d'offres
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    requireAuth(["CLIENT"]);
    const currentUser = getCurrentUser();
  </script>
  <script src="../../js/router.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/header.js"></script>
  <script src="../../js/utils/format.js"></script>
  <script>
    initPage("CLIENT");

    function addProductRow() {
      const tbody = document.getElementById('products-table-body');
      const row = document.createElement('tr');
      row.innerHTML = `
        <td class="px-4 py-3">
          <input type="text" class="product-name w-full px-3 py-2 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all text-sm" placeholder="Nom du produit">
        </td>
        <td class="px-4 py-3">
          <input type="number" class="product-qty w-24 px-3 py-2 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all text-sm" placeholder="Qté" min="1">
        </td>
        <td class="px-4 py-3">
          <input type="text" class="product-specs w-full px-3 py-2 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all text-sm" placeholder="Spécifications">
        </td>
        <td class="px-4 py-3">
          <button onclick="removeProductRow(this)" class="p-2 hover:bg-red-100 rounded transition-colors">
            <i data-lucide="trash-2" class="w-4 h-4 text-red-600"></i>
          </button>
        </td>
      `;
      tbody.appendChild(row);
      lucide.createIcons();
    }

    function removeProductRow(button) {
      const tbody = document.getElementById('products-table-body');
      if (tbody.children.length > 1) {
        button.closest('tr').remove();
      }
    }

    async function submitTender() {
      const title = document.getElementById('tender-title').value;
      const description = document.getElementById('tender-description').value;
      const budget = document.getElementById('tender-budget').value;
      const deadline = document.getElementById('tender-deadline').value;

      if (!title || !description || !deadline) {
        alert('Veuillez remplir tous les champs obligatoires');
        return;
      }

      // Collect products
      const products = [];
      const productRows = document.querySelectorAll('#products-table-body tr');
      productRows.forEach(row => {
        const name = row.querySelector('.product-name').value;
        const qty = row.querySelector('.product-qty').value;
        const specs = row.querySelector('.product-specs').value;
        
        if (name && qty) {
          products.push({
            productName: name,
            quantity: parseInt(qty),
            specifications: specs
          });
        }
      });

      try {
        await apiFetch('/client/marketplace', {
          method: 'POST',
          body: JSON.stringify({
            title,
            description,
            maxBudget: budget ? parseFloat(budget) : null,
            deadline,
            products
          })
        });
        window.location.href = '/medsupply-cloud/pages/marketplace.html';
      } catch (error) {
        console.error("Failed to submit tender:", error);
        alert('Erreur lors de la publication de l\'appel d\'offres');
      }
    }

    // Initialize icons
    lucide.createIcons();
  </script>
</body>
</html>
