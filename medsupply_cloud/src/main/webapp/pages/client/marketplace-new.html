<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nouvel Appel d'Offres - MedSupply Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#0A2647",
              secondary: "#144272",
              accent: "#2C74B3",
              success: "#16A34A",
              warning: "#D97706",
              danger: "#DC2626",
              background: "#F8FAFC",
              surface: "#FFFFFF",
              border: "#E2E8F0",
              textPrimary: "#0F172A",
              textSecondary: "#64748B",
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
      body { font-family: "Inter", sans-serif; }
      .font-mono { font-family: "JetBrains Mono", monospace; }
    </style>
  </head>
  <body class="bg-background">
    <div class="flex h-screen">
      <!-- Sidebar -->
      <aside id="sidebar" class="bg-white border-r border-gray-200 flex-shrink-0"></aside>

      <!-- Main Content -->
      <div class="flex-1 flex flex-col">
        <!-- Header -->
        <header id="header"></header>

        <!-- Content -->
        <main id="main-content" class="flex-1 p-6 overflow-y-auto">
          <!-- Breadcrumb -->
          <nav class="flex items-center gap-2 text-sm mb-6">
            <a href="marketplace.html" class="text-textSecondary hover:text-accent">Marketplace</a>
            <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i>
            <span class="text-textPrimary font-medium">Nouvel appel d'offres</span>
          </nav>

          <!-- Page Header -->
          <div class="mb-6">
            <h1 class="text-2xl font-bold text-textPrimary">Lancer un appel d'offres</h1>
            <p class="text-textSecondary">Créez un nouvel appel d'offres pour vos fournisseurs</p>
          </div>

          <!-- Form -->
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6 max-w-4xl">
            <div class="space-y-6">
              <!-- Title -->
              <div>
                <label class="block text-sm font-medium text-textPrimary mb-2">Titre *</label>
                <input type="text" id="tender-title"
                  class="w-full px-4 py-3 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all"
                  placeholder="Ex: Fourniture d'équipements médicaux pour le service de réanimation" />
              </div>

              <!-- Description -->
              <div>
                <label class="block text-sm font-medium text-textPrimary mb-2">Description détaillée *</label>
                <textarea id="tender-description" rows="5"
                  class="w-full px-4 py-3 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all resize-none"
                  placeholder="Décrivez en détail les produits et services recherchés, les spécifications techniques, les conditions de livraison, etc."></textarea>
              </div>

              <!-- Budget and Deadline -->
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                  <label class="block text-sm font-medium text-textPrimary mb-2">Budget maximum (MAD) *</label>
                  <input type="number" id="tender-budget" min="0" step="0.01"
                    class="w-full px-4 py-3 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all"
                    placeholder="Ex: 50000" />
                </div>
                <div>
                  <label class="block text-sm font-medium text-textPrimary mb-2">Date limite de soumission *</label>
                  <input type="datetime-local" id="tender-deadline"
                    class="w-full px-4 py-3 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all" />
                </div>
              </div>

              <!-- Products Needed -->
              <div>
                <div class="flex items-center justify-between mb-4">
                  <div>
                    <label class="block text-sm font-medium text-textPrimary">Produits nécessaires</label>
                    <p class="text-xs text-textSecondary mt-0.5">Sélectionnez des produits du catalogue et indiquez les quantités.</p>
                  </div>
                  <button type="button" id="add-product-btn" onclick="addProductRow()" class="text-accent hover:text-secondary font-medium text-sm flex items-center gap-1">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                    <span>Ajouter un produit</span>
                  </button>
                </div>
                <div class="overflow-x-auto">
                  <table class="w-full">
                    <thead class="bg-gray-50 border-b border-border">
                      <tr>
                        <th class="px-4 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Produit</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold text-textSecondary uppercase w-40">Quantité</th>
                        <th class="px-4 py-3 text-left text-xs font-semibold text-textSecondary uppercase w-20">Action</th>
                      </tr>
                    </thead>
                    <tbody id="products-table-body" class="divide-y divide-border"></tbody>
                  </table>
                </div>
              </div>

              <!-- Submit Button -->
              <div class="flex justify-end gap-4 pt-2">
                <button type="button" onclick="window.location.href='marketplace.html'" class="bg-gray-200 hover:bg-gray-300 text-textPrimary font-medium px-6 py-3 rounded-lg transition-colors">
                  Annuler
                </button>
                <button type="button" id="submit-btn" onclick="submitTender()" class="bg-accent hover:bg-secondary text-white font-medium px-6 py-3 rounded-lg transition-colors flex items-center gap-2">
                  <i data-lucide="megaphone" class="w-5 h-5"></i>
                  <span>Publier l'appel d'offres</span>
                </button>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script>requireAuth(["CLIENT"]);</script>
    <script src="../../js/router.js"></script>
    <script src="../../js/components/sidebar.js"></script>
    <script src="../../js/components/header.js"></script>
    <script src="../../js/components/badge.js"></script>
    <script src="../../js/components/toast.js"></script>
    <script src="../../js/utils/format.js"></script>
    <script>
      initPage("CLIENT");
      renderSidebar(getCurrentRole().toLowerCase());
      renderHeader();

      let products = [];

      // Build the <option> list for a product <select> from the cached catalog.
      function productOptions(selectedId) {
        const opts = ['<option value="">-- Sélectionner un produit --</option>'];
        products.forEach((p) => {
          const label = (p.name || "Produit") + (p.reference ? " (" + p.reference + ")" : "");
          const sel = selectedId && selectedId === p.id ? " selected" : "";
          opts.push('<option value="' + p.id + '"' + sel + ">" + label + "</option>");
        });
        return opts.join("");
      }

      async function loadProducts() {
        const r = await apiFetch("/products");
        if (!r || !r.ok) {
          showToast(r?.data?.message || "Erreur de chargement du catalogue", "error");
          // Still allow tender creation without items (items are optional per API).
          renderEmptyRowsState();
          return;
        }
        products = r.data.products || [];
        if (products.length === 0) {
          renderEmptyRowsState();
          return;
        }
        addProductRow();
      }

      function renderEmptyRowsState() {
        const tbody = document.getElementById("products-table-body");
        document.getElementById("add-product-btn").disabled = products.length === 0;
        if (products.length === 0) {
          document.getElementById("add-product-btn").classList.add("opacity-50", "cursor-not-allowed");
        }
        tbody.innerHTML =
          '<tr><td colspan="3" class="px-4 py-6 text-center text-sm text-textSecondary">Aucun produit au catalogue. Vous pouvez tout de même publier l\'appel d\'offres en décrivant vos besoins dans la description.</td></tr>';
        lucide.createIcons();
      }

      function addProductRow(selectedId) {
        const tbody = document.getElementById("products-table-body");
        if (products.length === 0) return;
        // Remove the empty-state placeholder row if present.
        const placeholder = tbody.querySelector('td[colspan="3"]');
        if (placeholder) tbody.innerHTML = "";

        const row = document.createElement("tr");
        row.innerHTML =
          '<td class="px-4 py-3">' +
          '<select class="product-id w-full px-3 py-2 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all text-sm">' +
          productOptions(selectedId) +
          "</select>" +
          "</td>" +
          '<td class="px-4 py-3">' +
          '<input type="number" class="product-qty w-32 px-3 py-2 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all text-sm" placeholder="Qté" min="1" value="1" />' +
          "</td>" +
          '<td class="px-4 py-3">' +
          '<button type="button" onclick="removeProductRow(this)" class="p-2 hover:bg-red-50 rounded transition-colors">' +
          '<i data-lucide="trash-2" class="w-4 h-4 text-danger"></i>' +
          "</button>" +
          "</td>";
        tbody.appendChild(row);
        lucide.createIcons();
      }

      function removeProductRow(button) {
        button.closest("tr").remove();
      }

      async function submitTender() {
        const title = document.getElementById("tender-title").value.trim();
        const description = document.getElementById("tender-description").value.trim();
        const budgetRaw = document.getElementById("tender-budget").value;
        const deadline = document.getElementById("tender-deadline").value;

        if (!title) { showToast("Le titre est obligatoire", "warning"); return; }
        if (!description) { showToast("La description est obligatoire", "warning"); return; }

        const budgetMax = parseFloat(budgetRaw);
        if (!budgetRaw || isNaN(budgetMax) || budgetMax <= 0) {
          showToast("Le budget maximum doit être supérieur à 0", "warning");
          return;
        }

        if (!deadline) { showToast("La date limite est obligatoire", "warning"); return; }
        if (new Date(deadline).getTime() <= Date.now()) {
          showToast("La date limite doit être dans le futur", "warning");
          return;
        }

        // Collect chosen product rows -> {productId, quantity}.
        const items = [];
        let invalidQty = false;
        document.querySelectorAll("#products-table-body tr").forEach((row) => {
          const select = row.querySelector(".product-id");
          const qtyInput = row.querySelector(".product-qty");
          if (!select || !qtyInput) return;
          const productId = select.value;
          const quantity = parseInt(qtyInput.value, 10);
          if (!productId) return; // skip rows without a chosen product
          if (!quantity || quantity < 1) { invalidQty = true; return; }
          items.push({ productId, quantity });
        });

        if (invalidQty) {
          showToast("Chaque produit sélectionné doit avoir une quantité valide (≥ 1)", "warning");
          return;
        }

        const btn = document.getElementById("submit-btn");
        btn.disabled = true;
        btn.classList.add("opacity-60", "cursor-not-allowed");

        const payload = { title, description, budgetMax, deadline, items };
        const r = await apiFetch("/tenders", { method: "POST", body: JSON.stringify(payload) });

        if (r && r.ok && r.data && r.data.success) {
          showToast("Appel d'offres publié", "success");
          setTimeout(() => (window.location.href = "marketplace.html"), 800);
          return;
        }

        showToast(r?.data?.message || "Erreur lors de la publication de l'appel d'offres", "error");
        btn.disabled = false;
        btn.classList.remove("opacity-60", "cursor-not-allowed");
      }

      loadProducts();
      lucide.createIcons();
    </script>
  </body>
</html>
