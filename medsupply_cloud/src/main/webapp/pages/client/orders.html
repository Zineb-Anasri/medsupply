<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mes Commandes - MedSupply Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: {
      primary: "#0A2647", secondary: "#144272", accent: "#2C74B3",
      success: "#16A34A", warning: "#D97706", danger: "#DC2626",
      background: "#F8FAFC", surface: "#FFFFFF", border: "#E2E8F0",
      textPrimary: "#0F172A", textSecondary: "#64748B" } } } };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style> body { font-family: 'Inter', sans-serif; } .font-mono { font-family: 'JetBrains Mono', monospace; } </style>
</head>
<body class="bg-background">
  <div class="flex h-screen">
    <aside id="sidebar" class="bg-white border-r border-gray-200 flex-shrink-0"></aside>
    <div class="flex-1 flex flex-col">
      <header id="header"></header>
      <main id="main-content" class="flex-1 p-6 overflow-y-auto">
        <div class="mb-6">
          <h1 class="text-2xl font-bold text-textPrimary">Mes Commandes</h1>
          <p class="text-textSecondary">Suivez l'avancement de vos commandes</p>
        </div>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <div class="bg-surface rounded-xl shadow-sm border border-border p-5"><p class="text-textSecondary text-sm">Total</p><p class="text-2xl font-bold text-textPrimary" id="stat-total">0</p></div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-5"><p class="text-textSecondary text-sm">En cours</p><p class="text-2xl font-bold text-blue-600" id="stat-active">0</p></div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-5"><p class="text-textSecondary text-sm">Livrées</p><p class="text-2xl font-bold text-success" id="stat-delivered">0</p></div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-5"><p class="text-textSecondary text-sm">Montant total</p><p class="text-2xl font-bold text-textPrimary" id="stat-amount">—</p></div>
        </div>

        <div class="bg-surface rounded-xl shadow-sm border border-border p-4 mb-6">
          <select id="status-filter" onchange="render()" class="px-4 py-2 border border-border rounded-lg outline-none focus:ring-2 focus:ring-accent">
            <option value="">Tous les statuts</option>
            <option value="PENDING">En attente</option>
            <option value="PROCESSING">En traitement</option>
            <option value="SHIPPED">Expédiée</option>
            <option value="DELIVERED">Livrée</option>
            <option value="COMPLETED">Terminée</option>
          </select>
        </div>

        <div class="bg-surface rounded-xl shadow-sm border border-border overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-50 border-b border-border">
                <tr>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase">N° Commande</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Montant</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Date</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Statut</th>
                  <th class="px-6 py-3 text-right text-xs font-semibold text-textSecondary uppercase">Actions</th>
                </tr>
              </thead>
              <tbody id="orders-body" class="divide-y divide-border">
                <tr><td colspan="5" class="px-6 py-12 text-center text-textSecondary">Chargement...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script>requireAuth(["CLIENT"]);</script>
  <script src="../../js/router.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/header.js"></script>
  <script src="../../js/components/badge.js"></script>
  <script src="../../js/components/toast.js"></script>
  <script src="../../js/utils/format.js"></script>
  <script>
    initPage("CLIENT");
    renderSidebar(getCurrentRole().toLowerCase());
    renderHeader();

    let allOrders = [];

    async function load() {
      const r = await apiFetch("/orders");
      if (!r || !r.ok) {
        document.getElementById("orders-body").innerHTML =
          `<tr><td colspan="5" class="px-6 py-12 text-center text-danger">${r?.data?.message || "Erreur de chargement"}</td></tr>`;
        return;
      }
      allOrders = r.data.orders || [];
      updateStats();
      render();
    }

    function updateStats() {
      const active = allOrders.filter((o) => ["PENDING", "PROCESSING", "SHIPPED"].includes(o.status)).length;
      const delivered = allOrders.filter((o) => ["DELIVERED", "COMPLETED"].includes(o.status)).length;
      const amount = allOrders.reduce((s, o) => s + (Number(o.totalAmount) || 0), 0);
      document.getElementById("stat-total").textContent = allOrders.length;
      document.getElementById("stat-active").textContent = active;
      document.getElementById("stat-delivered").textContent = delivered;
      document.getElementById("stat-amount").textContent = formatCurrency(amount);
    }

    function render() {
      const filter = document.getElementById("status-filter").value;
      const rows = allOrders
        .filter((o) => !filter || o.status === filter)
        .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      const tbody = document.getElementById("orders-body");
      if (rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-textSecondary">Aucune commande</td></tr>`;
        return;
      }
      tbody.innerHTML = rows.map((o) => `
        <tr class="hover:bg-gray-50 cursor-pointer" onclick="location.href='order-detail.html?id=${o.orderId}'">
          <td class="px-6 py-4 font-mono font-medium text-textPrimary">#${o.orderId.slice(0, 8)}</td>
          <td class="px-6 py-4 font-medium text-textPrimary">${o.totalAmount != null ? formatCurrency(o.totalAmount) : "—"}</td>
          <td class="px-6 py-4 text-textSecondary">${formatDate(o.createdAt)}</td>
          <td class="px-6 py-4">${renderBadge(o.status)}</td>
          <td class="px-6 py-4 text-right" onclick="event.stopPropagation()">
            <a href="order-detail.html?id=${o.orderId}" class="inline-flex items-center gap-1 text-accent hover:underline text-sm font-medium">
              <i data-lucide="eye" class="w-4 h-4"></i> Suivre
            </a>
          </td>
        </tr>`).join("");
      lucide.createIcons();
    }

    load();
  </script>
</body>
</html>
