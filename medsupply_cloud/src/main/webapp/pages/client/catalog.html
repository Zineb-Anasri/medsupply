<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catalogue - MedSupply Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#0A2647",
              secondary: "#144272",
              accent: "#2C74B3",
              success: "#16A34A",
              warning: "#D97706",
              danger: "#DC2626",
              background: "#F8FAFC",
              surface: "#FFFFFF",
              border: "#E2E8F0",
              textPrimary: "#0F172A",
              textSecondary: "#64748B",
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .skeleton {
        background: linear-gradient(
          90deg,
          #e2e8f0 25%,
          #f1f5f9 50%,
          #e2e8f0 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
      }
      @keyframes shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
    </style>
  </head>
  <body class="bg-background">
    <div class="flex h-screen">
      <!-- Sidebar -->
      <aside
        id="sidebar"
        class="bg-white border-r border-gray-200 flex-shrink-0"
      ></aside>

      <!-- Main Content -->
      <div class="flex-1 flex flex-col ">
        <!-- Header -->
        <header id="header"></header>

        <!-- Content -->
        <main id="main-content" class="flex-1 p-6 overflow-y-auto">
          <!-- Page Header -->
          <div class="mb-6">
            <h1 class="text-2xl font-bold text-textPrimary">Catalogue</h1>
            <p class="text-textSecondary">
              Parcourez notre catalogue de produits médicaux
            </p>
          </div>

          <div class="flex flex-col lg:flex-row gap-6">
            <!-- Filters Sidebar -->
            <div class="w-full lg:w-64 flex-shrink-0">
              <div
                class="bg-surface rounded-xl shadow-sm border border-border p-6 sticky top-6"
              >
                <!-- Search -->
                <div class="mb-6">
                  <label class="block text-sm font-medium text-textPrimary mb-2"
                    >Recherche</label
                  >
                  <div class="relative">
                    <i
                      data-lucide="search"
                      class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2"
                    ></i>
                    <input
                      type="text"
                      id="search-input"
                      placeholder="Nom, référence..."
                      class="w-full pl-10 pr-4 py-2 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all text-sm"
                    />
                  </div>
                </div>

                <!-- Price Range -->
                <div class="mb-6">
                  <label class="block text-sm font-medium text-textPrimary mb-2"
                    >Prix</label
                  >
                  <div class="space-y-2">
                    <input
                      type="number"
                      id="price-min"
                      placeholder="Min (MAD)"
                      class="w-full px-3 py-2 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all text-sm"
                    />
                    <input
                      type="number"
                      id="price-max"
                      placeholder="Max (MAD)"
                      class="w-full px-3 py-2 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all text-sm"
                    />
                  </div>
                </div>

                <button
                  onclick="applyFilters()"
                  class="w-full bg-accent hover:bg-secondary text-white font-medium py-2 rounded-lg transition-colors"
                >
                  Appliquer les filtres
                </button>
                <button
                  onclick="resetFilters()"
                  class="w-full bg-gray-200 hover:bg-gray-300 text-textPrimary font-medium py-2 rounded-lg transition-colors mt-2"
                >
                  Réinitialiser
                </button>
              </div>
            </div>

            <!-- Products Grid -->
            <div class="flex-1">
              <!-- Loading Skeleton -->
              <div
                id="loading-skeleton"
                class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 hidden"
              >
                <div
                  class="bg-white rounded-xl shadow-sm border border-border overflow-hidden"
                >
                  <div class="aspect-[4/3] skeleton"></div>
                  <div class="p-4 space-y-3">
                    <div class="h-5 skeleton rounded w-3/4"></div>
                    <div class="h-4 skeleton rounded w-1/2"></div>
                    <div class="h-6 skeleton rounded w-1/3"></div>
                    <div class="h-4 skeleton rounded w-1/4"></div>
                    <div class="h-10 skeleton rounded"></div>
                  </div>
                </div>
                <div
                  class="bg-white rounded-xl shadow-sm border border-border overflow-hidden"
                >
                  <div class="aspect-[4/3] skeleton"></div>
                  <div class="p-4 space-y-3">
                    <div class="h-5 skeleton rounded w-3/4"></div>
                    <div class="h-4 skeleton rounded w-1/2"></div>
                    <div class="h-6 skeleton rounded w-1/3"></div>
                    <div class="h-4 skeleton rounded w-1/4"></div>
                    <div class="h-10 skeleton rounded"></div>
                  </div>
                </div>
                <div
                  class="bg-white rounded-xl shadow-sm border border-border overflow-hidden"
                >
                  <div class="aspect-[4/3] skeleton"></div>
                  <div class="p-4 space-y-3">
                    <div class="h-5 skeleton rounded w-3/4"></div>
                    <div class="h-4 skeleton rounded w-1/2"></div>
                    <div class="h-6 skeleton rounded w-1/3"></div>
                    <div class="h-4 skeleton rounded w-1/4"></div>
                    <div class="h-10 skeleton rounded"></div>
                  </div>
                </div>
              </div>

              <!-- Error State -->
              <div id="error-state" class="hidden text-center py-12">
                <i
                  data-lucide="alert-circle"
                  class="w-12 h-12 text-danger mx-auto mb-4"
                ></i>
                <h3 class="text-lg font-semibold text-textPrimary mb-2">
                  Erreur de chargement
                </h3>
                <p class="text-textSecondary mb-4" id="error-message">
                  Impossible de charger le catalogue.
                </p>
                <button
                  onclick="loadProducts()"
                  class="bg-accent hover:bg-secondary text-white font-medium px-4 py-2 rounded-lg transition-colors"
                >
                  Réessayer
                </button>
              </div>

              <!-- Empty State -->
              <div id="empty-state" class="hidden text-center py-12">
                <i
                  data-lucide="package"
                  class="w-12 h-12 text-gray-400 mx-auto mb-4"
                ></i>
                <h3 class="text-lg font-semibold text-textPrimary mb-2">
                  Aucun produit trouvé
                </h3>
                <p class="text-textSecondary">
                  Aucun produit ne correspond à votre recherche.
                </p>
              </div>

              <!-- Products Grid -->
              <div
                class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"
                id="products-grid"
              ></div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script>
      requireAuth(["CLIENT"]);
    </script>
    <script src="../../js/router.js"></script>
    <script src="../../js/components/sidebar.js"></script>
    <script src="../../js/components/header.js"></script>
    <script>
      initPage("CLIENT");
      const role = getCurrentRole();
      if (role) {
        renderSidebar(role.toLowerCase());
      }
      renderHeader();

      let allProducts = [];

      /**
       * Format price in French style + MAD
       */
      function formatPrice(price) {
        if (price == null) return "—";
        const num = typeof price === "string" ? parseFloat(price) : price;
        return (
          num.toLocaleString("fr-FR", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2,
          }) + " MAD"
        );
      }

      /**
       * Show a specific state panel and hide others
       */
      function showState(state) {
        document.getElementById("loading-skeleton").classList.add("hidden");
        document.getElementById("error-state").classList.add("hidden");
        document.getElementById("empty-state").classList.add("hidden");
        document.getElementById("products-grid").innerHTML = "";

        if (state === "loading") {
          document
            .getElementById("loading-skeleton")
            .classList.remove("hidden");
        } else if (state === "error") {
          document.getElementById("error-state").classList.remove("hidden");
        } else if (state === "empty") {
          document.getElementById("empty-state").classList.remove("hidden");
        }
      }

      /**
       * Build a product card HTML
       */
      function buildProductCard(product) {
        const imageUrl = product.imageUrl || product.image_url;
        const name = product.name || "Produit sans nom";
        const reference = product.reference || "";
        const unitPrice = product.unitPrice || product.unit_price;
        const warrantyMonths =
          product.warrantyMonths || product.warranty_months;
        const productId = product.id || "";

        const imageHtml = imageUrl
          ? '<img src="' +
            imageUrl +
            '" alt="' +
            name +
            "\" class=\"w-full h-full object-cover\" onerror=\"this.parentElement.innerHTML='<div class=\\'w-full h-full flex items-center justify-center bg-primary bg-opacity-10\\'><i data-lucide=\\'package\\' class=\\'w-12 h-12 text-primary\\'></i></div>'\">"
          : '<div class="w-full h-full flex items-center justify-center bg-primary/10"><i data-lucide="package" class="w-12 h-12 text-primary"></i></div>';

        const warrantyHtml = warrantyMonths
          ? '<span class="inline-flex items-center px-2 py-1 rounded-md text-xs font-medium bg-blue-100 text-blue-800">Garantie ' +
            warrantyMonths +
            " mois</span>"
          : "";

        return (
          '<div class="bg-surface rounded-xl shadow-sm border border-border overflow-hidden hover:shadow-md transition-shadow">' +
          '<div class="aspect-[4/3] bg-gray-100 relative">' +
          imageHtml +
          "</div>" +
          '<div class="p-4">' +
          '<h3 class="font-semibold text-textPrimary mb-1 line-clamp-1">' +
          name +
          "</h3>" +
          (reference
            ? '<p class="text-sm text-textSecondary mb-2 font-mono text-xs">' +
              reference +
              "</p>"
            : "") +
          '<p class="text-xl font-bold text-accent mb-2">' +
          formatPrice(unitPrice) +
          "</p>" +
          '<div class="mb-3">' +
          warrantyHtml +
          "</div>" +
          "<button onclick=\"requestQuote('" +
          productId +
          '\')" class="w-full bg-primary hover:bg-secondary text-white font-medium py-2 rounded-lg transition-colors text-sm">' +
          "Demander un devis" +
          "</button>" +
          "</div>" +
          "</div>"
        );
      }

      /**
       * Render products in the grid
       */
      function renderProducts(products) {
        const grid = document.getElementById("products-grid");

        if (!products || products.length === 0) {
          showState("empty");
          lucide.createIcons();
          return;
        }

        showState("grid");
        grid.innerHTML = products.map(buildProductCard).join("");
        lucide.createIcons();
      }

      /**
       * Load products from API
       */
      async function loadProducts() {
        showState("loading");

        try {
          const response = await apiFetch("/products");
          const data = response?.data || response || {};

          // apiFetch may return data in different structures
          let products = [];
          if (Array.isArray(data)) {
            products = data;
          } else if (data.products && Array.isArray(data.products)) {
            products = data.products;
          } else if (data.data && Array.isArray(data.data)) {
            products = data.data;
          }

          allProducts = products;
          renderProducts(allProducts);
        } catch (error) {
          console.error("Failed to load products:", error);
          showState("error");
          document.getElementById("error-message").textContent =
            error.message ||
            "Impossible de charger le catalogue. Vérifiez votre connexion.";
          lucide.createIcons();
        }
      }

      /**
       * Apply search and price filters on loaded products
       */
      function applyFilters() {
        const search = document
          .getElementById("search-input")
          .value.toLowerCase()
          .trim();
        const priceMin =
          parseFloat(document.getElementById("price-min").value) || 0;
        const priceMax =
          parseFloat(document.getElementById("price-max").value) || Infinity;

        const filtered = allProducts.filter((p) => {
          const name = (p.name || "").toLowerCase();
          const ref = (p.reference || "").toLowerCase();
          const price = parseFloat(p.unitPrice || p.unit_price) || 0;

          const matchesSearch =
            !search || name.includes(search) || ref.includes(search);
          const matchesPrice = price >= priceMin && price <= priceMax;

          return matchesSearch && matchesPrice;
        });

        renderProducts(filtered);
      }

      /**
       * Reset all filters and reload
       */
      function resetFilters() {
        document.getElementById("search-input").value = "";
        document.getElementById("price-min").value = "";
        document.getElementById("price-max").value = "";
        renderProducts(allProducts);
      }

      /**
       * Navigate to request a quote for a product
       */
      function requestQuote(productId) {
        window.location.href =
          "quote-new.html?productId=" + encodeURIComponent(productId);
      }

      // Search on Enter key
      document
        .getElementById("search-input")
        .addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            applyFilters();
          }
        });

      // Initialize
      loadProducts();
    </script>
  </body>
</html>
