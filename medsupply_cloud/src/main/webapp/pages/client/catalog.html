<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catalogue - MedSupply Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#0A2647",
              secondary: "#144272",
              accent: "#2C74B3",
              success: "#16A34A",
              warning: "#D97706",
              danger: "#DC2626",
              background: "#F8FAFC",
              surface: "#FFFFFF",
              border: "#E2E8F0",
              textPrimary: "#0F172A",
              textSecondary: "#64748B",
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .skeleton {
        background: linear-gradient(
          90deg,
          #e2e8f0 25%,
          #f1f5f9 50%,
          #e2e8f0 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
      }
      @keyframes shimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
      .line-clamp-1 {
        display: -webkit-box;
        -webkit-line-clamp: 1;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
    </style>
  </head>
  <body class="bg-background">
    <div class="flex h-screen">
      <!-- Sidebar -->
      <aside
        id="sidebar"
        class="bg-white border-r border-gray-200 flex-shrink-0"
      ></aside>

      <!-- Main Content -->
      <div class="flex-1 flex flex-col">
        <!-- Header -->
        <header id="header"></header>

        <!-- Content -->
        <main id="main-content" class="flex-1 p-6 overflow-y-auto">
          <!-- Page Header -->
          <div class="mb-6">
            <h1 class="text-2xl font-bold text-textPrimary">Catalogue</h1>
            <p class="text-textSecondary">
              Parcourez notre catalogue de produits médicaux
            </p>
          </div>

          <div class="flex flex-col lg:flex-row gap-6">
            <!-- Filters Sidebar -->
            <div class="w-full lg:w-64 flex-shrink-0">
              <div
                class="bg-surface rounded-xl shadow-sm border border-border p-6 sticky top-6"
              >
                <!-- Search -->
                <div class="mb-6">
                  <label class="block text-sm font-medium text-textPrimary mb-2"
                    >Recherche</label
                  >
                  <div class="relative">
                    <i
                      data-lucide="search"
                      class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2"
                    ></i>
                    <input
                      type="text"
                      id="search-input"
                      placeholder="Nom, référence..."
                      class="w-full pl-10 pr-4 py-2 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all text-sm"
                    />
                  </div>
                </div>

                <!-- Price Range -->
                <div class="mb-6">
                  <label class="block text-sm font-medium text-textPrimary mb-2"
                    >Prix (MAD)</label
                  >
                  <div class="space-y-2">
                    <input
                      type="number"
                      id="price-min"
                      min="0"
                      placeholder="Min"
                      class="w-full px-3 py-2 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all text-sm"
                    />
                    <input
                      type="number"
                      id="price-max"
                      min="0"
                      placeholder="Max"
                      class="w-full px-3 py-2 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all text-sm"
                    />
                  </div>
                </div>

                <button
                  onclick="applyFilters()"
                  class="w-full bg-accent hover:bg-secondary text-white font-medium py-2 rounded-lg transition-colors"
                >
                  Appliquer les filtres
                </button>
                <button
                  onclick="resetFilters()"
                  class="w-full bg-gray-200 hover:bg-gray-300 text-textPrimary font-medium py-2 rounded-lg transition-colors mt-2"
                >
                  Réinitialiser
                </button>

                <p
                  id="result-count"
                  class="text-xs text-textSecondary text-center mt-4"
                ></p>
              </div>
            </div>

            <!-- Products Grid -->
            <div class="flex-1">
              <!-- Loading Skeleton -->
              <div
                id="loading-skeleton"
                class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6"
              >
                <div
                  class="bg-white rounded-xl shadow-sm border border-border overflow-hidden"
                >
                  <div class="aspect-[4/3] skeleton"></div>
                  <div class="p-4 space-y-3">
                    <div class="h-5 skeleton rounded w-3/4"></div>
                    <div class="h-4 skeleton rounded w-1/2"></div>
                    <div class="h-6 skeleton rounded w-1/3"></div>
                    <div class="h-4 skeleton rounded w-1/4"></div>
                    <div class="h-10 skeleton rounded"></div>
                  </div>
                </div>
                <div
                  class="bg-white rounded-xl shadow-sm border border-border overflow-hidden"
                >
                  <div class="aspect-[4/3] skeleton"></div>
                  <div class="p-4 space-y-3">
                    <div class="h-5 skeleton rounded w-3/4"></div>
                    <div class="h-4 skeleton rounded w-1/2"></div>
                    <div class="h-6 skeleton rounded w-1/3"></div>
                    <div class="h-4 skeleton rounded w-1/4"></div>
                    <div class="h-10 skeleton rounded"></div>
                  </div>
                </div>
                <div
                  class="bg-white rounded-xl shadow-sm border border-border overflow-hidden"
                >
                  <div class="aspect-[4/3] skeleton"></div>
                  <div class="p-4 space-y-3">
                    <div class="h-5 skeleton rounded w-3/4"></div>
                    <div class="h-4 skeleton rounded w-1/2"></div>
                    <div class="h-6 skeleton rounded w-1/3"></div>
                    <div class="h-4 skeleton rounded w-1/4"></div>
                    <div class="h-10 skeleton rounded"></div>
                  </div>
                </div>
              </div>

              <!-- Error State -->
              <div id="error-state" class="hidden text-center py-12">
                <i
                  data-lucide="alert-circle"
                  class="w-12 h-12 text-danger mx-auto mb-4"
                ></i>
                <h3 class="text-lg font-semibold text-textPrimary mb-2">
                  Erreur de chargement
                </h3>
                <p class="text-textSecondary mb-4">
                  Impossible de charger le catalogue.
                </p>
                <button
                  onclick="loadProducts()"
                  class="bg-accent hover:bg-secondary text-white font-medium px-4 py-2 rounded-lg transition-colors"
                >
                  Réessayer
                </button>
              </div>

              <!-- Empty State -->
              <div id="empty-state" class="hidden text-center py-12">
                <i
                  data-lucide="package"
                  class="w-12 h-12 text-gray-400 mx-auto mb-4"
                ></i>
                <h3 class="text-lg font-semibold text-textPrimary mb-2">
                  Aucun produit trouvé
                </h3>
                <p class="text-textSecondary">
                  Aucun produit ne correspond à votre recherche.
                </p>
              </div>

              <!-- Products Grid -->
              <div
                class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 hidden"
                id="products-grid"
              ></div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script>
      requireAuth(["CLIENT"]);
    </script>
    <script src="../../js/router.js"></script>
    <script src="../../js/components/sidebar.js"></script>
    <script src="../../js/components/header.js"></script>
    <script src="../../js/components/toast.js"></script>
    <script src="../../js/utils/format.js"></script>
    <script>
      initPage("CLIENT");
      const role = getCurrentRole();
      if (role) {
        renderSidebar(role.toLowerCase());
      }
      renderHeader();

      let allProducts = [];

      /**
       * Show a specific state panel and hide the others.
       * states: "loading" | "error" | "empty" | "grid"
       */
      function showState(state) {
        document.getElementById("loading-skeleton").classList.add("hidden");
        document.getElementById("error-state").classList.add("hidden");
        document.getElementById("empty-state").classList.add("hidden");
        document.getElementById("products-grid").classList.add("hidden");

        if (state === "loading") {
          document
            .getElementById("loading-skeleton")
            .classList.remove("hidden");
        } else if (state === "error") {
          document.getElementById("error-state").classList.remove("hidden");
        } else if (state === "empty") {
          document.getElementById("empty-state").classList.remove("hidden");
        } else if (state === "grid") {
          document.getElementById("products-grid").classList.remove("hidden");
        }
      }

      /**
       * Escape text for safe insertion into HTML attributes/content.
       */
      function escapeHtml(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      /**
       * Build a single product card.
       * Fields per envelope (camelCase): id, name, reference, description,
       * unitPrice, warrantyMonths, imageUrl, isActive, categoryId, brandId, supplierId.
       */
      function buildProductCard(product) {
        const productId = product.id || "";
        const name = product.name || "Produit sans nom";
        const reference = product.reference || "";
        const imageUrl = product.imageUrl;
        const warrantyMonths = product.warrantyMonths;

        const detailUrl =
          "product-detail.html?id=" + encodeURIComponent(productId);
        const quoteUrl =
          "quote-new.html?productId=" + encodeURIComponent(productId);

        const placeholder =
          '<div class="w-full h-full flex items-center justify-center bg-primary/10">' +
          '<i data-lucide="package" class="w-12 h-12 text-primary"></i></div>';

        const imageHtml = imageUrl
          ? '<img src="' +
            escapeHtml(imageUrl) +
            '" alt="' +
            escapeHtml(name) +
            '" class="w-full h-full object-cover" ' +
            "onerror=\"this.outerHTML='<div class=&quot;w-full h-full flex items-center justify-center bg-primary/10&quot;><i data-lucide=&quot;package&quot; class=&quot;w-12 h-12 text-primary&quot;></i></div>';if(window.lucide)lucide.createIcons();\">"
          : placeholder;

        const warrantyHtml = warrantyMonths
          ? '<span class="inline-flex items-center gap-1 px-2 py-1 rounded-md text-xs font-medium bg-blue-100 text-blue-800">' +
            '<i data-lucide="shield-check" class="w-3 h-3"></i>Garantie ' +
            escapeHtml(warrantyMonths) +
            " mois</span>"
          : "";

        return (
          '<div class="bg-surface rounded-xl shadow-sm border border-border overflow-hidden hover:shadow-md transition-shadow flex flex-col">' +
          // Clickable media + title -> product detail
          '<a href="' +
          detailUrl +
          '" class="block aspect-[4/3] bg-gray-100 relative">' +
          imageHtml +
          "</a>" +
          '<div class="p-4 flex flex-col flex-1">' +
          '<a href="' +
          detailUrl +
          '" class="block hover:text-accent transition-colors">' +
          '<h3 class="font-semibold text-textPrimary mb-1 line-clamp-1">' +
          escapeHtml(name) +
          "</h3>" +
          "</a>" +
          (reference
            ? '<p class="text-xs text-textSecondary mb-2 font-mono">' +
              escapeHtml(reference) +
              "</p>"
            : '<div class="mb-2"></div>') +
          '<p class="text-xl font-bold text-accent mb-2">' +
          formatCurrency(product.unitPrice) +
          "</p>" +
          (warrantyHtml ? '<div class="mb-3">' + warrantyHtml + "</div>" : "") +
          '<a href="' +
          quoteUrl +
          '" class="mt-auto block text-center bg-accent hover:bg-secondary text-white font-medium py-2 rounded-lg transition-colors text-sm">' +
          "Demander un devis" +
          "</a>" +
          "</div>" +
          "</div>"
        );
      }

      /**
       * Render a list of products into the grid (or show the empty state).
       */
      function renderProducts(products) {
        const grid = document.getElementById("products-grid");
        const countEl = document.getElementById("result-count");

        if (!products || products.length === 0) {
          countEl.textContent = "";
          showState("empty");
          lucide.createIcons();
          return;
        }

        showState("grid");
        grid.innerHTML = products.map(buildProductCard).join("");
        countEl.textContent =
          products.length +
          (products.length > 1 ? " produits" : " produit") +
          " affichés";
        lucide.createIcons();
      }

      /**
       * Load products from the real backend. The only valid catalog endpoint
       * is GET /products -> { success, count, products: [...] }.
       * Supports optional deep-link filters via URL params (categoryId / brandId / supplierId).
       */
      async function loadProducts() {
        showState("loading");

        const params = new URLSearchParams(window.location.search);
        const query = [];
        // GET /products honors only ONE filter (categoryId > brandId > supplierId).
        ["categoryId", "brandId", "supplierId"].forEach((key) => {
          const val = params.get(key);
          if (val) {
            query.push(key + "=" + encodeURIComponent(val));
          }
        });
        const endpoint = "/products" + (query.length ? "?" + query.join("&") : "");

        const r = await apiFetch(endpoint);
        if (!r || !r.ok) {
          showState("error");
          lucide.createIcons();
          showToast(
            r?.data?.message || "Impossible de charger le catalogue",
            "error"
          );
          return;
        }

        allProducts = r.data.products || [];
        renderProducts(allProducts);
      }

      /**
       * Filter the loaded products client-side by name/reference + price range.
       * There is no server-side search/pagination, so all filtering is in-memory.
       */
      function applyFilters() {
        const search = document
          .getElementById("search-input")
          .value.toLowerCase()
          .trim();
        const priceMin =
          parseFloat(document.getElementById("price-min").value) || 0;
        const priceMaxRaw = parseFloat(
          document.getElementById("price-max").value
        );
        const priceMax = isNaN(priceMaxRaw) ? Infinity : priceMaxRaw;

        const filtered = allProducts.filter((p) => {
          const name = (p.name || "").toLowerCase();
          const ref = (p.reference || "").toLowerCase();
          const price = parseFloat(p.unitPrice) || 0;

          const matchesSearch =
            !search || name.includes(search) || ref.includes(search);
          const matchesPrice = price >= priceMin && price <= priceMax;

          return matchesSearch && matchesPrice;
        });

        renderProducts(filtered);
      }

      /**
       * Clear all filters and show the full catalog again.
       */
      function resetFilters() {
        document.getElementById("search-input").value = "";
        document.getElementById("price-min").value = "";
        document.getElementById("price-max").value = "";
        renderProducts(allProducts);
      }

      // Search on Enter key.
      document
        .getElementById("search-input")
        .addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            applyFilters();
          }
        });

      // Initialize.
      loadProducts();
    </script>
  </body>
</html>
