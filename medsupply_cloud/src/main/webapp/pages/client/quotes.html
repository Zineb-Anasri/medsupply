<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mes Devis - MedSupply Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#0A2647", secondary: "#144272", accent: "#2C74B3",
              success: "#16A34A", warning: "#D97706", danger: "#DC2626",
              background: "#F8FAFC", surface: "#FFFFFF", border: "#E2E8F0",
              textPrimary: "#0F172A", textSecondary: "#64748B",
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
      body { font-family: "Inter", sans-serif; }
      .font-mono { font-family: "JetBrains Mono", monospace; }
    </style>
  </head>
  <body class="bg-background">
    <div class="flex h-screen">
      <aside id="sidebar" class="bg-white border-r border-gray-200 flex-shrink-0"></aside>
      <div class="flex-1 flex flex-col">
        <header id="header"></header>
        <main id="main-content" class="flex-1 p-6 overflow-y-auto">
          <div class="flex items-center justify-between mb-6">
            <div>
              <h1 class="text-2xl font-bold text-textPrimary">Mes Devis</h1>
              <p class="text-textSecondary">Suivez vos demandes de devis et leurs réponses</p>
            </div>
            <a href="/medsupply-cloud/pages/client/quote-new.html"
               class="bg-accent hover:bg-secondary text-white font-medium px-4 py-2 rounded-lg transition-colors flex items-center gap-2">
              <i data-lucide="file-plus" class="w-5 h-5"></i> Nouveau devis
            </a>
          </div>

          <!-- Stats -->
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="bg-surface rounded-xl shadow-sm border border-border p-5">
              <p class="text-textSecondary text-sm">Total</p>
              <p class="text-2xl font-bold text-textPrimary" id="stat-total">0</p>
            </div>
            <div class="bg-surface rounded-xl shadow-sm border border-border p-5">
              <p class="text-textSecondary text-sm">En attente</p>
              <p class="text-2xl font-bold text-yellow-600" id="stat-pending">0</p>
            </div>
            <div class="bg-surface rounded-xl shadow-sm border border-border p-5">
              <p class="text-textSecondary text-sm">Chiffrés</p>
              <p class="text-2xl font-bold text-blue-600" id="stat-reviewed">0</p>
            </div>
            <div class="bg-surface rounded-xl shadow-sm border border-border p-5">
              <p class="text-textSecondary text-sm">Approuvés</p>
              <p class="text-2xl font-bold text-success" id="stat-approved">0</p>
            </div>
          </div>

          <!-- Filter -->
          <div class="bg-surface rounded-xl shadow-sm border border-border p-4 mb-6">
            <div class="flex flex-wrap items-center gap-3">
              <select id="status-filter" onchange="renderQuotes()" class="px-4 py-2 border border-border rounded-lg outline-none focus:ring-2 focus:ring-accent">
                <option value="">Tous les statuts</option>
                <option value="PENDING">En attente</option>
                <option value="REVIEWED">Chiffré</option>
                <option value="APPROVED">Approuvé</option>
                <option value="REJECTED">Rejeté</option>
                <option value="CONVERTED">Converti</option>
              </select>
            </div>
          </div>

          <!-- Table -->
          <div class="bg-surface rounded-xl shadow-sm border border-border overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full">
                <thead class="bg-gray-50 border-b border-border">
                  <tr>
                    <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase">N° Devis</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Montant total</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Date</th>
                    <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Statut</th>
                    <th class="px-6 py-3 text-right text-xs font-semibold text-textSecondary uppercase">Actions</th>
                  </tr>
                </thead>
                <tbody id="quotes-body" class="divide-y divide-border">
                  <tr><td colspan="5" class="px-6 py-12 text-center text-textSecondary">Chargement...</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script>requireAuth(["CLIENT"]);</script>
    <script src="../../js/router.js"></script>
    <script src="../../js/components/sidebar.js"></script>
    <script src="../../js/components/header.js"></script>
    <script src="../../js/components/badge.js"></script>
    <script src="../../js/components/toast.js"></script>
    <script src="../../js/utils/format.js"></script>
    <script>
      initPage("CLIENT");
      renderSidebar(getCurrentRole().toLowerCase());
      renderHeader();

      let allQuotes = [];

      async function loadQuotes() {
        const r = await apiFetch("/quotes");
        if (!r || !r.ok) {
          document.getElementById("quotes-body").innerHTML =
            `<tr><td colspan="5" class="px-6 py-12 text-center text-danger">${r?.data?.message || "Erreur de chargement"}</td></tr>`;
          return;
        }
        allQuotes = r.data.quotes || [];
        updateStats();
        renderQuotes();
      }

      function updateStats() {
        const by = (s) => allQuotes.filter((q) => q.status === s).length;
        document.getElementById("stat-total").textContent = allQuotes.length;
        document.getElementById("stat-pending").textContent = by("PENDING");
        document.getElementById("stat-reviewed").textContent = by("REVIEWED");
        document.getElementById("stat-approved").textContent = by("APPROVED");
      }

      function renderQuotes() {
        const filter = document.getElementById("status-filter").value;
        const rows = allQuotes
          .filter((q) => !filter || q.status === filter)
          .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        const tbody = document.getElementById("quotes-body");
        if (rows.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-textSecondary">Aucun devis</td></tr>`;
          return;
        }
        tbody.innerHTML = rows.map((q) => `
          <tr class="hover:bg-gray-50 cursor-pointer" onclick="location.href='quote-detail.html?id=${q.quoteId}'">
            <td class="px-6 py-4 font-mono font-medium text-textPrimary">#${q.quoteId.slice(0, 8)}</td>
            <td class="px-6 py-4 font-medium text-textPrimary">${q.totalAmount != null ? formatCurrency(q.totalAmount) : "—"}</td>
            <td class="px-6 py-4 text-textSecondary">${formatDate(q.createdAt)}</td>
            <td class="px-6 py-4">${renderBadge(q.status)}</td>
            <td class="px-6 py-4 text-right">
              <a href="quote-detail.html?id=${q.quoteId}" onclick="event.stopPropagation()"
                 class="inline-flex items-center gap-1 text-accent hover:underline text-sm font-medium">
                <i data-lucide="eye" class="w-4 h-4"></i> Voir
              </a>
            </td>
          </tr>`).join("");
        lucide.createIcons();
      }

      loadQuotes();
    </script>
  </body>
</html>
