<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Détail Devis - MedSupply Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#0A2647",
            secondary: "#144272",
            accent: "#2C74B3",
            success: "#16A34A",
            warning: "#D97706",
            danger: "#DC2626",
            background: "#F8FAFC",
            surface: "#FFFFFF",
            border: "#E2E8F0",
            textPrimary: "#0F172A",
            textSecondary: "#64748B",
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-background">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <aside id="sidebar" class="bg-white border-r border-gray-200 flex-shrink-0"></aside>
    
    <!-- Main Content -->
    <div class="flex-1 flex flex-col ">
      <!-- Header -->
      <header id="header"></header>
      
      <!-- Content -->
      <main id="main-content" class="flex-1 p-6 overflow-y-auto">
        <!-- Breadcrumb -->
        <nav class="flex items-center gap-2 text-sm mb-6">
          <a href="/medsupply-cloud/pages/client/quotes.html" class="text-textSecondary hover:text-accent">Devis</a>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i>
          <span class="text-textPrimary font-medium" id="breadcrumb-ref">Chargement...</span>
        </nav>

        <!-- Status Banner -->
        <div id="status-banner" class="hidden mb-6">
          <!-- Banner will be shown based on status -->
        </div>

        <!-- Quote Header -->
        <div class="bg-surface rounded-xl shadow-sm border border-border p-6 mb-6">
          <div class="flex items-center justify-between">
            <div>
              <h1 class="text-2xl font-bold text-textPrimary" id="quote-ref">DV-2024-0001</h1>
              <p class="text-textSecondary text-sm" id="quote-date">Demandé le 01/01/2024</p>
            </div>
            <span id="quote-status" class="inline-flex items-center px-4 py-2 rounded-full text-sm font-medium">--</span>
          </div>
        </div>

        <!-- Quote Items Table -->
        <div class="bg-surface rounded-xl shadow-sm border border-border p-6 mb-6">
          <h3 class="font-semibold text-textPrimary mb-4">Produits</h3>
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-50 border-b border-border">
                <tr>
                  <th class="px-4 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Produit</th>
                  <th class="px-4 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Quantité</th>
                  <th class="px-4 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Prix unitaire</th>
                  <th class="px-4 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Total</th>
                </tr>
              </thead>
              <tbody id="quote-items-body" class="divide-y divide-border">
                <tr><td colspan="4" class="px-4 py-8 text-center text-textSecondary">Chargement...</td></tr>
              </tbody>
            </table>
          </div>

          <!-- Total -->
          <div class="flex justify-end mt-6">
            <div class="w-64">
              <div class="flex justify-between py-2 border-b border-border">
                <span class="text-textSecondary">Sous-total</span>
                <span class="text-textPrimary font-medium" id="subtotal">--</span>
              </div>
              <div class="flex justify-between py-2 border-b border-border">
                <span class="text-textSecondary">TVA (20%)</span>
                <span class="text-textPrimary font-medium" id="tax">--</span>
              </div>
              <div class="flex justify-between py-3">
                <span class="font-semibold text-textPrimary">Total</span>
                <span class="font-bold text-xl text-accent" id="total">--</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Status Timeline -->
        <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
          <h3 class="font-semibold text-textPrimary mb-4">Historique</h3>
          <div class="space-y-4" id="status-timeline">
            <!-- Timeline will be loaded dynamically -->
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    requireAuth(["CLIENT"]);
    const currentUser = getCurrentUser();
  </script>
  <script src="../../js/router.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/header.js"></script>
  <script src="../../js/components/badge.js"></script>
  <script src="../../js/utils/format.js"></script>
  <script>
    initPage("CLIENT");

    const urlParams = new URLSearchParams(window.location.search);
    const quoteId = urlParams.get('id');

    async function loadQuote() {
      try {
        const response = await apiFetch(`/client/quotes/${quoteId}`);
        const quote = response.data;

        // Update breadcrumb
        document.getElementById('breadcrumb-ref').textContent = quote.quoteRef;

        // Update quote header
        document.getElementById('quote-ref').textContent = quote.quoteRef;
        document.getElementById('quote-date').textContent = `Demandé le ${formatDate(quote.createdAt)}`;
        document.getElementById('quote-status').textContent = getStatusLabel(quote.status);
        document.getElementById('quote-status').className = `inline-flex items-center px-4 py-2 rounded-full text-sm font-medium ${getStatusColor(quote.status)}`;

        // Show status banner
        showStatusBanner(quote);

        // Update quote items
        const tbody = document.getElementById('quote-items-body');
        tbody.innerHTML = quote.items.map(item => `
          <tr>
            <td class="px-4 py-3">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gray-100 rounded overflow-hidden flex-shrink-0">
                  ${item.productImageUrl 
                    ? `<img src="${item.productImageUrl}" alt="${item.productName}" class="w-full h-full object-cover">`
                    : `<div class="w-full h-full flex items-center justify-center bg-primary bg-opacity-10">
                        <i data-lucide="package" class="w-5 h-5 text-primary"></i>
                      </div>`
                  }
                </div>
                <div>
                  <p class="font-medium text-textPrimary">${item.productName}</p>
                  <p class="text-sm text-textSecondary font-mono">${item.productReference}</p>
                </div>
              </div>
            </td>
            <td class="px-4 py-3 text-textPrimary">${item.quantity}</td>
            <td class="px-4 py-3 text-textPrimary">${formatCurrency(item.unitPrice)}</td>
            <td class="px-4 py-3 text-textPrimary font-medium">${formatCurrency(item.quantity * item.unitPrice)}</td>
          </tr>
        `).join("");

        // Update totals
        document.getElementById('subtotal').textContent = formatCurrency(quote.subtotal);
        document.getElementById('tax').textContent = formatCurrency(quote.tax);
        document.getElementById('total').textContent = formatCurrency(quote.totalAmount);

        // Update status timeline
        updateStatusTimeline(quote.timeline);

        lucide.createIcons();
      } catch (error) {
        console.error("Failed to load quote:", error);
      }
    }

    function showStatusBanner(quote) {
      const banner = document.getElementById('status-banner');
      banner.classList.remove('hidden');

      if (quote.status === 'VALIDATED' && quote.orderId) {
        banner.className = 'mb-6 bg-green-50 border border-green-200 rounded-lg p-4';
        banner.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <i data-lucide="check-circle" class="w-6 h-6 text-green-600"></i>
              <div>
                <p class="text-green-800 font-medium">Votre devis a été validé</p>
                <p class="text-green-700 text-sm">Une commande a été créée automatiquement.</p>
              </div>
            </div>
            <button onclick="viewOrder('${quote.orderId}')" class="bg-green-600 hover:bg-green-700 text-white font-medium px-4 py-2 rounded-lg transition-colors">
              Voir la commande
            </button>
          </div>
        `;
      } else if (quote.status === 'REJECTED') {
        banner.className = 'mb-6 bg-red-50 border border-red-200 rounded-lg p-4';
        banner.innerHTML = `
          <div class="flex items-start gap-3">
            <i data-lucide="x-circle" class="w-6 h-6 text-red-600 mt-0.5"></i>
            <div>
              <p class="text-red-800 font-medium">Devis rejeté</p>
              <p class="text-red-700 text-sm">${quote.rejectionReason || 'Aucune raison spécifiée.'}</p>
            </div>
          </div>
        `;
      } else {
        banner.classList.add('hidden');
      }
    }

    function updateStatusTimeline(timeline) {
      const container = document.getElementById('status-timeline');
      container.innerHTML = timeline.map((event, index) => `
        <div class="flex gap-3">
          <div class="flex flex-col items-center">
            <div class="w-3 h-3 rounded-full ${index === 0 ? 'bg-accent' : 'bg-gray-300'}"></div>
            ${index < timeline.length - 1 ? '<div class="w-0.5 h-8 bg-gray-200"></div>' : ''}
          </div>
          <div class="flex-1 pb-4">
            <p class="text-sm font-medium text-textPrimary">${event.status}</p>
            <p class="text-xs text-textSecondary">${formatDate(event.date)}</p>
            ${event.note ? `<p class="text-xs text-textSecondary mt-1">${event.note}</p>` : ''}
          </div>
        </div>
      `).join('');
    }

    function viewOrder(orderId) {
      window.location.href = `order-detail.html?id=${orderId}`;
    }

    function getStatusLabel(status) {
      const labels = {
        PENDING: "En attente",
        PROCESSING: "En traitement",
        VALIDATED: "Validé",
        REJECTED: "Rejeté",
        EXPIRED: "Expiré"
      };
      return labels[status] || status;
    }

    function getStatusColor(status) {
      const colors = {
        PENDING: "bg-yellow-100 text-yellow-800",
        PROCESSING: "bg-blue-100 text-blue-800",
        VALIDATED: "bg-green-100 text-green-800",
        REJECTED: "bg-red-100 text-red-800",
        EXPIRED: "bg-gray-100 text-gray-800"
      };
      return colors[status] || 'bg-gray-100 text-gray-800';
    }

    // Load quote on page load
    if (quoteId) {
      loadQuote();
    } else {
      window.location.href = '/medsupply-cloud/pages/quotes.html';
    }
  </script>
</body>
</html>
