<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Détail Devis - MedSupply Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#0A2647", secondary: "#144272", accent: "#2C74B3",
              success: "#16A34A", warning: "#D97706", danger: "#DC2626",
              background: "#F8FAFC", surface: "#FFFFFF", border: "#E2E8F0",
              textPrimary: "#0F172A", textSecondary: "#64748B",
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
      body { font-family: "Inter", sans-serif; }
      .font-mono { font-family: "JetBrains Mono", monospace; }
    </style>
  </head>
  <body class="bg-background">
    <div class="flex h-screen">
      <aside id="sidebar" class="bg-white border-r border-gray-200 flex-shrink-0"></aside>
      <div class="flex-1 flex flex-col">
        <header id="header"></header>
        <main id="main-content" class="flex-1 p-6 overflow-y-auto">
          <div class="flex items-center gap-3 mb-6">
            <a href="/medsupply-cloud/pages/client/quotes.html" class="p-2 rounded-lg hover:bg-gray-100">
              <i data-lucide="arrow-left" class="w-5 h-5 text-textSecondary"></i>
            </a>
            <div>
              <h1 class="text-2xl font-bold text-textPrimary" id="quote-title">Devis</h1>
              <p class="text-textSecondary" id="quote-sub">Chargement...</p>
            </div>
          </div>

          <div id="content" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <p class="text-textSecondary">Chargement...</p>
          </div>
        </main>
      </div>
    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script>requireAuth(["CLIENT"]);</script>
    <script src="../../js/router.js"></script>
    <script src="../../js/components/sidebar.js"></script>
    <script src="../../js/components/header.js"></script>
    <script src="../../js/components/badge.js"></script>
    <script src="../../js/components/toast.js"></script>
    <script src="../../js/utils/format.js"></script>
    <script>
      initPage("CLIENT");
      renderSidebar(getCurrentRole().toLowerCase());
      renderHeader();

      const quoteId = new URLSearchParams(location.search).get("id");
      let productMap = {};

      async function load() {
        if (!quoteId) { location.href = "quotes.html"; return; }
        // product names (best-effort)
        const pr = await apiFetch("/products");
        if (pr && pr.ok) (pr.data.products || []).forEach((p) => (productMap[p.id] = p));

        const r = await apiFetch(`/quotes/${quoteId}`);
        if (!r || !r.ok) {
          document.getElementById("content").innerHTML =
            `<p class="text-danger">${r?.data?.message || "Devis introuvable"}</p>`;
          return;
        }
        render(r.data.quote, r.data.items || []);
      }

      function render(quote, items) {
        document.getElementById("quote-title").textContent = "Devis #" + quote.quoteId.slice(0, 8);
        document.getElementById("quote-sub").innerHTML =
          `Créé le ${formatDate(quote.createdAt)} &middot; ${renderBadge(quote.status)}`;

        const rows = items.map((it) => {
          const p = productMap[it.productId] || {};
          const unit = it.adminPrice != null ? it.adminPrice : it.proposedPrice;
          const lineTotal = unit != null ? unit * it.quantity : null;
          return `
            <tr class="border-b border-border">
              <td class="px-4 py-3">
                <p class="font-medium text-textPrimary">${p.name || "Produit #" + it.productId.slice(0, 8)}</p>
                <p class="text-xs text-textSecondary font-mono">${p.reference || ""}</p>
              </td>
              <td class="px-4 py-3 text-center">${it.quantity}</td>
              <td class="px-4 py-3 text-right">${it.proposedPrice != null ? formatCurrency(it.proposedPrice) : "—"}</td>
              <td class="px-4 py-3 text-right font-medium">${it.adminPrice != null ? formatCurrency(it.adminPrice) : '<span class="text-textSecondary">En attente</span>'}</td>
              <td class="px-4 py-3 text-right font-semibold">${lineTotal != null ? formatCurrency(lineTotal) : "—"}</td>
            </tr>`;
        }).join("");

        const canDecide = quote.status === "REVIEWED";
        const actions = canDecide
          ? `<div class="flex gap-3">
               <button onclick="decide('accept')" class="flex-1 bg-success hover:opacity-90 text-white font-medium px-4 py-2.5 rounded-lg flex items-center justify-center gap-2"><i data-lucide="check" class="w-5 h-5"></i> Accepter</button>
               <button onclick="decide('reject')" class="flex-1 bg-danger hover:opacity-90 text-white font-medium px-4 py-2.5 rounded-lg flex items-center justify-center gap-2"><i data-lucide="x" class="w-5 h-5"></i> Refuser</button>
             </div>`
          : quote.status === "PENDING"
          ? `<p class="text-sm text-textSecondary">Votre demande est en attente de chiffrage par notre équipe.</p>`
          : quote.status === "APPROVED"
          ? `<p class="text-sm text-success">Devis approuvé. Il sera converti en commande par l'administrateur.</p>`
          : quote.status === "CONVERTED"
          ? `<a href="orders.html" class="text-accent hover:underline text-sm font-medium">Voir mes commandes →</a>`
          : `<p class="text-sm text-textSecondary">Aucune action disponible.</p>`;

        document.getElementById("content").innerHTML = `
          <div class="lg:col-span-2 bg-surface rounded-xl shadow-sm border border-border overflow-hidden">
            <div class="px-6 py-4 border-b border-border"><h2 class="font-semibold text-textPrimary">Articles</h2></div>
            <table class="w-full text-sm">
              <thead class="bg-gray-50 text-xs uppercase text-textSecondary">
                <tr>
                  <th class="px-4 py-2 text-left">Produit</th>
                  <th class="px-4 py-2 text-center">Qté</th>
                  <th class="px-4 py-2 text-right">Prix proposé</th>
                  <th class="px-4 py-2 text-right">Prix validé</th>
                  <th class="px-4 py-2 text-right">Total</th>
                </tr>
              </thead>
              <tbody>${rows || `<tr><td colspan="5" class="px-4 py-6 text-center text-textSecondary">Aucun article</td></tr>`}</tbody>
            </table>
          </div>
          <div class="space-y-6">
            <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
              <p class="text-textSecondary text-sm">Montant total</p>
              <p class="text-3xl font-bold text-textPrimary mb-4">${quote.totalAmount != null ? formatCurrency(quote.totalAmount) : "—"}</p>
              ${actions}
            </div>
          </div>`;
        lucide.createIcons();
      }

      async function decide(action) {
        const label = action === "accept" ? "accepter" : "refuser";
        if (!confirm(`Voulez-vous ${label} ce devis ?`)) return;
        const r = await apiFetch(`/quotes/${quoteId}/${action}`, { method: "PUT" });
        if (r && r.ok && r.data.success) {
          showToast(action === "accept" ? "Devis accepté" : "Devis refusé", "success");
          load();
        } else {
          showToast(r?.data?.message || "Action impossible", "error");
        }
      }

      load();
    </script>
  </body>
</html>
