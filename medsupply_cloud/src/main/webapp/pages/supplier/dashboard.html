<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord - Fournisseur - MedSupply Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#0A2647",
            secondary: "#144272",
            accent: "#2C74B3",
            success: "#16A34A",
            warning: "#D97706",
            danger: "#DC2626",
            background: "#F8FAFC",
            surface: "#FFFFFF",
            border: "#E2E8F0",
            textPrimary: "#0F172A",
            textSecondary: "#64748B",
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-background">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <aside id="sidebar" class="bg-white border-r border-gray-200 flex-shrink-0"></aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col">
      <!-- Header -->
      <header id="header"></header>

      <!-- Content -->
      <main id="main-content" class="flex-1 p-6 overflow-y-auto">

        <!-- Quick Actions -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
          <a href="/medsupply-cloud/pages/supplier/marketplace.html" class="bg-surface rounded-xl shadow-sm border border-border p-6 hover:border-accent transition-colors cursor-pointer">
            <div class="flex items-center gap-4">
              <div class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center">
                <i data-lucide="gavel" class="w-6 h-6 text-purple-600"></i>
              </div>
              <div>
                <p class="font-semibold text-textPrimary">Marché</p>
                <p class="text-sm text-textSecondary">Voir les appels d'offres</p>
              </div>
            </div>
          </a>

          <a href="/medsupply-cloud/pages/supplier/offers.html" class="bg-surface rounded-xl shadow-sm border border-border p-6 hover:border-accent transition-colors cursor-pointer">
            <div class="flex items-center gap-4">
              <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
                <i data-lucide="tag" class="w-6 h-6 text-green-600"></i>
              </div>
              <div>
                <p class="font-semibold text-textPrimary">Mes offres</p>
                <p class="text-sm text-textSecondary">Gérer mes soumissions</p>
              </div>
            </div>
          </a>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center gap-4">
              <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                <i data-lucide="gavel" class="w-6 h-6 text-accent"></i>
              </div>
              <div>
                <p class="text-textSecondary text-sm">Appels d'offres ouverts</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-tenders">...</p>
              </div>
            </div>
          </div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center gap-4">
              <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
                <i data-lucide="package" class="w-6 h-6 text-success"></i>
              </div>
              <div>
                <p class="text-textSecondary text-sm">Produits actifs</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-products">...</p>
              </div>
            </div>
          </div>
        </div>

        <!-- Open Tenders -->
        <div class="bg-surface rounded-xl shadow-sm border border-border p-6 mb-6">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold text-textPrimary">Appels d'offres ouverts</h2>
            <a href="/medsupply-cloud/pages/supplier/marketplace.html" class="text-accent text-sm hover:underline">Voir tout</a>
          </div>
          <div id="open-tenders" class="space-y-3">
            <p class="text-textSecondary">Chargement...</p>
          </div>
        </div>

        <!-- Notifications -->
        <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold text-textPrimary">Notifications</h2>
            <a href="/medsupply-cloud/pages/supplier/notifications.html" class="text-accent text-sm hover:underline">Voir tout</a>
          </div>
          <div id="notifications" class="space-y-3">
            <p class="text-textSecondary">Chargement...</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    requireAuth(["SUPPLIER"]);
  </script>
  <script src="../../js/router.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/header.js"></script>
  <script src="../../js/components/badge.js"></script>
  <script src="../../js/components/toast.js"></script>
  <script src="../../js/utils/format.js"></script>
  <script>
    initPage("SUPPLIER");
    const role = getCurrentRole();
    if (role) {
      renderSidebar(role.toLowerCase());
    }
    renderHeader();

    function escapeHtml(str) {
      return String(str == null ? "" : str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function loadTenders() {
      const statEl = document.getElementById("stat-tenders");
      const container = document.getElementById("open-tenders");
      try {
        const r = await apiFetch("/tenders/open");
        if (!r || !r.ok) {
          statEl.textContent = "—";
          container.innerHTML = "<p class='text-textSecondary'>Impossible de charger les appels d'offres</p>";
          showToast(r?.data?.message || "Erreur lors du chargement des appels d'offres", "error");
          return;
        }
        const tenders = r.data?.tenders || [];
        statEl.textContent = tenders.length;

        if (tenders.length === 0) {
          container.innerHTML = "<div class='text-center py-8'><i data-lucide='gavel' class='w-10 h-10 text-textSecondary mx-auto mb-2'></i><p class='text-textSecondary'>Aucun appel d'offres ouvert</p></div>";
        } else {
          container.innerHTML = tenders.slice(0, 5).map(tender => `
            <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
              <div class="min-w-0">
                <p class="font-medium text-textPrimary truncate">${escapeHtml(tender.title) || ("#" + String(tender.tenderId || "").slice(0, 8))}</p>
                <p class="text-sm text-textSecondary">Budget: ${formatCurrency(tender.budgetMax)} - Échéance: ${formatDate(tender.deadline)}</p>
              </div>
              <a href="/medsupply-cloud/pages/supplier/marketplace.html?id=${encodeURIComponent(tender.tenderId || "")}" class="text-accent text-sm hover:underline whitespace-nowrap ml-3">Enchérir</a>
            </div>
          `).join("");
        }
        lucide.createIcons();
      } catch (error) {
        console.error("Failed to load tenders:", error);
        statEl.textContent = "—";
        container.innerHTML = "<p class='text-textSecondary'>Impossible de charger les appels d'offres</p>";
      }
    }

    async function loadProducts() {
      const statEl = document.getElementById("stat-products");
      try {
        const user = getCurrentUser();
        const r = await apiFetch("/products?supplierId=" + encodeURIComponent(user.userId));
        if (!r || !r.ok) {
          statEl.textContent = "—";
          showToast(r?.data?.message || "Erreur lors du chargement des produits", "error");
          return;
        }
        statEl.textContent = r.data?.products?.length ?? r.data?.count ?? 0;
      } catch (error) {
        console.error("Failed to load products:", error);
        statEl.textContent = "—";
      }
    }

    async function loadNotifications() {
      const container = document.getElementById("notifications");
      try {
        const r = await apiFetch("/notifications/unread");
        if (!r || !r.ok) {
          container.innerHTML = "<p class='text-textSecondary'>Impossible de charger les notifications</p>";
          showToast(r?.data?.message || "Erreur lors du chargement des notifications", "error");
          return;
        }
        const notifs = r.data?.notifications || [];
        if (notifs.length === 0) {
          container.innerHTML = "<div class='text-center py-8'><i data-lucide='bell-off' class='w-10 h-10 text-textSecondary mx-auto mb-2'></i><p class='text-textSecondary'>Aucune notification récente</p></div>";
        } else {
          container.innerHTML = notifs.slice(0, 5).map(notif => `
            <div class="flex items-start gap-3 p-3 bg-gray-50 rounded-lg">
              <div class="w-2 h-2 bg-accent rounded-full mt-2 flex-shrink-0"></div>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-medium text-textPrimary">${escapeHtml(notif.title)}</p>
                ${notif.message ? `<p class="text-xs text-textSecondary mt-0.5">${escapeHtml(notif.message)}</p>` : ""}
                <p class="text-xs text-textSecondary mt-1">${formatRelativeTime(notif.createdAt)}</p>
              </div>
            </div>
          `).join("");
        }
        lucide.createIcons();
      } catch (error) {
        console.error("Failed to load notifications:", error);
        container.innerHTML = "<p class='text-textSecondary'>Impossible de charger les notifications</p>";
      }
    }

    function loadDashboardData() {
      loadTenders();
      loadProducts();
      loadNotifications();
    }

    loadDashboardData();
  </script>
</body>
</html>
