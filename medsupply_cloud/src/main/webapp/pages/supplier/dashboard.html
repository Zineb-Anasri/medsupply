<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord - Fournisseur - MedSupply Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#0A2647",
            secondary: "#144272",
            accent: "#2C74B3",
            success: "#16A34A",
            warning: "#D97706",
            danger: "#DC2626",
            background: "#F8FAFC",
            surface: "#FFFFFF",
            border: "#E2E8F0",
            textPrimary: "#0F172A",
            textSecondary: "#64748B",
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-background">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-72 bg-white border-r border-gray-200 flex-shrink-0"></aside>
    
    <!-- Main Content -->
    <div class="flex-1 flex flex-col ml-72">
      <!-- Header -->
      <header id="header"></header>
      
      <!-- Content -->
      <main id="main-content" class="flex-1 p-6 overflow-y-auto">

        <!-- Quick Actions -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
          <a href="/medsupply-cloud/pages/supplier/marketplace.html" class="bg-surface rounded-xl shadow-sm border border-border p-6 hover:border-accent transition-colors cursor-pointer">
            <div class="flex items-center gap-4">
              <div class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center">
                <i data-lucide="gavel" class="w-6 h-6 text-purple-600"></i>
              </div>
              <div>
                <p class="font-semibold text-textPrimary">Marché</p>
                <p class="text-sm text-textSecondary">Voir les appels d'offres</p>
              </div>
            </div>
          </a>

          <a href="/medsupply-cloud/pages/supplier/offers.html" class="bg-surface rounded-xl shadow-sm border border-border p-6 hover:border-accent transition-colors cursor-pointer">
            <div class="flex items-center gap-4">
              <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
                <i data-lucide="tag" class="w-6 h-6 text-green-600"></i>
              </div>
              <div>
                <p class="font-semibold text-textPrimary">Mes offres</p>
                <p class="text-sm text-textSecondary">Gérer mes soumissions</p>
              </div>
            </div>
          </a>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <p class="text-textSecondary text-sm">Appels d'offres ouverts</p>
            <p class="text-2xl font-bold text-textPrimary" id="stat-tenders">0</p>
          </div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <p class="text-textSecondary text-sm">Offres soumises</p>
            <p class="text-2xl font-bold text-textPrimary" id="stat-bids">0</p>
          </div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <p class="text-textSecondary text-sm">Offres gagnées</p>
            <p class="text-2xl font-bold text-textPrimary" id="stat-won">0</p>
          </div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <p class="text-textSecondary text-sm">Produits actifs</p>
            <p class="text-2xl font-bold text-textPrimary" id="stat-products">0</p>
          </div>
        </div>

        <!-- Open Tenders -->
        <div class="bg-surface rounded-xl shadow-sm border border-border p-6 mb-6">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold text-textPrimary">Appels d'offres ouverts</h2>
            <a href="/medsupply-cloud/pages/supplier/marketplace.html" class="text-accent text-sm hover:underline">Voir tout</a>
          </div>
          <div id="open-tenders" class="space-y-3">
            <p class="text-textSecondary">Chargement...</p>
          </div>
        </div>

        <!-- My Bids -->
        <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
          <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold text-textPrimary">Mes offres récentes</h2>
            <a href="/medsupply-cloud/pages/supplier/offers.html" class="text-accent text-sm hover:underline">Voir tout</a>
          </div>
          <div id="my-bids" class="space-y-3">
            <p class="text-textSecondary">Chargement...</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    requireAuth(["SUPPLIER"]);
  </script>
  <script src="../../js/router.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/header.js"></script>
  <script src="../../js/components/badge.js"></script>
  <script src="../../js/components/toast.js"></script>
  <script src="../../js/utils/format.js"></script>
  <script>
    initPage("SUPPLIER");
    const role = getCurrentRole();
    if (role) {
      renderSidebar(role.toLowerCase());
    }
    renderHeader();

    async function loadDashboardData() {
      try {
        // Load open tenders
        const tendersResponse = await apiFetch("/tenders/open");
        const tenders = tendersResponse?.data?.tenders || [];
        document.getElementById("stat-tenders").textContent = tenders.length;
        
        const tendersContainer = document.getElementById("open-tenders");
        if (tenders.length === 0) {
          tendersContainer.innerHTML = "<p class='text-textSecondary'>Aucun appel d'offres ouvert</p>";
        } else {
          tendersContainer.innerHTML = tenders.slice(0, 5).map(tender => `
            <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
              <div>
                <p class="font-medium text-textPrimary">${tender.title}</p>
                <p class="text-sm text-textSecondary">Budget: ${formatCurrency(tender.budgetMax)} - Deadline: ${formatDate(tender.deadline)}</p>
              </div>
              <a href="/medsupply-cloud/pages/supplier/marketplace.html" class="text-accent text-sm hover:underline">Enchérir</a>
            </div>
          `).join("");
        }

        // Load notifications
        const notificationsResponse = await apiFetch("/notifications/unread");
        const notifications = notificationsResponse?.data?.notifications || [];
        document.getElementById("stat-bids").textContent = notifications.length;
        
        const bidsContainer = document.getElementById("my-bids");
        if (notifications.length === 0) {
          bidsContainer.innerHTML = "<p class='text-textSecondary'>Aucune notification récente</p>";
        } else {
          bidsContainer.innerHTML = notifications.slice(0, 5).map(notif => `
            <div class="flex items-center gap-3 p-3 bg-gray-50 rounded-lg">
              <div class="w-2 h-2 bg-blue-500 rounded-full"></div>
              <div class="flex-1">
                <p class="text-sm font-medium text-textPrimary">${notif.title}</p>
                <p class="text-xs text-textSecondary">${formatRelativeTime(notif.createdAt)}</p>
              </div>
            </div>
          `).join("");
        }

        lucide.createIcons();
      } catch (error) {
        console.error("Failed to load dashboard data:", error);
      }
    }

    loadDashboardData();
  </script>
</body>
</html>
