<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace B2B - MedSupply Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#0A2647",
            secondary: "#144272",
            accent: "#2C74B3",
            success: "#16A34A",
            warning: "#D97706",
            danger: "#DC2626",
            background: "#F8FAFC",
            surface: "#FFFFFF",
            border: "#E2E8F0",
            textPrimary: "#0F172A",
            textSecondary: "#64748B",
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-background">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-72 bg-white border-r border-gray-200 flex-shrink-0"></aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col ml-72">
      <!-- Header -->
      <header id="header"></header>

      <!-- Content -->
      <main id="main-content" class="flex-1 p-6 overflow-y-auto">
        <!-- Page Header -->
        <div class="mb-6">
          <h1 class="text-2xl font-bold text-textPrimary">Marketplace B2B</h1>
          <p class="text-textSecondary">Découvrez les appels d'offres et soumettez vos propositions</p>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">Appels ouverts</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-open">--</p>
              </div>
              <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
                <i data-lucide="gavel" class="w-6 h-6 text-green-600"></i>
              </div>
            </div>
          </div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">Mes offres</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-my-offers">--</p>
              </div>
              <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                <i data-lucide="file-text" class="w-6 h-6 text-blue-600"></i>
              </div>
            </div>
          </div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">Marchés attribués</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-awarded">--</p>
              </div>
              <div class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center">
                <i data-lucide="trophy" class="w-6 h-6 text-purple-600"></i>
              </div>
            </div>
          </div>
        </div>

        <!-- Available Tenders -->
        <div class="bg-surface rounded-xl shadow-sm border border-border p-6 mb-6">
          <div class="flex items-center justify-between mb-4">
            <h3 class="font-semibold text-textPrimary">Appels d'offres disponibles</h3>
            <button onclick="loadMarketplace()" class="inline-flex items-center gap-2 text-sm text-textSecondary hover:text-accent transition-colors">
              <i data-lucide="refresh-cw" class="w-4 h-4"></i>
              Actualiser
            </button>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="tenders-grid">
            <div class="col-span-full text-center py-12 text-textSecondary">Chargement...</div>
          </div>
        </div>

        <!-- My Offers -->
        <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
          <h3 class="font-semibold text-textPrimary mb-4">Mes offres soumises</h3>
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-50 border-b border-border">
                <tr>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Appel d'offres</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Mon prix</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Statut de l'appel</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Date soumission</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Actions</th>
                </tr>
              </thead>
              <tbody id="offers-table-body" class="divide-y divide-border">
                <tr>
                  <td colspan="5" class="px-6 py-12 text-center text-textSecondary">Chargement...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    requireAuth(["SUPPLIER"]);
  </script>
  <script src="../../js/router.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/header.js"></script>
  <script src="../../js/components/badge.js"></script>
  <script src="../../js/components/toast.js"></script>
  <script src="../../js/utils/format.js"></script>
  <script>
    initPage("SUPPLIER");
    const role = getCurrentRole();
    if (role) {
      renderSidebar(role.toLowerCase());
    }
    renderHeader();

    let countdownIntervals = {};

    function clearCountdowns() {
      Object.values(countdownIntervals).forEach(interval => clearInterval(interval));
      countdownIntervals = {};
    }

    async function loadMarketplace() {
      clearCountdowns();
      const grid = document.getElementById('tenders-grid');
      const tbody = document.getElementById('offers-table-body');
      grid.innerHTML = `<div class="col-span-full text-center py-12 text-textSecondary">Chargement...</div>`;
      tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-textSecondary">Chargement...</td></tr>`;

      try {
        // ---- Open tenders ----
        const tendersRes = await apiFetch('/tenders/open');
        if (!tendersRes || !tendersRes.ok) {
          showToast(tendersRes?.data?.message || "Erreur lors du chargement des appels d'offres", "error");
          grid.innerHTML = `<div class="col-span-full text-center py-12 text-textSecondary">Impossible de charger les appels d'offres</div>`;
        } else {
          const tenders = tendersRes.data.tenders || [];
          document.getElementById('stat-open').textContent = tenders.length;
          renderTenders(tenders);
        }

        // ---- My bids ----
        const bidsRes = await apiFetch('/tenders/my-bids');
        if (!bidsRes || !bidsRes.ok) {
          showToast(bidsRes?.data?.message || "Erreur lors du chargement de vos offres", "error");
          document.getElementById('stat-my-offers').textContent = '0';
          document.getElementById('stat-awarded').textContent = '0';
          tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-textSecondary">Impossible de charger vos offres</td></tr>`;
        } else {
          const bids = bidsRes.data.bids || [];
          await renderMyOffers(bids);
        }
      } catch (error) {
        console.error("Failed to load marketplace:", error);
        showToast("Erreur lors du chargement de la marketplace", "error");
      }

      lucide.createIcons();
    }

    function renderTenders(tenders) {
      const grid = document.getElementById('tenders-grid');
      if (!tenders.length) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-textSecondary">
          <i data-lucide="inbox" class="w-10 h-10 mx-auto mb-3 text-gray-300"></i>
          <p>Aucun appel d'offres disponible pour le moment</p>
        </div>`;
        return;
      }

      grid.innerHTML = tenders.map(tender => {
        const countdownId = `countdown-${tender.tenderId}`;
        const desc = tender.description
          ? `<p class="text-sm text-textSecondary line-clamp-2 mb-3">${escapeHtml(tender.description)}</p>`
          : '';
        return `
          <div class="bg-gray-50 rounded-xl border border-border p-6 flex flex-col">
            <div class="mb-3">
              <div class="flex items-start justify-between gap-2 mb-2">
                <h3 class="font-semibold text-textPrimary text-lg">${escapeHtml(tender.title)}</h3>
                ${renderBadge(tender.status)}
              </div>
              <p class="text-xs text-textSecondary font-mono">Client #${tender.clientId ? tender.clientId.slice(0, 8) : '—'}</p>
            </div>
            ${desc}
            <div class="space-y-2 mb-4 mt-auto">
              <div class="flex items-center gap-2">
                <i data-lucide="wallet" class="w-4 h-4 text-accent"></i>
                <span class="text-sm text-textSecondary">Budget max: <span class="font-medium text-textPrimary">${formatCurrency(tender.budgetMax)}</span></span>
              </div>
              <div class="flex items-center gap-2">
                <i data-lucide="clock" class="w-4 h-4 ${getDeadlineUrgencyClass(tender.deadline)}"></i>
                <span class="text-sm ${getDeadlineUrgencyClass(tender.deadline)}" id="${countdownId}">--</span>
              </div>
            </div>
            <button onclick="viewTender('${tender.tenderId}')" class="w-full bg-accent hover:bg-secondary text-white font-medium py-2 rounded-lg transition-colors">
              Voir &amp; Soumettre
            </button>
          </div>
        `;
      }).join('');

      tenders.forEach(tender => startCountdown(tender.tenderId, tender.deadline));
    }

    // Build "Mes offres soumises" from the supplier's own bids (GET /tenders/my-bids).
    // Resolve each distinct tender (title + status) via GET /tenders/{id} so we can show
    // the tender name and best-effort "Marchés attribués" (tender status === AWARDED).
    async function renderMyOffers(bids) {
      const tbody = document.getElementById('offers-table-body');

      if (!bids.length) {
        document.getElementById('stat-my-offers').textContent = '0';
        document.getElementById('stat-awarded').textContent = '0';
        tbody.innerHTML = `<tr><td colspan="5" class="px-6 py-12 text-center text-textSecondary">
          <i data-lucide="file-text" class="w-8 h-8 mx-auto mb-2 text-gray-300"></i>
          <p>Vous n'avez soumis aucune offre</p>
        </td></tr>`;
        return;
      }

      // Resolve distinct tenders once.
      const tenderIds = [...new Set(bids.map(b => b.tenderId))];
      const tenderMap = {};
      await Promise.all(tenderIds.map(async (id) => {
        const r = await apiFetch('/tenders/' + id);
        if (r && r.ok && r.data && r.data.tender) {
          tenderMap[id] = r.data.tender;
        }
      }));

      let awardedCount = 0;
      tenderIds.forEach(id => {
        if (tenderMap[id] && tenderMap[id].status === 'AWARDED') awardedCount++;
      });

      document.getElementById('stat-my-offers').textContent = bids.length;
      document.getElementById('stat-awarded').textContent = awardedCount;

      // Most recent bids first.
      const sorted = [...bids].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

      tbody.innerHTML = sorted.map(bid => {
        const tender = tenderMap[bid.tenderId];
        const title = tender ? escapeHtml(tender.title) : `Appel #${bid.tenderId.slice(0, 8)}`;
        const statusCell = tender ? renderBadge(tender.status) : '<span class="text-textSecondary text-sm">—</span>';
        return `
          <tr class="hover:bg-gray-50">
            <td class="px-6 py-4 text-textPrimary font-medium">${title}</td>
            <td class="px-6 py-4 text-textPrimary font-bold">${formatCurrency(bid.price)}</td>
            <td class="px-6 py-4">${statusCell}</td>
            <td class="px-6 py-4 text-textSecondary">${formatDate(bid.createdAt)}</td>
            <td class="px-6 py-4">
              <button onclick="viewTender('${bid.tenderId}')" class="p-2 hover:bg-gray-100 rounded transition-colors" title="Voir l'appel d'offres">
                <i data-lucide="eye" class="w-4 h-4 text-gray-600"></i>
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function startCountdown(tenderId, deadline) {
      const elementId = `countdown-${tenderId}`;
      const element = document.getElementById(elementId);
      if (!element) return;

      const updateCountdown = () => {
        const now = new Date();
        const deadlineDate = new Date(deadline);
        const diffMs = deadlineDate - now;

        if (diffMs <= 0) {
          element.textContent = 'Expiré';
          element.className = 'text-sm text-red-600 font-medium';
          clearInterval(countdownIntervals[tenderId]);
          return;
        }

        const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
        const diffHours = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const diffMinutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));

        let text = '';
        if (diffDays > 0) {
          text = `Ferme dans ${diffDays} jour${diffDays > 1 ? 's' : ''}`;
        } else if (diffHours > 0) {
          text = `Ferme dans ${diffHours} heure${diffHours > 1 ? 's' : ''}`;
        } else {
          text = `Ferme dans ${diffMinutes} minute${diffMinutes > 1 ? 's' : ''}`;
        }

        element.textContent = text;
        element.className = `text-sm ${getDeadlineUrgencyClass(deadline)}`;
      };

      updateCountdown();
      countdownIntervals[tenderId] = setInterval(updateCountdown, 60000);
    }

    function getDeadlineUrgencyClass(deadline) {
      const now = new Date();
      const deadlineDate = new Date(deadline);
      const diffHours = (deadlineDate - now) / (1000 * 60 * 60);
      if (diffHours < 24) return 'text-red-600 font-medium';
      if (diffHours < 168) return 'text-amber-600 font-medium';
      return 'text-textSecondary';
    }

    function escapeHtml(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function viewTender(tenderId) {
      window.location.href = `marketplace-detail.html?id=${tenderId}`;
    }

    // Load marketplace on page load
    loadMarketplace();

    // Cleanup intervals on page unload
    window.addEventListener('beforeunload', clearCountdowns);
  </script>
</body>
</html>
