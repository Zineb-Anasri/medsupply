<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mes Offres - MedSupply Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#0A2647",
              secondary: "#144272",
              accent: "#2C74B3",
              success: "#16A34A",
              warning: "#D97706",
              danger: "#DC2626",
              background: "#F8FAFC",
              surface: "#FFFFFF",
              border: "#E2E8F0",
              textPrimary: "#0F172A",
              textSecondary: "#64748B",
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="bg-background">
    <div class="flex h-screen">
      <aside
        id="sidebar"
        class="w-72 bg-white border-r border-gray-200 flex-shrink-0"
      ></aside>
      <div class="flex-1 flex flex-col ml-72">
        <header id="header"></header>
        <main id="main-content" class="flex-1 p-6 overflow-y-auto">
          <div class="flex items-center justify-between mb-6">
            <div>
              <h1 class="text-2xl font-bold text-textPrimary">Mes Offres</h1>
              <p class="text-textSecondary">
                Vos soumissions aux appels d'offres
              </p>
            </div>
            <a
              href="../supplier/marketplace.html"
              class="inline-flex items-center gap-2 bg-accent hover:bg-secondary text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors"
            >
              <i data-lucide="gavel" class="w-4 h-4"></i>
              Voir les appels d'offres
            </a>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div
              class="bg-surface rounded-xl shadow-sm border border-border p-6"
            >
              <p class="text-textSecondary text-sm">Total offres soumises</p>
              <p class="text-2xl font-bold text-primary" id="stat-total">-</p>
            </div>
            <div
              class="bg-surface rounded-xl shadow-sm border border-border p-6"
            >
              <p class="text-textSecondary text-sm">Appels en cours</p>
              <p class="text-2xl font-bold text-success" id="stat-open">-</p>
            </div>
            <div
              class="bg-surface rounded-xl shadow-sm border border-border p-6"
            >
              <p class="text-textSecondary text-sm">Marchés attribués</p>
              <p class="text-2xl font-bold text-accent" id="stat-awarded">-</p>
            </div>
          </div>

          <div
            class="bg-surface rounded-xl shadow-sm border border-border overflow-hidden"
          >
            <div class="overflow-x-auto">
              <table class="w-full">
                <thead class="bg-gray-50 border-b border-border">
                  <tr>
                    <th
                      class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase"
                    >
                      Appel d'offres
                    </th>
                    <th
                      class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase"
                    >
                      Montant proposé
                    </th>
                    <th
                      class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase"
                    >
                      Date
                    </th>
                    <th
                      class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase"
                    >
                      Statut
                    </th>
                  </tr>
                </thead>
                <tbody id="offers-body" class="divide-y divide-border">
                  <tr>
                    <td
                      colspan="4"
                      class="px-6 py-12 text-center text-textSecondary"
                    >
                      Chargement...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script>
      requireAuth(["SUPPLIER"]);
    </script>
    <script src="../../js/router.js"></script>
    <script src="../../js/components/sidebar.js"></script>
    <script src="../../js/components/header.js"></script>
    <script src="../../js/components/badge.js"></script>
    <script src="../../js/components/toast.js"></script>
    <script src="../../js/utils/format.js"></script>
    <script>
      initPage("SUPPLIER");
      const role = getCurrentRole();
      if (role) {
        renderSidebar(role.toLowerCase());
      }
      renderHeader();

      function escapeHtml(str) {
        return String(str ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      // The supplier's bids are fetched directly from GET /tenders/my-bids
      // (all tenders, including closed/awarded ones). Bids only expose
      // {bidId, tenderId, supplierId, price, createdAt} with NO title/status,
      // so we resolve each unique tender via GET /tenders/{id} to obtain the
      // tender title and status (used for the derived "Statut" column).
      async function loadOffers() {
        const tbody = document.getElementById("offers-body");

        const res = await apiFetch("/tenders/my-bids");
        if (!res || !res.ok) {
          showToast(res?.data?.message || "Erreur de chargement", "error");
          tbody.innerHTML =
            '<tr><td colspan="4" class="px-6 py-12 text-center text-danger">Erreur de chargement des offres</td></tr>';
          return;
        }

        const bids = res.data?.bids || [];

        // Resolve tender details once per unique tenderId.
        const uniqueIds = [...new Set(bids.map((b) => b.tenderId).filter(Boolean))];
        const tendersById = {};
        await Promise.all(
          uniqueIds.map(async (id) => {
            const tr = await apiFetch("/tenders/" + id);
            if (tr && tr.ok && tr.data?.tender) {
              tendersById[id] = tr.data.tender;
            }
          }),
        );

        // Build enriched offer rows, newest first.
        const offers = bids
          .map((b) => {
            const t = tendersById[b.tenderId] || {};
            return {
              tenderId: b.tenderId,
              tenderTitle: t.title || (b.tenderId ? "#" + b.tenderId.slice(0, 8) : "—"),
              tenderStatus: t.status || null,
              price: b.price,
              createdAt: b.createdAt,
            };
          })
          .sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

        document.getElementById("stat-total").textContent = offers.length;
        document.getElementById("stat-open").textContent = offers.filter(
          (o) => o.tenderStatus === "OPEN",
        ).length;
        document.getElementById("stat-awarded").textContent = offers.filter(
          (o) => o.tenderStatus === "AWARDED",
        ).length;

        if (offers.length === 0) {
          tbody.innerHTML =
            '<tr><td colspan="4" class="px-6 py-12 text-center text-textSecondary">Aucune offre soumise</td></tr>';
          lucide.createIcons();
          return;
        }

        tbody.innerHTML = offers
          .map(
            (o) => `
              <tr class="hover:bg-gray-50 cursor-pointer" onclick="window.location.href='../supplier/marketplace-detail.html?id=${encodeURIComponent(o.tenderId)}'">
                <td class="px-6 py-4 font-medium text-sm text-textPrimary">${escapeHtml(o.tenderTitle)}</td>
                <td class="px-6 py-4 text-sm font-semibold text-textPrimary">${formatCurrency(o.price || 0)}</td>
                <td class="px-6 py-4 text-sm text-textSecondary">${o.createdAt ? formatDate(o.createdAt) : "—"}</td>
                <td class="px-6 py-4">${o.tenderStatus ? renderBadge(o.tenderStatus) : '<span class="text-textSecondary text-sm">—</span>'}</td>
              </tr>
            `,
          )
          .join("");
        lucide.createIcons();
      }

      loadOffers();
    </script>
  </body>
</html>
