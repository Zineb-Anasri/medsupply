<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panier - MedSupply Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#0A2647",
            secondary: "#144272",
            accent: "#2C74B3",
            success: "#16A34A",
            warning: "#D97706",
            danger: "#DC2626",
            background: "#F8FAFC",
            surface: "#FFFFFF",
            border: "#E2E8F0",
            textPrimary: "#0F172A",
            textSecondary: "#64748B",
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-background text-textPrimary">
  <!-- Navbar will be inserted here -->

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <h1 class="text-4xl font-bold mb-12">Mon Panier</h1>

    <div class="grid md:grid-cols-3 gap-8">
      <!-- Cart Items -->
      <div class="md:col-span-2">
        <div id="empty-cart" class="hidden text-center py-12 bg-white rounded-lg shadow-md">
          <i data-lucide="shopping-cart" class="w-16 h-16 text-textSecondary mx-auto mb-4"></i>
          <h3 class="text-xl font-bold mb-2">Panier Vide</h3>
          <p class="text-textSecondary mb-6">Vous n'avez pas encore ajouté de produits</p>
          <a href="/medsupply-cloud/pages/products.html" class="inline-block bg-accent text-white px-6 py-3 rounded-lg font-medium hover:bg-secondary transition">
            Continuer vos Achats
          </a>
        </div>

        <div id="cart-items" class="space-y-4">
          <!-- Cart items will be loaded here -->
        </div>
      </div>

      <!-- Summary -->
      <div class="md:col-span-1">
        <div class="bg-white rounded-lg shadow-md p-6 sticky top-24">
          <h3 class="text-xl font-bold mb-6">Résumé de la Commande</h3>

          <div class="space-y-4 mb-6 pb-6 border-b border-border">
            <div class="flex justify-between">
              <span class="text-textSecondary">Sous-total</span>
              <span id="subtotal" class="font-medium">0€</span>
            </div>
            <div class="flex justify-between">
              <span class="text-textSecondary">Réduction</span>
              <span id="discount-amount" class="font-medium text-success">-0€</span>
            </div>
            <div class="flex justify-between">
              <span class="text-textSecondary">Livraison</span>
              <span id="shipping" class="font-medium">Gratuite</span>
            </div>
            <div class="flex justify-between">
              <span class="text-textSecondary">TVA</span>
              <span id="tax" class="font-medium">0€</span>
            </div>
          </div>

          <div class="flex justify-between items-center mb-6">
            <span class="text-lg font-bold">Total</span>
            <span id="total" class="text-3xl font-bold text-primary">0€</span>
          </div>

          <a href="/medsupply-cloud/pages/checkout.html" class="block w-full bg-accent hover:bg-secondary text-white py-3 rounded-lg font-bold text-center mb-4 transition-colors">
            Procéder au Paiement
          </a>

          <a href="/medsupply-cloud/pages/products.html" class="block w-full border-2 border-accent text-accent hover:bg-background py-3 rounded-lg font-bold text-center transition-colors">
            Continuer mes Achats
          </a>

          <!-- Promo Code -->
          <div class="mt-8 pt-8 border-t border-border">
            <label class="text-sm font-medium text-textSecondary block mb-2">Code Promo</label>
            <div class="flex gap-2">
              <input type="text" id="promo-code" placeholder="Entrez un code" class="flex-1 border border-border rounded-lg px-3 py-2 text-sm">
              <button onclick="applyPromo()" class="bg-background hover:bg-border text-textPrimary px-4 py-2 rounded-lg font-medium transition-colors">
                Appliquer
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/mock-data.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/components/navbar.js"></script>
  <script>
    function loadCart() {
      const cart = getCart();
      const container = document.getElementById("cart-items");
      const emptyCart = document.getElementById("empty-cart");

      if (cart.length === 0) {
        container.innerHTML = "";
        emptyCart.classList.remove("hidden");
        updateSummary();
        return;
      }

      emptyCart.classList.add("hidden");
      container.innerHTML = cart.map((item, index) => {
        const finalPrice = item.price * (1 - (item.discount || 0) / 100);
        const itemTotal = finalPrice * item.quantity;

        return `
          <div class="bg-white rounded-lg shadow-md p-6 flex gap-6">
            <img src="${item.image}" alt="${item.name}" class="w-32 h-32 object-cover rounded-lg">
            
            <div class="flex-1">
              <h3 class="text-lg font-bold mb-2">${item.name}</h3>
              <div class="flex items-center gap-4 mb-4">
                <span class="text-2xl font-bold text-primary">${finalPrice.toFixed(2)}€</span>
                ${item.discount ? `<span class="text-sm text-danger">-${item.discount}%</span>` : ''}
              </div>

              <div class="flex items-center gap-4">
                <div class="flex items-center border border-border rounded-lg">
                  <button onclick="updateQuantity(${item.id}, ${item.quantity - 1})" class="px-3 py-2 text-textSecondary hover:text-primary">
                    <i data-lucide="minus" class="w-4 h-4"></i>
                  </button>
                  <span class="px-4 py-2 font-medium">${item.quantity}</span>
                  <button onclick="updateQuantity(${item.id}, ${item.quantity + 1})" class="px-3 py-2 text-textSecondary hover:text-primary">
                    <i data-lucide="plus" class="w-4 h-4"></i>
                  </button>
                </div>

                <button onclick="removeItem(${item.id})" class="ml-auto text-danger hover:text-danger font-medium flex items-center gap-2">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                  Supprimer
                </button>
              </div>
            </div>

            <div class="text-right">
              <p class="text-sm text-textSecondary mb-2">Total:</p>
              <p class="text-2xl font-bold text-primary">${itemTotal.toFixed(2)}€</p>
            </div>
          </div>
        `;
      }).join("");

      lucide.createIcons();
      updateSummary();
    }

    function updateQuantity(productId, newQuantity) {
      if (newQuantity <= 0) {
        removeItem(productId);
      } else {
        const product = getProductById(productId);
        if (newQuantity > product.stock) {
          showToast("Stock insuffisant", "warning");
          return;
        }
        updateCartQuantity(productId, newQuantity);
        loadCart();
      }
    }

    function removeItem(productId) {
      removeFromCart(productId);
      showToast("Produit supprimé du panier", "info");
      loadCart();
    }

    function updateSummary() {
      const cart = getCart();
      let subtotal = 0;
      let totalDiscount = 0;

      cart.forEach(item => {
        const product = getProductById(item.id);
        const finalPrice = item.price * (1 - (item.discount || 0) / 100);
        subtotal += item.price * item.quantity;
        totalDiscount += (item.price - finalPrice) * item.quantity;
      });

      const tax = subtotal * 0.20;
      const total = subtotal - totalDiscount + tax;

      document.getElementById("subtotal").textContent = `${subtotal.toFixed(2)}€`;
      document.getElementById("discount-amount").textContent = `-${totalDiscount.toFixed(2)}€`;
      document.getElementById("tax").textContent = `${tax.toFixed(2)}€`;
      document.getElementById("total").textContent = `${total.toFixed(2)}€`;
    }

    function applyPromo() {
      const code = document.getElementById("promo-code").value.trim().toUpperCase();
      if (code === "BIENVENUE10") {
        showToast("Code promo appliqué: -10%", "success");
      } else if (code) {
        showToast("Code promo invalide", "error");
      } else {
        showToast("Veuillez entrer un code promo", "warning");
      }
    }

    document.addEventListener("DOMContentLoaded", loadCart);
  </script>
</body>
</html>
