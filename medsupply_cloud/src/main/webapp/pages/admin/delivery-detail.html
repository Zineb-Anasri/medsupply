<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Détail Livraison - MedSupply Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#0A2647",
            secondary: "#144272",
            accent: "#2C74B3",
            success: "#16A34A",
            warning: "#D97706",
            danger: "#DC2626",
            background: "#F8FAFC",
            surface: "#FFFFFF",
            border: "#E2E8F0",
            textPrimary: "#0F172A",
            textSecondary: "#64748B",
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    #map { height: 600px; width: 100%; border-radius: 0.5rem; }
    .pulse-marker {
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.7; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body class="bg-background">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-72 bg-white border-r border-gray-200 flex-shrink-0"></aside>
    
    <!-- Main Content -->
    <div class="flex-1 flex flex-col ml-72">
      <!-- Header -->
      <header id="header"></header>
      
      <!-- Content -->
      <main id="main-content" class="flex-1 p-6 overflow-y-auto">
        <!-- Breadcrumb -->
        <nav class="flex items-center gap-2 text-sm mb-6">
          <a href="deliveries.html" class="text-textSecondary hover:text-accent">Livraisons</a>
          <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i>
          <span class="text-textPrimary font-medium" id="breadcrumb-ref">Chargement...</span>
        </nav>

        <!-- Two-Panel Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">
          <!-- Left Panel (40%) -->
          <div class="lg:col-span-2 space-y-6">
            <!-- Delivery Info Card -->
            <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
              <h3 class="font-semibold text-textPrimary mb-4">Informations Livraison</h3>
              <div class="space-y-3">
                <div class="flex justify-between">
                  <span class="text-textSecondary">N° Livraison</span>
                  <span class="font-mono text-textPrimary font-medium" id="delivery-ref">--</span>
                </div>
                <div class="flex justify-between">
                  <span class="text-textSecondary">N° Commande</span>
                  <span class="font-mono text-textPrimary" id="order-ref">--</span>
                </div>
                <div class="flex justify-between">
                  <span class="text-textSecondary">Client</span>
                  <span class="text-textPrimary font-medium" id="client-name">--</span>
                </div>
                <div class="flex justify-between">
                  <span class="text-textSecondary">Livreur</span>
                  <span class="text-textPrimary" id="driver-name">--</span>
                </div>
                <div class="flex justify-between">
                  <span class="text-textSecondary">Statut</span>
                  <span id="delivery-status" class="inline-flex items-center px-2 py-1 rounded-md text-xs font-medium">--</span>
                </div>
              </div>
            </div>

            <!-- Status Stepper -->
            <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
              <h3 class="font-semibold text-textPrimary mb-4">Statut Livraison</h3>
              <div class="space-y-4" id="status-stepper">
                <!-- Status steps will be loaded dynamically -->
              </div>
              <button onclick="advanceStatus()" id="btn-advance" class="w-full mt-4 bg-accent hover:bg-secondary text-white font-medium py-2 rounded-lg transition-colors">
                Avancer le statut
              </button>
            </div>

            <!-- Position Update Form -->
            <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
              <h3 class="font-semibold text-textPrimary mb-4">Mettre à jour la position</h3>
              <div class="space-y-4">
                <div>
                  <label class="block text-sm font-medium text-textPrimary mb-2">Latitude</label>
                  <input type="number" id="latitude" step="any"
                    class="w-full px-4 py-3 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all"
                    placeholder="33.5731">
                </div>
                <div>
                  <label class="block text-sm font-medium text-textPrimary mb-2">Longitude</label>
                  <input type="number" id="longitude" step="any"
                    class="w-full px-4 py-3 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all"
                    placeholder="-7.5898">
                </div>
                <button onclick="getCurrentPosition()" class="w-full bg-gray-200 hover:bg-gray-300 text-textPrimary font-medium py-2 rounded-lg transition-colors flex items-center justify-center gap-2">
                  <i data-lucide="crosshair" class="w-4 h-4"></i>
                  <span>Utiliser position actuelle</span>
                </button>
                <div>
                  <label class="block text-sm font-medium text-textPrimary mb-2">Notes</label>
                  <textarea id="position-notes" rows="2"
                    class="w-full px-4 py-3 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all resize-none"
                    placeholder="Ajoutez des notes sur la position..."></textarea>
                </div>
                <button onclick="updatePosition()" class="w-full bg-primary hover:bg-secondary text-white font-medium py-2 rounded-lg transition-colors">
                  Mettre à jour
                </button>
              </div>
            </div>

            <!-- History Timeline -->
            <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
              <h3 class="font-semibold text-textPrimary mb-4">Historique des positions</h3>
              <div class="space-y-4 max-h-64 overflow-y-auto" id="history-timeline">
                <!-- History will be loaded dynamically -->
              </div>
            </div>
          </div>

          <!-- Right Panel (60%) -->
          <div class="lg:col-span-3">
            <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
              <div class="flex items-center justify-between mb-4">
                <h3 class="font-semibold text-textPrimary">Carte GPS en temps réel</h3>
                <span class="text-sm text-textSecondary" id="last-updated">Dernière mise à jour: --</span>
              </div>
              <div id="map"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    requireAuth(["ADMIN"]);
    const currentUser = getCurrentUser();
  </script>
  <script src="../../js/router.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/header.js"></script>
  <script src="../../js/components/badge.js"></script>
  <script src="../../js/utils/format.js"></script>
  <script>
    initPage("ADMIN");

    const urlParams = new URLSearchParams(window.location.search);
    const deliveryId = urlParams.get('id');
    let map = null;
    let truckMarker = null;
    let clientMarker = null;
    let routeLine = null;

    const statusSteps = [
      { key: 'PREPARING', label: 'Préparation', icon: 'package' },
      { key: 'SHIPPED', label: 'Expédiée', icon: 'truck' },
      { key: 'IN_TRANSIT', label: 'En transit', icon: 'map-pin' },
      { key: 'DELIVERED', label: 'Livrée', icon: 'check-circle' }
    ];

    async function loadDelivery() {
      try {
        const response = await apiFetch(`/admin/deliveries/${deliveryId}`);
        const delivery = response.data;

        // Update breadcrumb
        document.getElementById('breadcrumb-ref').textContent = delivery.deliveryRef;

        // Update delivery info
        document.getElementById('delivery-ref').textContent = delivery.deliveryRef;
        document.getElementById('order-ref').textContent = delivery.orderRef;
        document.getElementById('client-name').textContent = delivery.clientName;
        document.getElementById('driver-name').textContent = delivery.driverName || '--';
        document.getElementById('delivery-status').textContent = getDeliveryStatusLabel(delivery.status);
        document.getElementById('delivery-status').className = `inline-flex items-center px-2 py-1 rounded-md text-xs font-medium ${getDeliveryStatusColor(delivery.status)}`;

        // Update position form
        if (delivery.currentPosition) {
          document.getElementById('latitude').value = delivery.currentPosition.lat;
          document.getElementById('longitude').value = delivery.currentPosition.lng;
        }

        // Update last updated
        if (delivery.lastUpdated) {
          const timeAgo = getTimeAgo(delivery.lastUpdated);
          document.getElementById('last-updated').textContent = `Dernière mise à jour: ${timeAgo}`;
        }

        // Update status stepper
        updateStatusStepper(delivery.status);

        // Update advance button
        updateAdvanceButton(delivery.status);

        // Update history timeline
        updateHistoryTimeline(delivery.positionHistory);

        // Initialize map
        initMap(delivery);

        lucide.createIcons();
      } catch (error) {
        console.error("Failed to load delivery:", error);
      }
    }

    function updateStatusStepper(currentStatus) {
      const container = document.getElementById('status-stepper');
      const currentIndex = statusSteps.findIndex(step => step.key === currentStatus);

      container.innerHTML = statusSteps.map((step, index) => {
        const isCompleted = index < currentIndex;
        const isCurrent = index === currentIndex;
        const isPending = index > currentIndex;

        return `
          <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded-full flex items-center justify-center ${isCompleted ? 'bg-success text-white' : isCurrent ? 'bg-accent text-white' : 'bg-gray-200 text-gray-500'}">
              <i data-lucide="${step.icon}" class="w-4 h-4"></i>
            </div>
            <div class="flex-1">
              <p class="text-sm font-medium ${isCompleted || isCurrent ? 'text-textPrimary' : 'text-textSecondary'}">${step.label}</p>
            </div>
          </div>
          ${index < statusSteps.length - 1 ? `<div class="ml-4 h-6 w-0.5 ${isCompleted ? 'bg-success' : 'bg-gray-200'}"></div>` : ''}
        `;
      }).join('');
    }

    function updateAdvanceButton(status) {
      const btn = document.getElementById('btn-advance');
      if (status === 'DELIVERED' || status === 'FAILED') {
        btn.classList.add('hidden');
      } else {
        btn.classList.remove('hidden');
      }
    }

    function updateHistoryTimeline(history) {
      const container = document.getElementById('history-timeline');
      
      if (!history || history.length === 0) {
        container.innerHTML = `<p class="text-textSecondary text-sm">Aucun historique disponible</p>`;
        return;
      }

      container.innerHTML = history.slice().reverse().map((entry, index) => `
        <div class="flex gap-3">
          <div class="flex flex-col items-center">
            <div class="w-3 h-3 rounded-full ${index === 0 ? 'bg-accent' : 'bg-gray-300'}"></div>
            ${index < history.length - 1 ? '<div class="w-0.5 h-8 bg-gray-200"></div>' : ''}
          </div>
          <div class="flex-1 pb-4">
            <p class="text-sm font-medium text-textPrimary">${entry.lat.toFixed(4)}, ${entry.lng.toFixed(4)}</p>
            <p class="text-xs text-textSecondary">${formatDateTime(entry.timestamp)}</p>
            ${entry.notes ? `<p class="text-xs text-textSecondary mt-1">${entry.notes}</p>` : ''}
          </div>
        </div>
      `).join('');
    }

    function initMap(delivery) {
      if (map) {
        return;
      }

      map = L.map('map').setView([33.5731, -7.5898], 10); // Casablanca default

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      // Truck marker with animated pulse
      if (delivery.currentPosition) {
        const truckIcon = L.divIcon({
          html: `<div class="bg-accent text-white w-10 h-10 rounded-full flex items-center justify-center pulse-marker shadow-lg">
            <i data-lucide="truck" class="w-5 h-5"></i>
          </div>`,
          className: 'custom-marker',
          iconSize: [40, 40],
          iconAnchor: [20, 20]
        });

        truckMarker = L.marker([delivery.currentPosition.lat, delivery.currentPosition.lng], { icon: truckIcon })
          .addTo(map)
          .bindPopup('Position actuelle du camion');

        // Client address marker
        if (delivery.clientAddress && delivery.clientAddress.lat && delivery.clientAddress.lng) {
          const clientIcon = L.divIcon({
            html: `<div class="bg-success text-white w-10 h-10 rounded-full flex items-center justify-center shadow-lg">
              <i data-lucide="map-pin" class="w-5 h-5"></i>
            </div>`,
            className: 'custom-marker',
            iconSize: [40, 40],
            iconAnchor: [20, 20]
          });

          clientMarker = L.marker([delivery.clientAddress.lat, delivery.clientAddress.lng], { icon: clientIcon })
            .addTo(map)
            .bindPopup('Destination');

          // Route line
          routeLine = L.polyline([
            [delivery.currentPosition.lat, delivery.currentPosition.lng],
            [delivery.clientAddress.lat, delivery.clientAddress.lng]
          ], {
            color: '#2C74B3',
            weight: 4,
            opacity: 0.7,
            dashArray: '10, 10'
          }).addTo(map);

          // Fit bounds to show both markers
          const bounds = L.latLngBounds([
            [delivery.currentPosition.lat, delivery.currentPosition.lng],
            [delivery.clientAddress.lat, delivery.clientAddress.lng]
          ]);
          map.fitBounds(bounds, { padding: [50, 50] });
        } else {
          map.setView([delivery.currentPosition.lat, delivery.currentPosition.lng], 12);
        }
      }

      lucide.createIcons();
    }

    function getCurrentPosition() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            document.getElementById('latitude').value = position.coords.latitude;
            document.getElementById('longitude').value = position.coords.longitude;
          },
          (error) => {
            alert('Impossible d\'obtenir votre position actuelle');
            console.error('Geolocation error:', error);
          }
        );
      } else {
        alert('La géolocalisation n\'est pas supportée par votre navigateur');
      }
    }

    async function updatePosition() {
      const latitude = document.getElementById('latitude').value;
      const longitude = document.getElementById('longitude').value;
      const notes = document.getElementById('position-notes').value;

      if (!latitude || !longitude) {
        alert('Veuillez entrer la latitude et la longitude');
        return;
      }

      try {
        await apiFetch(`/admin/deliveries/${deliveryId}/position`, {
          method: 'PATCH',
          body: JSON.stringify({
            latitude: parseFloat(latitude),
            longitude: parseFloat(longitude),
            notes
          })
        });
        alert('Position mise à jour avec succès');
        loadDelivery();
      } catch (error) {
        console.error("Failed to update position:", error);
        alert('Erreur lors de la mise à jour de la position');
      }
    }

    async function advanceStatus() {
      try {
        await apiFetch(`/admin/deliveries/${deliveryId}/advance`, { method: 'PATCH' });
        loadDelivery();
      } catch (error) {
        console.error("Failed to advance status:", error);
      }
    }

    function getDeliveryStatusLabel(status) {
      const labels = {
        PREPARING: "En préparation",
        SHIPPED: "Expédiée",
        IN_TRANSIT: "En transit",
        DELIVERED: "Livrée",
        FAILED: "Échouée"
      };
      return labels[status] || status;
    }

    function getDeliveryStatusColor(status) {
      const colors = {
        PREPARING: "bg-gray-100 text-gray-800",
        SHIPPED: "bg-blue-100 text-blue-800",
        IN_TRANSIT: "bg-amber-100 text-amber-800",
        DELIVERED: "bg-green-100 text-green-800",
        FAILED: "bg-red-100 text-red-800"
      };
      return colors[status] || 'bg-gray-100 text-gray-800';
    }

    function getTimeAgo(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      const diffMs = now - date;
      const diffMins = Math.floor(diffMs / 60000);
      const diffHours = Math.floor(diffMins / 60);
      const diffDays = Math.floor(diffHours / 24);

      if (diffMins < 1) return 'À l\'instant';
      if (diffMins < 60) return `Il y a ${diffMins} minutes`;
      if (diffHours < 24) return `Il y a ${diffHours} heures`;
      return `Il y a ${diffDays} jours`;
    }

    // Load delivery on page load
    if (deliveryId) {
      loadDelivery();
    } else {
      window.location.href = '/medsupply-cloud/pages/deliveries.html';
    }
  </script>
</body>
</html>
