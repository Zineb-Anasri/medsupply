<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace B2B - MedSupply Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#0A2647",
            secondary: "#144272",
            accent: "#2C74B3",
            success: "#16A34A",
            warning: "#D97706",
            danger: "#DC2626",
            background: "#F8FAFC",
            surface: "#FFFFFF",
            border: "#E2E8F0",
            textPrimary: "#0F172A",
            textSecondary: "#64748B",
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-background">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-72 bg-white border-r border-gray-200 flex-shrink-0"></aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col ml-72">
      <!-- Header -->
      <header id="header"></header>

      <!-- Content -->
      <main id="main-content" class="flex-1 p-6 overflow-y-auto">
        <!-- Page Header -->
        <div class="flex items-center justify-between mb-6">
          <div>
            <h1 class="text-2xl font-bold text-textPrimary">Marketplace B2B</h1>
            <p class="text-textSecondary">Aperçu des appels d'offres et des offres reçues</p>
          </div>
          <button onclick="loadMarketplace()" class="inline-flex items-center gap-2 px-4 py-2 bg-surface border border-border rounded-lg text-sm font-medium text-textSecondary hover:bg-gray-50 transition-colors">
            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
            Actualiser
          </button>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">Appels ouverts</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-open">—</p>
              </div>
              <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
                <i data-lucide="gavel" class="w-6 h-6 text-green-600"></i>
              </div>
            </div>
          </div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">Clôturés</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-closed">—</p>
              </div>
              <div class="w-12 h-12 bg-gray-100 rounded-lg flex items-center justify-center">
                <i data-lucide="lock" class="w-6 h-6 text-gray-600"></i>
              </div>
            </div>
          </div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">Attribués</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-awarded">—</p>
              </div>
              <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                <i data-lucide="check-circle" class="w-6 h-6 text-blue-600"></i>
              </div>
            </div>
          </div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">Offres reçues</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-offers">—</p>
              </div>
              <div class="w-12 h-12 bg-amber-100 rounded-lg flex items-center justify-center">
                <i data-lucide="file-text" class="w-6 h-6 text-amber-600"></i>
              </div>
            </div>
          </div>
        </div>

        <!-- Two Column Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <!-- Recent Tenders -->
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <h3 class="font-semibold text-textPrimary mb-4">Appels d'offres récents</h3>
            <div class="space-y-4" id="recent-tenders">
              <div class="text-center py-8 text-textSecondary">Chargement...</div>
            </div>
          </div>

          <!-- Recent Offers -->
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <h3 class="font-semibold text-textPrimary mb-4">Offres récentes</h3>
            <div class="space-y-4" id="recent-offers">
              <div class="text-center py-8 text-textSecondary">Chargement...</div>
            </div>
          </div>
        </div>

        <!-- All Tenders Table -->
        <div class="bg-surface rounded-xl shadow-sm border border-border p-6 mt-6">
          <h3 class="font-semibold text-textPrimary mb-4">Tous les appels d'offres</h3>
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-50 border-b border-border">
                <tr>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Titre</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Client</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Budget max</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Deadline</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Statut</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Offres</th>
                  <th class="px-6 py-3 text-right text-xs font-semibold text-textSecondary uppercase tracking-wider">Actions</th>
                </tr>
              </thead>
              <tbody id="tenders-table-body" class="divide-y divide-border">
                <tr>
                  <td colspan="7" class="px-6 py-12 text-center text-textSecondary">Chargement...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    requireAuth(["ADMIN"]);
    const currentUser = getCurrentUser();
  </script>
  <script src="../../js/router.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/header.js"></script>
  <script src="../../js/components/badge.js"></script>
  <script src="../../js/components/toast.js"></script>
  <script src="../../js/utils/format.js"></script>
  <script>
    initPage("ADMIN");
    const role = getCurrentRole();
    if (role) {
      renderSidebar(role.toLowerCase());
    }
    renderHeader();

    // ---- name resolution: clientId (== owning user's id) -> client profile ----
    let clientsByUser = {};

    function clientName(clientId) {
      if (!clientId) return "—";
      const c = clientsByUser[clientId];
      if (c && c.name) return c.name;
      return "#" + String(clientId).slice(0, 8);
    }

    function getDeadlineUrgency(deadline) {
      if (!deadline) return "text-textSecondary";
      const diffDays = Math.ceil((new Date(deadline) - new Date()) / (1000 * 60 * 60 * 24));
      if (diffDays < 1) return "text-red-600 font-medium";
      if (diffDays < 7) return "text-amber-600 font-medium";
      return "text-textSecondary";
    }

    function getCountdown(deadline) {
      if (!deadline) return "";
      const diffDays = Math.ceil((new Date(deadline) - new Date()) / (1000 * 60 * 60 * 24));
      if (diffDays < 0) return "Expiré";
      if (diffDays === 0) return "Ferme aujourd'hui";
      if (diffDays === 1) return "Ferme demain";
      return `Ferme dans ${diffDays} jours`;
    }

    function byCreatedAtDesc(a, b) {
      return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
    }

    async function loadMarketplace() {
      const recentTendersEl = document.getElementById("recent-tenders");
      const recentOffersEl = document.getElementById("recent-offers");
      const tbody = document.getElementById("tenders-table-body");

      recentTendersEl.innerHTML = `<div class="text-center py-8 text-textSecondary">Chargement...</div>`;
      recentOffersEl.innerHTML = `<div class="text-center py-8 text-textSecondary">Chargement...</div>`;
      tbody.innerHTML = `<tr><td colspan="7" class="px-6 py-12 text-center text-textSecondary">Chargement...</td></tr>`;

      try {
        // 1) all tenders (admin sees all) + client profiles for name resolution
        const [tendersRes, clientsRes] = await Promise.all([
          apiFetch("/tenders"),
          apiFetch("/clients")
        ]);

        if (!tendersRes || !tendersRes.ok) {
          showToast(tendersRes?.data?.message || "Erreur lors du chargement du marché", "error");
          recentTendersEl.innerHTML = `<p class="text-textSecondary text-sm text-center py-8">Erreur de chargement</p>`;
          recentOffersEl.innerHTML = `<p class="text-textSecondary text-sm text-center py-8">Erreur de chargement</p>`;
          tbody.innerHTML = `<tr><td colspan="7" class="px-6 py-12 text-center text-textSecondary">Erreur de chargement</td></tr>`;
          return;
        }

        const tenders = tendersRes.data.tenders || [];

        // Build name map (non-fatal if it fails)
        clientsByUser = {};
        if (clientsRes && clientsRes.ok) {
          (clientsRes.data.clients || []).forEach(c => { clientsByUser[c.userId] = c; });
        }

        // 2) bids per tender (for counts + offers panel). No server stats endpoint.
        const bidsByTender = {};
        const bidResults = await Promise.all(
          tenders.map(t => apiFetch(`/tenders/${t.tenderId}/bids`).catch(() => null))
        );
        tenders.forEach((t, i) => {
          const r = bidResults[i];
          bidsByTender[t.tenderId] = (r && r.ok) ? (r.data.bids || []) : [];
        });

        // ---- Stats (computed client-side) ----
        const openCount = tenders.filter(t => t.status === "OPEN").length;
        const closedCount = tenders.filter(t => t.status === "CLOSED").length;
        const awardedCount = tenders.filter(t => t.status === "AWARDED").length;
        const totalBids = tenders.reduce((sum, t) => sum + (bidsByTender[t.tenderId]?.length || 0), 0);

        document.getElementById("stat-open").textContent = openCount;
        document.getElementById("stat-closed").textContent = closedCount;
        document.getElementById("stat-awarded").textContent = awardedCount;
        document.getElementById("stat-offers").textContent = totalBids;

        // ---- Recent tenders panel ----
        const recentTenders = [...tenders].sort(byCreatedAtDesc).slice(0, 5);
        if (recentTenders.length === 0) {
          recentTendersEl.innerHTML = `<p class="text-textSecondary text-sm text-center py-8">Aucun appel d'offres</p>`;
        } else {
          recentTendersEl.innerHTML = recentTenders.map(t => `
            <div class="p-4 bg-gray-50 rounded-lg hover:bg-gray-100 transition-colors cursor-pointer" onclick="viewTender('${t.tenderId}')">
              <div class="flex items-center justify-between mb-2 gap-2">
                <p class="font-medium text-textPrimary truncate">${t.title || "Sans titre"}</p>
                ${renderBadge(t.status)}
              </div>
              <p class="text-sm text-textSecondary">${clientName(t.clientId)}</p>
              <div class="flex items-center flex-wrap gap-2 mt-2">
                <span class="text-xs text-textSecondary">Budget: ${formatCurrency(t.budgetMax || 0)}</span>
                <span class="text-xs text-textSecondary">•</span>
                <span class="text-xs ${getDeadlineUrgency(t.deadline)}">${getCountdown(t.deadline)}</span>
              </div>
            </div>
          `).join("");
        }

        // ---- Recent offers panel (flatten bids) ----
        const tenderTitleById = {};
        tenders.forEach(t => { tenderTitleById[t.tenderId] = t.title || "Sans titre"; });
        const allOffers = [];
        tenders.forEach(t => {
          (bidsByTender[t.tenderId] || []).forEach(b => {
            allOffers.push({
              supplierId: b.supplierId,
              price: b.price,
              tenderTitle: tenderTitleById[t.tenderId],
              createdAt: b.createdAt
            });
          });
        });
        allOffers.sort(byCreatedAtDesc);
        const recentOffers = allOffers.slice(0, 5);
        if (recentOffers.length === 0) {
          recentOffersEl.innerHTML = `<p class="text-textSecondary text-sm text-center py-8">Aucune offre reçue</p>`;
        } else {
          recentOffersEl.innerHTML = recentOffers.map(o => `
            <div class="p-4 bg-gray-50 rounded-lg">
              <div class="flex items-center justify-between mb-2 gap-2">
                <p class="font-medium text-textPrimary">Fournisseur #${String(o.supplierId || "").slice(0, 8)}</p>
                <span class="text-sm font-bold text-accent">${formatCurrency(o.price || 0)}</span>
              </div>
              <p class="text-sm text-textSecondary truncate">${o.tenderTitle}</p>
              <p class="text-xs text-textSecondary mt-1">${o.createdAt ? formatRelativeTime(o.createdAt) : ""}</p>
            </div>
          `).join("");
        }

        // ---- All tenders table ----
        if (tenders.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="px-6 py-12 text-center text-textSecondary">Aucun appel d'offres trouvé</td></tr>`;
        } else {
          const sorted = [...tenders].sort(byCreatedAtDesc);
          tbody.innerHTML = sorted.map(t => `
            <tr class="hover:bg-gray-50 cursor-pointer" onclick="viewTender('${t.tenderId}')">
              <td class="px-6 py-4 text-textPrimary font-medium">${t.title || "Sans titre"}</td>
              <td class="px-6 py-4 text-textSecondary">${clientName(t.clientId)}</td>
              <td class="px-6 py-4 text-textPrimary">${formatCurrency(t.budgetMax || 0)}</td>
              <td class="px-6 py-4 ${getDeadlineUrgency(t.deadline)}">${t.deadline ? formatDate(t.deadline) : "—"}</td>
              <td class="px-6 py-4">${renderBadge(t.status)}</td>
              <td class="px-6 py-4 text-textPrimary">${bidsByTender[t.tenderId]?.length || 0}</td>
              <td class="px-6 py-4 text-right">
                <button onclick="event.stopPropagation(); viewTender('${t.tenderId}')" class="p-2 hover:bg-gray-100 rounded transition-colors" title="Voir le détail">
                  <i data-lucide="eye" class="w-4 h-4 text-gray-600"></i>
                </button>
              </td>
            </tr>
          `).join("");
        }

        lucide.createIcons();
      } catch (error) {
        console.error("Failed to load marketplace:", error);
        showToast("Erreur lors du chargement du marché", "error");
        recentTendersEl.innerHTML = `<p class="text-textSecondary text-sm text-center py-8">Erreur de chargement</p>`;
        recentOffersEl.innerHTML = `<p class="text-textSecondary text-sm text-center py-8">Erreur de chargement</p>`;
        tbody.innerHTML = `<tr><td colspan="7" class="px-6 py-12 text-center text-textSecondary">Erreur de chargement</td></tr>`;
      }
    }

    // Admin is authorized for GET /tenders/{id}, /items, /bids and PUT /close, /award
    // on the shared detail page (close/award allow ADMIN).
    function viewTender(tenderId) {
      window.location.href = `../client/marketplace-detail.html?id=${encodeURIComponent(tenderId)}`;
    }

    loadMarketplace();
  </script>
</body>
</html>
