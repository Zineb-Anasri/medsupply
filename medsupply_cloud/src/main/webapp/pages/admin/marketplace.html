<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace B2B - MedSupply Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#0A2647",
            secondary: "#144272",
            accent: "#2C74B3",
            success: "#16A34A",
            warning: "#D97706",
            danger: "#DC2626",
            background: "#F8FAFC",
            surface: "#FFFFFF",
            border: "#E2E8F0",
            textPrimary: "#0F172A",
            textSecondary: "#64748B",
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-background">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-72 bg-white border-r border-gray-200 flex-shrink-0"></aside>
    
    <!-- Main Content -->
    <div class="flex-1 flex flex-col ml-72">
      <!-- Header -->
      <header id="header"></header>
      
      <!-- Content -->
      <main id="main-content" class="flex-1 p-6 overflow-y-auto">
        <!-- Page Header -->
        <div class="mb-6">
          <h1 class="text-2xl font-bold text-textPrimary">Marketplace B2B</h1>
          <p class="text-textSecondary">Aperçu des appels d'offres</p>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">Appels ouverts</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-open">0</p>
              </div>
              <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
                <i data-lucide="gavel" class="w-6 h-6 text-green-600"></i>
              </div>
            </div>
          </div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">En cours</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-active">0</p>
              </div>
              <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                <i data-lucide="clock" class="w-6 h-6 text-blue-600"></i>
              </div>
            </div>
          </div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">Attribués</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-awarded">0</p>
              </div>
              <div class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center">
                <i data-lucide="check-circle" class="w-6 h-6 text-purple-600"></i>
              </div>
            </div>
          </div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">Offres reçues</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-offers">0</p>
              </div>
              <div class="w-12 h-12 bg-amber-100 rounded-lg flex items-center justify-center">
                <i data-lucide="file-text" class="w-6 h-6 text-amber-600"></i>
              </div>
            </div>
          </div>
        </div>

        <!-- Two Column Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <!-- Recent Tenders -->
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <h3 class="font-semibold text-textPrimary mb-4">Appels d'offres récents</h3>
            <div class="space-y-4" id="recent-tenders">
              <div class="text-center py-8 text-textSecondary">Chargement...</div>
            </div>
          </div>

          <!-- Recent Offers -->
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <h3 class="font-semibold text-textPrimary mb-4">Offres récentes</h3>
            <div class="space-y-4" id="recent-offers">
              <div class="text-center py-8 text-textSecondary">Chargement...</div>
            </div>
          </div>
        </div>

        <!-- All Tenders Table -->
        <div class="bg-surface rounded-xl shadow-sm border border-border p-6 mt-6">
          <h3 class="font-semibold text-textPrimary mb-4">Tous les appels d'offres</h3>
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-50 border-b border-border">
                <tr>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Titre</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Client</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Budget max</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Deadline</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Statut</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Offres</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Actions</th>
                </tr>
              </thead>
              <tbody id="tenders-table-body" class="divide-y divide-border">
                <tr>
                  <td colspan="7" class="px-6 py-12 text-center text-textSecondary">Chargement...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    requireAuth(["ADMIN"]);
    const currentUser = getCurrentUser();
  </script>
  <script src="../../js/router.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/header.js"></script>
  <script src="../../js/components/badge.js"></script>
  <script src="../../js/components/toast.js"></script>
  <script src="../../js/components/skeleton.js"></script>
  <script src="../../js/utils/format.js"></script>
  <script>
    initPage("ADMIN");
    const role = getCurrentRole();
    if (role) {
      renderSidebar(role.toLowerCase());
    }
    renderHeader();

    async function loadMarketplace() {
      try {
        // Show skeletons while loading
        showSkeleton('recent-tenders', 'list', { items: 5 });
        showSkeleton('recent-offers', 'list', { items: 5 });
        showSkeleton('tenders-table-body', 'table', { rows: 5, columns: 7 });

        const response = await apiFetch('/admin/marketplace');
        const data = response?.data || {};

        // Update stats
        document.getElementById("stat-open").textContent = data.stats?.open || 0;
        document.getElementById("stat-active").textContent = data.stats?.active || 0;
        document.getElementById("stat-awarded").textContent = data.stats?.awarded || 0;
        document.getElementById("stat-offers").textContent = data.stats?.offers || 0;

        // Update recent tenders
        const recentTenders = document.getElementById('recent-tenders');
        const recentTendersData = data.recentTenders || [];
        if (recentTendersData.length === 0) {
          recentTenders.innerHTML = `<p class="text-textSecondary text-sm text-center py-8">Aucun appel d'offres récent</p>`;
        } else {
          recentTenders.innerHTML = recentTendersData.map(tender => `
            <div class="p-4 bg-gray-50 rounded-lg hover:bg-gray-100 transition-colors cursor-pointer" onclick="viewTender('${tender.tenderId}')">
              <div class="flex items-center justify-between mb-2">
                <p class="font-medium text-textPrimary">${tender.title}</p>
                ${renderStatusBadge(tender.status)}
              </div>
              <p class="text-sm text-textSecondary">${tender.clientName}</p>
              <div class="flex items-center gap-2 mt-2">
                <span class="text-xs text-textSecondary">Budget: ${formatCurrency(tender.maxBudget)}</span>
                <span class="text-xs text-textSecondary">•</span>
                <span class="text-xs ${getDeadlineUrgency(tender.deadline)}">${getCountdown(tender.deadline)}</span>
              </div>
            </div>
          `).join('');
        }

        // Update recent offers
        const recentOffers = document.getElementById('recent-offers');
        const recentOffersData = data.recentOffers || [];
        if (recentOffersData.length === 0) {
          recentOffers.innerHTML = `<p class="text-textSecondary text-sm text-center py-8">Aucune offre récente</p>`;
        } else {
          recentOffers.innerHTML = recentOffersData.map(offer => `
            <div class="p-4 bg-gray-50 rounded-lg">
              <div class="flex items-center justify-between mb-2">
                <p class="font-medium text-textPrimary">${offer.supplierName}</p>
                <span class="text-sm font-bold text-accent">${formatCurrency(offer.proposedPrice)}</span>
              </div>
              <p class="text-sm text-textSecondary">${offer.tenderTitle}</p>
              <p class="text-xs text-textSecondary mt-1">${formatDate(offer.submissionDate)}</p>
            </div>
          `).join('');
        }

        // Update tenders table
        const tbody = document.getElementById('tenders-table-body');
        if (data.tenders.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="px-6 py-12 text-center text-textSecondary">Aucun appel d'offres trouvé</td></tr>`;
        } else {
          tbody.innerHTML = data.tenders.map(tender => `
            <tr class="hover:bg-gray-50 cursor-pointer" onclick="viewTender('${tender.tenderId}')">
              <td class="px-6 py-4 text-textPrimary font-medium">${tender.title}</td>
              <td class="px-6 py-4 text-textSecondary">${tender.clientName}</td>
              <td class="px-6 py-4 text-textPrimary">${formatCurrency(tender.maxBudget)}</td>
              <td class="px-6 py-4 ${getDeadlineUrgency(tender.deadline)}">${formatDate(tender.deadline)}</td>
              <td class="px-6 py-4">
                ${renderStatusBadge(tender.status)}
              </td>
              <td class="px-6 py-4 text-textPrimary">${tender.offerCount}</td>
              <td class="px-6 py-4">
                <button onclick="viewTender('${tender.tenderId}')" class="p-2 hover:bg-gray-100 rounded transition-colors" title="Voir">
                  <i data-lucide="eye" class="w-4 h-4 text-gray-600"></i>
                </button>
              </td>
            </tr>
          `).join('');
        }

        lucide.createIcons();

        // Hide skeletons
        hideSkeleton('recent-tenders');
        hideSkeleton('recent-offers');
        hideSkeleton('tenders-table-body');
      } catch (error) {
        console.error("Failed to load marketplace:", error);
        showToast("Erreur lors du chargement du marché", "error");
      }
    }

    function renderStatusBadge(status) {
      const colors = {
        OPEN: "bg-green-100 text-green-800",
        CLOSED: "bg-gray-100 text-gray-800",
        AWARDED: "bg-blue-100 text-blue-800",
        CANCELLED: "bg-red-100 text-red-800"
      };
      const labels = {
        OPEN: "Ouvert",
        CLOSED: "Fermé",
        AWARDED: "Attribué",
        CANCELLED: "Annulé"
      };
      return `<span class="inline-flex items-center px-2 py-1 rounded-md text-xs font-medium ${colors[status] || 'bg-gray-100 text-gray-800'}">${labels[status] || status}</span>`;
    }

    function getDeadlineUrgency(deadline) {
      const now = new Date();
      const deadlineDate = new Date(deadline);
      const diffDays = Math.ceil((deadlineDate - now) / (1000 * 60 * 60 * 24));
      
      if (diffDays < 1) return 'text-red-600 font-medium';
      if (diffDays < 7) return 'text-amber-600 font-medium';
      return 'text-textSecondary';
    }

    function getCountdown(deadline) {
      const now = new Date();
      const deadlineDate = new Date(deadline);
      const diffDays = Math.ceil((deadlineDate - now) / (1000 * 60 * 60 * 24));
      
      if (diffDays < 0) return 'Expiré';
      if (diffDays === 0) return 'Ferme aujourd\'hui';
      if (diffDays === 1) return 'Ferme demain';
      return `Ferme dans ${diffDays} jours`;
    }

    function viewTender(tenderId) {
      // Admin doesn't have a detail page, but could redirect to client view
      alert('Détail de l\'appel d\'offres non disponible pour l\'admin');
    }

    // Load marketplace on page load
    loadMarketplace();
  </script>
</body>
</html>
