<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des Clients - MedSupply Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#0A2647",
            secondary: "#144272",
            accent: "#2C74B3",
            success: "#16A34A",
            warning: "#D97706",
            danger: "#DC2626",
            background: "#F8FAFC",
            surface: "#FFFFFF",
            border: "#E2E8F0",
            textPrimary: "#0F172A",
            textSecondary: "#64748B",
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-background">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-72 bg-white border-r border-gray-200 flex-shrink-0"></aside>
    
    <!-- Main Content -->
    <div class="flex-1 flex flex-col ml-72">
      <!-- Header -->
      <header id="header"></header>
      
      <!-- Content -->
      <main id="main-content" class="flex-1 p-6 overflow-y-auto">
        <!-- Page Header -->
        <div class="flex items-center justify-between mb-6">
          <div>
            <h1 class="text-2xl font-bold text-textPrimary">Gestion des Clients</h1>
            <p class="text-textSecondary">Gérez vos clients et leurs informations</p>
          </div>
          <button onclick="window.location.href='client-form.html'" class="bg-primary hover:bg-secondary text-white font-medium px-4 py-2 rounded-lg transition-colors flex items-center gap-2">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>Ajouter un client</span>
          </button>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">Total clients</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-total">0</p>
              </div>
              <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                <i data-lucide="users" class="w-6 h-6 text-blue-600"></i>
              </div>
            </div>
          </div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">Clients actifs</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-active">0</p>
              </div>
              <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
                <i data-lucide="check-circle" class="w-6 h-6 text-green-600"></i>
              </div>
            </div>
          </div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">En attente</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-pending">0</p>
              </div>
              <div class="w-12 h-12 bg-yellow-100 rounded-lg flex items-center justify-center">
                <i data-lucide="clock" class="w-6 h-6 text-yellow-600"></i>
              </div>
            </div>
          </div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">Créances en retard</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-overdue">0</p>
              </div>
              <div class="w-12 h-12 bg-red-100 rounded-lg flex items-center justify-center">
                <i data-lucide="alert-triangle" class="w-6 h-6 text-red-600"></i>
              </div>
            </div>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="bg-surface rounded-xl shadow-sm border border-border p-4 mb-6">
          <div class="flex flex-wrap items-center gap-4">
            <div class="flex-1 min-w-[200px]">
              <div class="relative">
                <i data-lucide="search" class="w-5 h-5 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                <input type="text" id="search-input" placeholder="Rechercher (nom, email, ICE)..."
                  class="w-full pl-10 pr-4 py-2 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all">
              </div>
            </div>
            <select id="type-filter" class="px-4 py-2 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all">
              <option value="">Tous les types</option>
              <option value="HOSPITAL">Hôpital</option>
              <option value="CLINIC">Clinique</option>
              <option value="DOCTOR">Médecin</option>
              <option value="MEDICAL_OFFICE">Cabinet Médical</option>
              <option value="LABORATORY">Laboratoire</option>
              <option value="RESELLER">Revendeur</option>
            </select>
            <select id="status-filter" class="px-4 py-2 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all">
              <option value="">Tous les statuts</option>
              <option value="ACTIVE">Actif</option>
              <option value="PENDING">En attente</option>
              <option value="SUSPENDED">Suspendu</option>
            </select>
            <div class="flex items-center gap-2">
              <input type="date" id="date-from" class="px-4 py-2 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all">
              <span class="text-textSecondary">à</span>
              <input type="date" id="date-to" class="px-4 py-2 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all">
            </div>
            <button onclick="applyFilters()" class="bg-accent hover:bg-secondary text-white font-medium px-4 py-2 rounded-lg transition-colors">
              Filtrer
            </button>
            <button onclick="resetFilters()" class="bg-gray-200 hover:bg-gray-300 text-textPrimary font-medium px-4 py-2 rounded-lg transition-colors">
              Réinitialiser
            </button>
            <button onclick="exportCSV()" class="bg-success hover:bg-green-700 text-white font-medium px-4 py-2 rounded-lg transition-colors flex items-center gap-2">
              <i data-lucide="download" class="w-4 h-4"></i>
              <span>CSV</span>
            </button>
          </div>
        </div>

        <!-- Data Table -->
        <div class="bg-surface rounded-xl shadow-sm border border-border overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-50 border-b border-border">
                <tr>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Organisation</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Contact</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Ville</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Crédit</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Statut</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Commandes</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Actions</th>
                </tr>
              </thead>
              <tbody id="clients-table-body" class="divide-y divide-border">
                <tr>
                  <td colspan="7" class="px-6 py-12 text-center text-textSecondary">Chargement...</td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Pagination -->
          <div class="px-6 py-4 border-t border-border flex items-center justify-between">
            <p class="text-sm text-textSecondary">
              Affichage de <span id="showing-from">0</span> à <span id="showing-to">0</span> sur <span id="total-records">0</span> clients
            </p>
            <div class="flex items-center gap-2">
              <button onclick="previousPage()" id="prev-btn" class="px-3 py-1 border border-border rounded hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                <i data-lucide="chevron-left" class="w-4 h-4"></i>
              </button>
              <span class="px-3 py-1 bg-primary text-white rounded" id="current-page">1</span>
              <button onclick="nextPage()" id="next-btn" class="px-3 py-1 border border-border rounded hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                <i data-lucide="chevron-right" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    requireAuth(["ADMIN"]);
    const currentUser = getCurrentUser();
  </script>
  <script src="../../js/router.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/header.js"></script>
  <script src="../../js/components/badge.js"></script>
  <script src="../../js/components/toast.js"></script>
  <script src="../../js/components/skeleton.js"></script>
  <script src="../../js/utils/format.js"></script>
  <script>
    initPage("ADMIN");
    const role = getCurrentRole();
    if (role) {
      renderSidebar(role.toLowerCase());
    }
    renderHeader();

    let currentPage = 1;
    const pageSize = 20;
    let totalRecords = 0;

    async function loadClients() {
      try {
        // Show skeleton while loading
        showSkeleton('clients-table-body', 'table', { rows: 5, columns: 7 });

        const search = document.getElementById('search-input').value;
        const type = document.getElementById('type-filter').value;
        const status = document.getElementById('status-filter').value;
        const dateFrom = document.getElementById('date-from').value;
        const dateTo = document.getElementById('date-to').value;

        const response = await apiFetch(`/admin/clients?type=${type}&status=${status}&search=${search}&dateFrom=${dateFrom}&dateTo=${dateTo}&page=${currentPage}&size=${pageSize}`);
        const data = response?.data || {};

        // Update stats
        document.getElementById("stat-total").textContent = data.stats?.total || 0;
        document.getElementById("stat-active").textContent = data.stats?.active || 0;
        document.getElementById("stat-pending").textContent = data.stats?.pending || 0;
        document.getElementById("stat-overdue").textContent = data.stats?.overdue || 0;

        // Update table
        const tbody = document.getElementById("clients-table-body");
        const clients = data.clients || [];
        if (clients.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="px-6 py-12 text-center text-textSecondary">Aucun client trouvé</td></tr>`;
        } else {
          tbody.innerHTML = clients.map(client => `
            <tr class="hover:bg-gray-50">
              <td class="px-6 py-4">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 bg-primary bg-opacity-10 rounded-lg flex items-center justify-center">
                    <span class="text-primary font-semibold">${client.organizationName.substring(0, 2).toUpperCase()}</span>
                  </div>
                  <div>
                    <p class="font-medium text-textPrimary">${client.organizationName}</p>
                    ${renderClientTypeBadge(client.clientType)}
                  </div>
                </div>
              </td>
              <td class="px-6 py-4">
                <p class="text-textPrimary">${client.contactName}</p>
                <p class="text-sm text-textSecondary">${client.phone}</p>
              </td>
              <td class="px-6 py-4 text-textPrimary">${client.city}</td>
              <td class="px-6 py-4">
                ${renderCreditBadge(client.clientType)}
              </td>
              <td class="px-6 py-4">
                ${renderStatusBadge(client.status)}
              </td>
              <td class="px-6 py-4 text-textPrimary">${client.orderCount || 0}</td>
              <td class="px-6 py-4">
                <div class="flex items-center gap-2">
                  <button onclick="viewClient('${client.clientId}')" class="p-2 hover:bg-gray-100 rounded transition-colors" title="Voir">
                    <i data-lucide="eye" class="w-4 h-4 text-gray-600"></i>
                  </button>
                  ${client.status === 'PENDING' ? `
                    <button onclick="activateClient('${client.clientId}')" class="p-2 hover:bg-green-100 rounded transition-colors" title="Activer">
                      <i data-lucide="check" class="w-4 h-4 text-green-600"></i>
                    </button>
                  ` : ''}
                  ${client.status === 'ACTIVE' ? `
                    <button onclick="suspendClient('${client.clientId}')" class="p-2 hover:bg-red-100 rounded transition-colors" title="Suspendre">
                      <i data-lucide="ban" class="w-4 h-4 text-red-600"></i>
                    </button>
                  ` : ''}
                </div>
              </td>
            </tr>
          `).join("");
        }

        // Update pagination
        totalRecords = data.total;
        document.getElementById("showing-from").textContent = (currentPage - 1) * pageSize + 1;
        document.getElementById("showing-to").textContent = Math.min(currentPage * pageSize, totalRecords);
        document.getElementById("total-records").textContent = totalRecords;
        document.getElementById("current-page").textContent = currentPage;

        document.getElementById("prev-btn").disabled = currentPage === 1;
        document.getElementById("next-btn").disabled = currentPage * pageSize >= totalRecords;

        lucide.createIcons();

        // Hide skeleton
        hideSkeleton('clients-table-body');
      } catch (error) {
        console.error("Failed to load clients:", error);
        showToast("Erreur lors du chargement des clients", "error");
      }
    }

    function renderClientTypeBadge(type) {
      const colors = {
        HOSPITAL: "bg-blue-100 text-blue-800",
        LABORATORY: "bg-purple-100 text-purple-800",
        CLINIC: "bg-teal-100 text-teal-800",
        DOCTOR: "bg-green-100 text-green-800",
        MEDICAL_OFFICE: "bg-orange-100 text-orange-800",
        RESELLER: "bg-slate-100 text-slate-800"
      };
      const labels = {
        HOSPITAL: "Hôpital",
        LABORATORY: "Laboratoire",
        CLINIC: "Clinique",
        DOCTOR: "Médecin",
        MEDICAL_OFFICE: "Cabinet",
        RESELLER: "Revendeur"
      };
      return `<span class="inline-flex items-center px-2 py-1 rounded-md text-xs font-medium ${colors[type] || 'bg-gray-100 text-gray-800'}">${labels[type] || type}</span>`;
    }

    function renderCreditBadge(type) {
      const hasCredit = type === 'HOSPITAL' || type === 'LABORATORY';
      if (hasCredit) {
        return `<span class="inline-flex items-center px-2 py-1 rounded-md text-xs font-medium bg-blue-100 text-blue-800">60 jours</span>`;
      }
      return `<span class="inline-flex items-center px-2 py-1 rounded-md text-xs font-medium bg-gray-100 text-gray-800">Immédiat</span>`;
    }

    function renderStatusBadge(status) {
      const colors = {
        ACTIVE: "bg-green-100 text-green-800",
        PENDING: "bg-yellow-100 text-yellow-800",
        SUSPENDED: "bg-red-100 text-red-800"
      };
      const labels = {
        ACTIVE: "Actif",
        PENDING: "En attente",
        SUSPENDED: "Suspendu"
      };
      return `<span class="inline-flex items-center px-2 py-1 rounded-md text-xs font-medium ${colors[status] || 'bg-gray-100 text-gray-800'}">${labels[status] || status}</span>`;
    }

    function applyFilters() {
      currentPage = 1;
      loadClients();
    }

    function resetFilters() {
      document.getElementById('search-input').value = '';
      document.getElementById('type-filter').value = '';
      document.getElementById('status-filter').value = '';
      document.getElementById('date-from').value = '';
      document.getElementById('date-to').value = '';
      currentPage = 1;
      loadClients();
    }

    function previousPage() {
      if (currentPage > 1) {
        currentPage--;
        loadClients();
      }
    }

    function nextPage() {
      if (currentPage * pageSize < totalRecords) {
        currentPage++;
        loadClients();
      }
    }

    function viewClient(clientId) {
      window.location.href = `client-detail.html?id=${clientId}`;
    }

    async function activateClient(clientId) {
      if (confirm("Êtes-vous sûr de vouloir activer ce client ?")) {
        try {
          await apiFetch(`/admin/clients/${clientId}/activate`, { method: "PUT" });
          loadClients();
        } catch (error) {
          console.error("Failed to activate client:", error);
        }
      }
    }

    async function suspendClient(clientId) {
      if (confirm("Êtes-vous sûr de vouloir suspendre ce client ?")) {
        try {
          await apiFetch(`/admin/clients/${clientId}/suspend`, { method: "PUT" });
          loadClients();
        } catch (error) {
          console.error("Failed to suspend client:", error);
        }
      }
    }

    function exportCSV() {
      // TODO: Implement CSV export
      alert("Export CSV - Fonctionnalité à venir");
    }

    // Load clients on page load
    loadClients();
  </script>
</body>
</html>
