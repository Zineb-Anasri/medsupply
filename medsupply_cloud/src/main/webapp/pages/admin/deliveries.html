<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des Livraisons - MedSupply Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#0A2647",
            secondary: "#144272",
            accent: "#2C74B3",
            success: "#16A34A",
            warning: "#D97706",
            danger: "#DC2626",
            background: "#F8FAFC",
            surface: "#FFFFFF",
            border: "#E2E8F0",
            textPrimary: "#0F172A",
            textSecondary: "#64748B",
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    #map { height: 600px; width: 100%; border-radius: 0.5rem; }
    .pulse-marker {
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.7; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body class="bg-background">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-72 bg-white border-r border-gray-200 flex-shrink-0"></aside>
    
    <!-- Main Content -->
    <div class="flex-1 flex flex-col ml-72">
      <!-- Header -->
      <header id="header"></header>
      
      <!-- Content -->
      <main id="main-content" class="flex-1 p-6 overflow-y-auto">
        <!-- Page Header -->
        <div class="flex items-center justify-between mb-6">
          <div>
            <h1 class="text-2xl font-bold text-textPrimary">Gestion des Livraisons</h1>
            <p class="text-textSecondary">Suivez les livraisons en temps réel</p>
          </div>
          <div class="flex items-center gap-2 bg-gray-100 rounded-lg p-1">
            <button onclick="setView('list')" id="btn-list-view" class="px-4 py-2 rounded-md text-sm font-medium transition-colors bg-white text-textPrimary shadow-sm">
              Liste
            </button>
            <button onclick="setView('map')" id="btn-map-view" class="px-4 py-2 rounded-md text-sm font-medium transition-colors text-textSecondary hover:text-textPrimary">
              Carte
            </button>
          </div>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">En préparation</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-preparing">0</p>
              </div>
              <div class="w-12 h-12 bg-gray-100 rounded-lg flex items-center justify-center">
                <i data-lucide="package" class="w-6 h-6 text-gray-600"></i>
              </div>
            </div>
          </div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">En transit</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-in-transit">0</p>
              </div>
              <div class="w-12 h-12 bg-amber-100 rounded-lg flex items-center justify-center">
                <i data-lucide="truck" class="w-6 h-6 text-amber-600"></i>
              </div>
            </div>
          </div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">Livrées aujourd'hui</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-delivered-today">0</p>
              </div>
              <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
                <i data-lucide="check-circle" class="w-6 h-6 text-green-600"></i>
              </div>
            </div>
          </div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">Échecs</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-failed">0</p>
              </div>
              <div class="w-12 h-12 bg-red-100 rounded-lg flex items-center justify-center">
                <i data-lucide="x-circle" class="w-6 h-6 text-red-600"></i>
              </div>
            </div>
          </div>
        </div>

        <!-- List View -->
        <div id="list-view" class="bg-surface rounded-xl shadow-sm border border-border overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-50 border-b border-border">
                <tr>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">N° Livraison</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">N° Commande</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Client</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Livreur</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Statut</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Dernière position</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">MAJ</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Actions</th>
                </tr>
              </thead>
              <tbody id="deliveries-table-body" class="divide-y divide-border">
                <tr>
                  <td colspan="8" class="px-6 py-12 text-center text-textSecondary">Chargement...</td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Pagination -->
          <div class="px-6 py-4 border-t border-border flex items-center justify-between">
            <p class="text-sm text-textSecondary">
              Affichage de <span id="showing-from">0</span> à <span id="showing-to">0</span> sur <span id="total-records">0</span> livraisons
            </p>
            <div class="flex items-center gap-2">
              <button onclick="previousPage()" id="prev-btn" class="px-3 py-1 border border-border rounded hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                <i data-lucide="chevron-left" class="w-4 h-4"></i>
              </button>
              <span class="px-3 py-1 bg-primary text-white rounded" id="current-page">1</span>
              <button onclick="nextPage()" id="next-btn" class="px-3 py-1 border border-border rounded hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                <i data-lucide="chevron-right" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- Map View -->
        <div id="map-view" class="hidden">
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div id="map"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    requireAuth(["ADMIN"]);
    const currentUser = getCurrentUser();
  </script>
  <script src="../../js/router.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/header.js"></script>
  <script src="../../js/components/badge.js"></script>
  <script src="../../js/components/toast.js"></script>
  <script src="../../js/components/skeleton.js"></script>
  <script src="../../js/utils/format.js"></script>
  <script>
    initPage("ADMIN");
    const role = getCurrentRole();
    if (role) {
      renderSidebar(role.toLowerCase());
    }
    renderHeader();

    let currentView = 'list';
    let currentPage = 1;
    const pageSize = 20;
    let totalRecords = 0;
    let map = null;
    let markers = [];

    async function loadDeliveries() {
      try {
        // Show skeleton while loading
        showSkeleton('deliveries-table-body', 'table', { rows: 5, columns: 8 });

        const response = await apiFetch(`/deliveries?page=${currentPage}&size=${pageSize}`);
        const data = response?.data || {};

        // Update stats
        document.getElementById("stat-preparing").textContent = data.stats?.preparing || 0;
        document.getElementById("stat-in-transit").textContent = data.stats?.inTransit || 0;
        document.getElementById("stat-delivered-today").textContent = data.stats?.deliveredToday || 0;
        document.getElementById("stat-failed").textContent = data.stats?.failed || 0;

        // Update table
        const tbody = document.getElementById("deliveries-table-body");
        const deliveries = data.deliveries || [];
        if (deliveries.length === 0) {
          tbody.innerHTML = `<tr><td colspan="8" class="px-6 py-12 text-center text-textSecondary">Aucune livraison trouvée</td></tr>`;
        } else {
          tbody.innerHTML = deliveries.map(delivery => `
            <tr class="hover:bg-gray-50 cursor-pointer" onclick="viewDelivery('${delivery.deliveryId}')">
              <td class="px-6 py-4">
                <span class="font-mono text-textPrimary font-medium">${delivery.deliveryRef}</span>
              </td>
              <td class="px-6 py-4 font-mono text-sm text-textSecondary">${delivery.orderRef}</td>
              <td class="px-6 py-4 text-textPrimary font-medium">${delivery.clientName}</td>
              <td class="px-6 py-4 text-textSecondary">${delivery.driverName || '--'}</td>
              <td class="px-6 py-4">
                ${renderDeliveryStatusBadge(delivery.status)}
              </td>
              <td class="px-6 py-4 text-textSecondary text-sm">
                ${delivery.currentPosition ? 
                  `${delivery.currentPosition.lat.toFixed(4)}, ${delivery.currentPosition.lng.toFixed(4)}` : 
                  '--'
                }
              </td>
              <td class="px-6 py-4 text-textSecondary text-sm">
                ${delivery.lastUpdated ? formatDateTime(delivery.lastUpdated) : '--'}
              </td>
              <td class="px-6 py-4">
                <div class="flex items-center gap-2" onclick="event.stopPropagation()">
                  <button onclick="updatePosition('${delivery.deliveryId}')" class="p-2 hover:bg-blue-100 rounded transition-colors" title="Mettre à jour position">
                    <i data-lucide="map-pin" class="w-4 h-4 text-blue-600"></i>
                  </button>
                  <button onclick="viewDelivery('${delivery.deliveryId}')" class="p-2 hover:bg-gray-100 rounded transition-colors" title="Voir détail">
                    <i data-lucide="eye" class="w-4 h-4 text-gray-600"></i>
                  </button>
                </div>
              </td>
            </tr>
          `).join("");
        }

        // Update pagination
        totalRecords = data.total;
        document.getElementById("showing-from").textContent = (currentPage - 1) * pageSize + 1;
        document.getElementById("showing-to").textContent = Math.min(currentPage * pageSize, totalRecords);
        document.getElementById("total-records").textContent = totalRecords;
        document.getElementById("current-page").textContent = currentPage;

        document.getElementById("prev-btn").disabled = currentPage === 1;
        document.getElementById("next-btn").disabled = currentPage * pageSize >= totalRecords;

        lucide.createIcons();

        // Hide skeleton
        hideSkeleton('deliveries-table-body');
      } catch (error) {
        console.error("Failed to load deliveries:", error);
        showToast("Erreur lors du chargement des livraisons", "error");
      }
    }

    function renderDeliveryStatusBadge(status) {
      const colors = {
        PREPARING: "bg-gray-100 text-gray-800",
        SHIPPED: "bg-blue-100 text-blue-800",
        IN_TRANSIT: "bg-amber-100 text-amber-800",
        DELIVERED: "bg-green-100 text-green-800",
        FAILED: "bg-red-100 text-red-800"
      };
      const labels = {
        PREPARING: "En préparation",
        SHIPPED: "Expédiée",
        IN_TRANSIT: "En transit",
        DELIVERED: "Livrée",
        FAILED: "Échouée"
      };
      return `<span class="inline-flex items-center px-2 py-1 rounded-md text-xs font-medium ${colors[status] || 'bg-gray-100 text-gray-800'}">${labels[status] || status}</span>`;
    }

    function setView(view) {
      currentView = view;
      
      const btnList = document.getElementById('btn-list-view');
      const btnMap = document.getElementById('btn-map-view');
      const listView = document.getElementById('list-view');
      const mapView = document.getElementById('map-view');

      if (view === 'list') {
        btnList.className = 'px-4 py-2 rounded-md text-sm font-medium transition-colors bg-white text-textPrimary shadow-sm';
        btnMap.className = 'px-4 py-2 rounded-md text-sm font-medium transition-colors text-textSecondary hover:text-textPrimary';
        listView.classList.remove('hidden');
        mapView.classList.add('hidden');
      } else {
        btnMap.className = 'px-4 py-2 rounded-md text-sm font-medium transition-colors bg-white text-textPrimary shadow-sm';
        btnList.className = 'px-4 py-2 rounded-md text-sm font-medium transition-colors text-textSecondary hover:text-textPrimary';
        mapView.classList.remove('hidden');
        listView.classList.add('hidden');
        initMap();
      }
    }

    async function initMap() {
      if (map) {
        return;
      }

      map = L.map('map').setView([33.5731, -7.5898], 10); // Casablanca

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      try {
        const response = await apiFetch('/admin/deliveries/all');
        const deliveries = response.data || [];

        // Clear existing markers
        markers.forEach(marker => map.removeLayer(marker));
        markers = [];

        deliveries.forEach(delivery => {
          if (delivery.currentPosition) {
            const color = getDeliveryStatusColor(delivery.status);
            const icon = L.divIcon({
              html: `<div class="w-8 h-8 rounded-full flex items-center justify-center pulse-marker" style="background-color: ${color}; color: white;">
                <i data-lucide="truck" class="w-4 h-4"></i>
              </div>`,
              className: 'custom-marker',
              iconSize: [32, 32],
              iconAnchor: [16, 16]
            });

            const marker = L.marker([delivery.currentPosition.lat, delivery.currentPosition.lng], { icon })
              .addTo(map)
              .bindPopup(`
                <div class="p-2">
                  <p class="font-bold">${delivery.deliveryRef}</p>
                  <p class="text-sm">${delivery.clientName}</p>
                  <p class="text-sm">${getDeliveryStatusLabel(delivery.status)}</p>
                  <button onclick="viewDelivery('${delivery.deliveryId}')" class="mt-2 bg-primary text-white text-xs px-2 py-1 rounded">Voir détail</button>
                </div>
              `);

            markers.push(marker);
          }
        });

        if (markers.length > 0) {
          const group = L.featureGroup(markers);
          map.fitBounds(group.getBounds().pad(0.1));
        }

        lucide.createIcons();
      } catch (error) {
        console.error("Failed to load deliveries for map:", error);
      }
    }

    function getDeliveryStatusColor(status) {
      const colors = {
        PREPARING: '#6B7280',
        SHIPPED: '#3B82F6',
        IN_TRANSIT: '#F59E0B',
        DELIVERED: '#16A34A',
        FAILED: '#DC2626'
      };
      return colors[status] || '#6B7280';
    }

    function getDeliveryStatusLabel(status) {
      const labels = {
        PREPARING: "En préparation",
        SHIPPED: "Expédiée",
        IN_TRANSIT: "En transit",
        DELIVERED: "Livrée",
        FAILED: "Échouée"
      };
      return labels[status] || status;
    }

    function previousPage() {
      if (currentPage > 1) {
        currentPage--;
        loadDeliveries();
      }
    }

    function nextPage() {
      if (currentPage * pageSize < totalRecords) {
        currentPage++;
        loadDeliveries();
      }
    }

    function viewDelivery(deliveryId) {
      window.location.href = `delivery-detail.html?id=${deliveryId}`;
    }

    function updatePosition(deliveryId) {
      window.location.href = `delivery-detail.html?id=${deliveryId}`;
    }

    // Load deliveries on page load
    loadDeliveries();
  </script>
</body>
</html>
