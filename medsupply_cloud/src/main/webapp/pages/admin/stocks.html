<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Référentiel Produits - MedSupply Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#0A2647",
            secondary: "#144272",
            accent: "#2C74B3",
            success: "#16A34A",
            warning: "#D97706",
            danger: "#DC2626",
            background: "#F8FAFC",
            surface: "#FFFFFF",
            border: "#E2E8F0",
            textPrimary: "#0F172A",
            textSecondary: "#64748B",
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-background">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-72 bg-white border-r border-gray-200 flex-shrink-0"></aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col ml-72">
      <!-- Header -->
      <header id="header"></header>

      <!-- Content -->
      <main id="main-content" class="flex-1 p-6 overflow-y-auto">
        <!-- Page Header -->
        <div class="flex items-center justify-between mb-6">
          <div>
            <h1 class="text-2xl font-bold text-textPrimary">Référentiel Produits</h1>
            <p class="text-textSecondary">Consultez le catalogue de référence des produits</p>
          </div>
          <button onclick="window.location.href='product-form.html'" class="bg-accent hover:bg-secondary text-white font-medium px-4 py-2 rounded-lg transition-colors flex items-center gap-2">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>Ajouter un produit</span>
          </button>
        </div>

        <!-- Stat Cards (computed client-side) -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-sm text-textSecondary">Total produits</p>
                <p id="stat-total" class="text-3xl font-bold text-textPrimary mt-1">—</p>
              </div>
              <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                <i data-lucide="package" class="w-6 h-6 text-blue-600"></i>
              </div>
            </div>
          </div>

          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-sm text-textSecondary">Produits actifs</p>
                <p id="stat-active" class="text-3xl font-bold text-success mt-1">—</p>
              </div>
              <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
                <i data-lucide="check-circle" class="w-6 h-6 text-success"></i>
              </div>
            </div>
          </div>

          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-sm text-textSecondary">Produits inactifs</p>
                <p id="stat-inactive" class="text-3xl font-bold text-textSecondary mt-1">—</p>
              </div>
              <div class="w-12 h-12 bg-gray-100 rounded-lg flex items-center justify-center">
                <i data-lucide="ban" class="w-6 h-6 text-gray-500"></i>
              </div>
            </div>
          </div>

          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-sm text-textSecondary">Prix moyen</p>
                <p id="stat-avg-price" class="text-2xl font-bold text-textPrimary mt-1">—</p>
              </div>
              <div class="w-12 h-12 bg-amber-100 rounded-lg flex items-center justify-center">
                <i data-lucide="tag" class="w-6 h-6 text-warning"></i>
              </div>
            </div>
          </div>
        </div>

        <!-- Filters (client-side) -->
        <div class="bg-surface rounded-xl shadow-sm border border-border p-4 mb-6">
          <div class="flex flex-wrap items-center gap-4">
            <div class="flex-1 min-w-[200px]">
              <div class="relative">
                <i data-lucide="search" class="w-5 h-5 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                <input type="text" id="search-input" placeholder="Rechercher par nom ou référence..." oninput="renderTable()"
                  class="w-full pl-10 pr-4 py-2 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all">
              </div>
            </div>
            <select id="status-filter" onchange="renderTable()" class="px-4 py-2 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all">
              <option value="">Tous les statuts</option>
              <option value="active">Actifs</option>
              <option value="inactive">Inactifs</option>
            </select>
            <button onclick="resetFilters()" class="bg-gray-200 hover:bg-gray-300 text-textPrimary font-medium px-4 py-2 rounded-lg transition-colors flex items-center gap-2">
              <i data-lucide="x" class="w-4 h-4"></i>
              <span>Réinitialiser</span>
            </button>
          </div>
        </div>

        <!-- Product Table -->
        <div class="bg-surface rounded-xl shadow-sm border border-border overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-50 border-b border-border">
                <tr>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Produit</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Fournisseur</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Prix unitaire</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Garantie</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Statut</th>
                  <th class="px-6 py-3 text-right text-xs font-semibold text-textSecondary uppercase tracking-wider">Actions</th>
                </tr>
              </thead>
              <tbody id="products-table-body" class="divide-y divide-border">
                <tr>
                  <td colspan="6" class="px-6 py-12 text-center text-textSecondary">Chargement...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Bootstrap scripts (contract order) -->
  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    requireAuth(["ADMIN"]);
  </script>
  <script src="../../js/router.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/header.js"></script>
  <script src="../../js/components/badge.js"></script>
  <script src="../../js/components/toast.js"></script>
  <script src="../../js/utils/format.js"></script>
  <script>
    initPage("ADMIN");
    const role = getCurrentRole();
    if (role) {
      renderSidebar(role.toLowerCase());
    }
    renderHeader();

    let allProducts = [];
    let suppliersByUser = {};

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function supplierName(supplierId) {
      if (!supplierId) return "—";
      const s = suppliersByUser[supplierId];
      if (s && s.companyName) return escapeHtml(s.companyName);
      return "#" + String(supplierId).slice(0, 8);
    }

    async function loadData() {
      const tbody = document.getElementById("products-table-body");
      tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-12 text-center text-textSecondary">Chargement...</td></tr>`;

      // Resolve supplier names once (admin-only listing).
      const sr = await apiFetch("/suppliers");
      if (sr && sr.ok && sr.data && Array.isArray(sr.data.suppliers)) {
        suppliersByUser = {};
        sr.data.suppliers.forEach(s => { if (s.userId) suppliersByUser[s.userId] = s; });
      }

      const r = await apiFetch("/products");
      if (!r || !r.ok) {
        showToast(r?.data?.message || "Erreur lors du chargement des produits", "error");
        tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-12 text-center text-textSecondary">Impossible de charger les produits</td></tr>`;
        return;
      }

      allProducts = Array.isArray(r.data.products) ? r.data.products : [];
      updateStats();
      renderTable();
    }

    function updateStats() {
      const total = allProducts.length;
      const active = allProducts.filter(p => p.isActive).length;
      const inactive = total - active;
      const prices = allProducts.map(p => Number(p.unitPrice)).filter(n => !isNaN(n));
      const avg = prices.length ? prices.reduce((a, b) => a + b, 0) / prices.length : 0;

      document.getElementById("stat-total").textContent = total;
      document.getElementById("stat-active").textContent = active;
      document.getElementById("stat-inactive").textContent = inactive;
      document.getElementById("stat-avg-price").textContent = prices.length ? formatCurrency(avg) : "—";
    }

    function getFiltered() {
      const search = document.getElementById("search-input").value.trim().toLowerCase();
      const status = document.getElementById("status-filter").value;

      return allProducts.filter(p => {
        if (status === "active" && !p.isActive) return false;
        if (status === "inactive" && p.isActive) return false;
        if (search) {
          const name = (p.name || "").toLowerCase();
          const ref = (p.reference || "").toLowerCase();
          if (!name.includes(search) && !ref.includes(search)) return false;
        }
        return true;
      });
    }

    function renderTable() {
      const tbody = document.getElementById("products-table-body");
      const rows = getFiltered();

      if (rows.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="px-6 py-12 text-center">
              <div class="flex flex-col items-center gap-2 text-textSecondary">
                <i data-lucide="package-x" class="w-10 h-10 text-gray-300"></i>
                <p>Aucun produit trouvé</p>
              </div>
            </td>
          </tr>`;
        lucide.createIcons();
        return;
      }

      tbody.innerHTML = rows.map(p => {
        const statusEnum = p.isActive ? "ACTIVE" : "INACTIVE";
        const warranty = (p.warrantyMonths != null && p.warrantyMonths !== "")
          ? `${escapeHtml(p.warrantyMonths)} mois` : "—";
        return `
          <tr class="hover:bg-gray-50">
            <td class="px-6 py-4">
              <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-gray-100 rounded-lg overflow-hidden flex-shrink-0">
                  ${p.imageUrl
                    ? `<img src="${escapeHtml(p.imageUrl)}" alt="${escapeHtml(p.name)}" class="w-full h-full object-cover">`
                    : `<div class="w-full h-full flex items-center justify-center bg-primary bg-opacity-10">
                         <i data-lucide="package" class="w-6 h-6 text-primary"></i>
                       </div>`}
                </div>
                <div>
                  <p class="font-medium text-textPrimary">${escapeHtml(p.name) || "#" + String(p.id).slice(0, 8)}</p>
                  <p class="text-sm text-textSecondary font-mono">${escapeHtml(p.reference) || "—"}</p>
                </div>
              </div>
            </td>
            <td class="px-6 py-4 text-sm text-textPrimary">${supplierName(p.supplierId)}</td>
            <td class="px-6 py-4 text-textPrimary font-medium">${formatCurrency(Number(p.unitPrice) || 0)}</td>
            <td class="px-6 py-4 text-sm text-textSecondary">${warranty}</td>
            <td class="px-6 py-4">${renderBadge(statusEnum)}</td>
            <td class="px-6 py-4">
              <div class="flex items-center justify-end gap-2">
                <a href="product-form.html?id=${encodeURIComponent(p.id)}" class="p-2 hover:bg-blue-100 rounded transition-colors" title="Modifier">
                  <i data-lucide="edit" class="w-4 h-4 text-blue-600"></i>
                </a>
              </div>
            </td>
          </tr>`;
      }).join("");

      lucide.createIcons();
    }

    function resetFilters() {
      document.getElementById("search-input").value = "";
      document.getElementById("status-filter").value = "";
      renderTable();
    }

    loadData();
  </script>
</body>
</html>
