<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produit - MedSupply Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#0A2647",
            secondary: "#144272",
            accent: "#2C74B3",
            success: "#16A34A",
            warning: "#D97706",
            danger: "#DC2626",
            background: "#F8FAFC",
            surface: "#FFFFFF",
            border: "#E2E8F0",
            textPrimary: "#0F172A",
            textSecondary: "#64748B",
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-background">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-72 bg-white border-r border-gray-200 flex-shrink-0"></aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col ml-72">
      <!-- Header -->
      <header id="header"></header>

      <!-- Content -->
      <main id="main-content" class="flex-1 p-6 overflow-y-auto">
        <!-- Page Header -->
        <div class="flex items-center justify-between mb-6">
          <div>
            <h1 class="text-2xl font-bold text-textPrimary" id="page-title">Ajouter un produit</h1>
            <p class="text-textSecondary">Remplissez les informations du produit</p>
          </div>
          <button type="button" onclick="window.location.href='products.html'" class="bg-gray-200 hover:bg-gray-300 text-textPrimary font-medium px-4 py-2 rounded-lg transition-colors">
            Annuler
          </button>
        </div>

        <!-- Loading state -->
        <div id="loading-state" class="hidden bg-surface rounded-xl shadow-sm border border-border p-10 text-center text-textSecondary">
          Chargement...
        </div>

        <!-- Form -->
        <form id="product-form" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <!-- Left Column -->
          <div class="space-y-6">
            <!-- Reference -->
            <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
              <label for="reference" class="block text-sm font-medium text-textPrimary mb-2">Référence *</label>
              <div class="relative">
                <input type="text" id="reference" name="reference" required
                  class="w-full px-4 py-3 pr-20 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all font-mono"
                  placeholder="PROD-XXXX">
                <button type="button" onclick="generateReference()" class="absolute right-3 top-1/2 -translate-y-1/2 text-accent hover:text-secondary text-sm font-medium">
                  Générer
                </button>
              </div>
            </div>

            <!-- Name -->
            <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
              <label for="name" class="block text-sm font-medium text-textPrimary mb-2">Nom du produit *</label>
              <input type="text" id="name" name="name" required
                class="w-full px-4 py-3 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all"
                placeholder="Ex: Échographie portable">
            </div>

            <!-- Description -->
            <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
              <label for="description" class="block text-sm font-medium text-textPrimary mb-2">Description</label>
              <textarea id="description" name="description" rows="5"
                class="w-full px-4 py-3 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all resize-none"
                placeholder="Décrivez le produit..."></textarea>
            </div>

            <!-- Image URL -->
            <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
              <label for="imageUrl" class="block text-sm font-medium text-textPrimary mb-2">URL de l'image</label>
              <input type="url" id="imageUrl" name="imageUrl"
                class="w-full px-4 py-3 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all"
                placeholder="https://exemple.com/image.png"
                oninput="updateImagePreview()">
              <div id="image-preview-wrapper" class="mt-4 hidden">
                <img id="image-preview" src="" alt="Aperçu du produit" class="w-full h-48 object-cover rounded-lg border border-border" onerror="onImageError()">
              </div>
            </div>
          </div>

          <!-- Right Column -->
          <div class="space-y-6">
            <!-- Unit Price -->
            <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
              <label for="unitPrice" class="block text-sm font-medium text-textPrimary mb-2">Prix unitaire (MAD) *</label>
              <div class="relative">
                <input type="number" id="unitPrice" name="unitPrice" required min="0" step="0.01"
                  class="w-full px-4 py-3 pr-14 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all"
                  placeholder="0.00">
                <span class="absolute right-3 top-1/2 -translate-y-1/2 text-textSecondary text-sm">MAD</span>
              </div>
            </div>

            <!-- Warranty -->
            <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
              <label for="warrantyMonths" class="block text-sm font-medium text-textPrimary mb-2">Garantie (mois)</label>
              <div class="relative">
                <input type="number" id="warrantyMonths" name="warrantyMonths" min="0"
                  class="w-full px-4 py-3 pr-16 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all"
                  placeholder="12">
                <span class="absolute right-3 top-1/2 -translate-y-1/2 text-textSecondary text-sm">mois</span>
              </div>
            </div>

            <!-- Optional classification (UUIDs) -->
            <div class="bg-surface rounded-xl shadow-sm border border-border p-6 space-y-4">
              <div class="flex items-start gap-2 text-textSecondary text-sm mb-2">
                <i data-lucide="info" class="w-4 h-4 mt-0.5 flex-shrink-0"></i>
                <span>Champs optionnels. Renseignez les identifiants (UUID) de catégorie, marque ou fournisseur si disponibles.</span>
              </div>
              <div>
                <label for="categoryId" class="block text-sm font-medium text-textPrimary mb-2">ID Catégorie</label>
                <input type="text" id="categoryId" name="categoryId"
                  class="w-full px-4 py-3 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all font-mono text-sm"
                  placeholder="UUID de la catégorie (optionnel)">
              </div>
              <div>
                <label for="brandId" class="block text-sm font-medium text-textPrimary mb-2">ID Marque</label>
                <input type="text" id="brandId" name="brandId"
                  class="w-full px-4 py-3 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all font-mono text-sm"
                  placeholder="UUID de la marque (optionnel)">
              </div>
              <div>
                <label for="supplierId" class="block text-sm font-medium text-textPrimary mb-2">ID Fournisseur</label>
                <input type="text" id="supplierId" name="supplierId"
                  class="w-full px-4 py-3 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all font-mono text-sm"
                  placeholder="UUID du fournisseur (optionnel)">
              </div>
            </div>
          </div>
        </form>

        <!-- Submit Buttons -->
        <div class="flex items-center justify-end gap-4 mt-6">
          <button type="button" onclick="window.location.href='products.html'" class="bg-gray-200 hover:bg-gray-300 text-textPrimary font-medium px-6 py-3 rounded-lg transition-colors">
            Annuler
          </button>
          <button type="button" id="save-btn" onclick="saveProduct()" class="bg-accent hover:bg-secondary text-white font-medium px-6 py-3 rounded-lg transition-colors">
            Enregistrer
          </button>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    requireAuth(["ADMIN"]);
    const currentUser = getCurrentUser();
  </script>
  <script src="../../js/router.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/header.js"></script>
  <script src="../../js/components/badge.js"></script>
  <script src="../../js/components/toast.js"></script>
  <script src="../../js/utils/format.js"></script>
  <script>
    initPage("ADMIN");
    const role = getCurrentRole();
    if (role) {
      renderSidebar(role.toLowerCase());
    }
    renderHeader();

    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');

    if (productId) {
      document.getElementById('page-title').textContent = 'Modifier le produit';
      document.querySelector('#page-title + p').textContent = 'Modifiez les informations du produit';
      loadProduct();
    }

    lucide.createIcons();

    async function loadProduct() {
      const form = document.getElementById('product-form');
      const loading = document.getElementById('loading-state');
      form.classList.add('hidden');
      loading.classList.remove('hidden');

      const r = await apiFetch('/products/' + productId);
      if (!r || !r.ok) {
        loading.classList.add('hidden');
        form.classList.remove('hidden');
        showToast(r?.data?.message || "Erreur lors du chargement du produit", "error");
        return;
      }

      const product = r.data.product;
      if (!product) {
        loading.classList.add('hidden');
        form.classList.remove('hidden');
        showToast("Produit introuvable", "error");
        return;
      }

      document.getElementById('reference').value = product.reference || '';
      document.getElementById('name').value = product.name || '';
      document.getElementById('description').value = product.description || '';
      document.getElementById('unitPrice').value = product.unitPrice != null ? product.unitPrice : '';
      document.getElementById('warrantyMonths').value = product.warrantyMonths != null ? product.warrantyMonths : '';
      document.getElementById('imageUrl').value = product.imageUrl || '';
      document.getElementById('categoryId').value = product.categoryId || '';
      document.getElementById('brandId').value = product.brandId || '';
      document.getElementById('supplierId').value = product.supplierId || '';

      updateImagePreview();

      loading.classList.add('hidden');
      form.classList.remove('hidden');
      lucide.createIcons();
    }

    function generateReference() {
      const random = Math.random().toString(36).substring(2, 6).toUpperCase();
      document.getElementById('reference').value = 'PROD-' + random;
    }

    function updateImagePreview() {
      const url = document.getElementById('imageUrl').value.trim();
      const wrapper = document.getElementById('image-preview-wrapper');
      const img = document.getElementById('image-preview');
      if (url) {
        img.src = url;
        wrapper.classList.remove('hidden');
      } else {
        img.src = '';
        wrapper.classList.add('hidden');
      }
    }

    function onImageError() {
      document.getElementById('image-preview-wrapper').classList.add('hidden');
    }

    async function saveProduct() {
      const name = document.getElementById('name').value.trim();
      const reference = document.getElementById('reference').value.trim();
      const unitPriceRaw = document.getElementById('unitPrice').value;
      const unitPrice = parseFloat(unitPriceRaw);

      // Client-side validation (API returns 500 on bad input)
      if (!name) {
        showToast("Le nom du produit est requis", "warning");
        return;
      }
      if (!reference) {
        showToast("La référence est requise", "warning");
        return;
      }
      if (isNaN(unitPrice) || unitPrice <= 0) {
        showToast("Le prix unitaire doit être supérieur à 0", "warning");
        return;
      }

      const description = document.getElementById('description').value.trim();
      const warrantyMonths = parseInt(document.getElementById('warrantyMonths').value, 10) || 0;
      const imageUrl = document.getElementById('imageUrl').value.trim();
      const categoryId = document.getElementById('categoryId').value.trim();
      const brandId = document.getElementById('brandId').value.trim();
      const supplierId = document.getElementById('supplierId').value.trim();

      const body = {
        name: name,
        reference: reference,
        unitPrice: unitPrice,
        description: description,
        warrantyMonths: warrantyMonths,
        imageUrl: imageUrl
      };
      // Optional UUID fields - only include when provided
      if (categoryId) body.categoryId = categoryId;
      if (brandId) body.brandId = brandId;
      if (supplierId) body.supplierId = supplierId;

      const saveBtn = document.getElementById('save-btn');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Enregistrement...';

      let r;
      if (productId) {
        r = await apiFetch('/products/' + productId, {
          method: 'PUT',
          body: JSON.stringify(body)
        });
      } else {
        r = await apiFetch('/products', {
          method: 'POST',
          body: JSON.stringify(body)
        });
      }

      saveBtn.disabled = false;
      saveBtn.textContent = 'Enregistrer';

      if (!r || !r.ok) {
        showToast(r?.data?.message || "Erreur lors de l'enregistrement", "error");
        return;
      }

      showToast("Produit enregistré", "success");
      setTimeout(() => { window.location.href = 'products.html'; }, 600);
    }
  </script>
</body>
</html>
