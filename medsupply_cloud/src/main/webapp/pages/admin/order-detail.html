<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Détail Commande - MedSupply Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: {
      primary: "#0A2647", secondary: "#144272", accent: "#2C74B3",
      success: "#16A34A", warning: "#D97706", danger: "#DC2626",
      background: "#F8FAFC", surface: "#FFFFFF", border: "#E2E8F0",
      textPrimary: "#0F172A", textSecondary: "#64748B" } } } };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style> body { font-family: 'Inter', sans-serif; } .font-mono { font-family: 'JetBrains Mono', monospace; } </style>
</head>
<body class="bg-background">
  <div class="flex h-screen">
    <aside id="sidebar" class="w-72 bg-white border-r border-gray-200 flex-shrink-0"></aside>
    <div class="flex-1 flex flex-col">
      <header id="header"></header>
      <main id="main-content" class="flex-1 p-6 overflow-y-auto">
        <div class="flex items-center gap-3 mb-6">
          <a href="/medsupply-cloud/pages/admin/orders.html" class="p-2 rounded-lg hover:bg-gray-100"><i data-lucide="arrow-left" class="w-5 h-5 text-textSecondary"></i></a>
          <div><h1 class="text-2xl font-bold text-textPrimary" id="order-title">Commande</h1><p class="text-textSecondary" id="order-sub">Chargement...</p></div>
        </div>
        <div id="content" class="grid grid-cols-1 lg:grid-cols-3 gap-6"><p class="text-textSecondary">Chargement...</p></div>
      </main>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script>requireAuth(["ADMIN"]);</script>
  <script src="../../js/router.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/header.js"></script>
  <script src="../../js/components/badge.js"></script>
  <script src="../../js/components/toast.js"></script>
  <script src="../../js/utils/format.js"></script>
  <script>
    initPage("ADMIN");
    renderSidebar(getCurrentRole().toLowerCase());
    renderHeader();

    const orderId = new URLSearchParams(location.search).get("id");
    const NEXT = { PENDING: "PROCESSING", PROCESSING: "SHIPPED", SHIPPED: "DELIVERED", DELIVERED: "COMPLETED" };
    let productMap = {};

    async function load() {
      if (!orderId) { location.href = "orders.html"; return; }
      const pr = await apiFetch("/products");
      if (pr && pr.ok) (pr.data.products || []).forEach((p) => (productMap[p.id] = p));

      const r = await apiFetch(`/orders/${orderId}`);
      if (!r || !r.ok) { document.getElementById("content").innerHTML = `<p class="text-danger">${r?.data?.message || "Commande introuvable"}</p>`; return; }
      const order = r.data.order, items = r.data.items || [];

      let client = null;
      const cr = await apiFetch(`/clients/${order.clientId}`);
      if (cr && cr.ok) client = cr.data.client;

      let payment = null;
      const pay = await apiFetch("/payments");
      if (pay && pay.ok) payment = (pay.data.payments || []).find((p) => p.orderId === orderId) || null;

      let delivery = null;
      const dl = await apiFetch("/deliveries");
      if (dl && dl.ok) delivery = (dl.data.deliveries || []).find((d) => d.orderId === orderId) || null;

      render(order, items, client, payment, delivery);
    }

    function render(order, items, client, payment, delivery) {
      document.getElementById("order-title").textContent = "Commande #" + order.orderId.slice(0, 8);
      document.getElementById("order-sub").innerHTML = `${formatDate(order.createdAt)} &middot; ${renderBadge(order.status)}`;

      const rows = items.map((it) => {
        const p = productMap[it.productId] || {};
        return `<tr class="border-b border-border">
          <td class="px-4 py-3"><p class="font-medium text-textPrimary">${p.name || "Produit #" + it.productId.slice(0,8)}</p><p class="text-xs text-textSecondary font-mono">${p.reference || ""}</p></td>
          <td class="px-4 py-3 text-center">${it.quantity}</td>
          <td class="px-4 py-3 text-right">${it.unitPrice != null ? formatCurrency(it.unitPrice) : "—"}</td>
          <td class="px-4 py-3 text-right font-semibold">${it.totalPrice != null ? formatCurrency(it.totalPrice) : (it.unitPrice != null ? formatCurrency(it.unitPrice*it.quantity) : "—")}</td>
        </tr>`;
      }).join("");

      const next = NEXT[order.status];
      const advanceBtn = next
        ? `<button onclick="advance('${next}')" class="w-full bg-accent hover:bg-secondary text-white font-medium py-2.5 rounded-lg flex items-center justify-center gap-2"><i data-lucide="arrow-right" class="w-5 h-5"></i> Passer à « ${renderBadge(next).replace(/<[^>]+>/g,"")} »</button>`
        : `<p class="text-sm text-success text-center">Commande terminée.</p>`;

      const payCard = payment
        ? `<div class="flex items-center justify-between mb-1"><span class="text-textSecondary text-sm">Statut</span>${renderBadge(payment.status)}</div>
           <div class="flex items-center justify-between"><span class="text-textSecondary text-sm">Payé</span><span class="font-medium">${formatCurrency(payment.paidAmount||0)} / ${formatCurrency(payment.amount||0)}</span></div>`
        : `<p class="text-sm text-textSecondary mb-2">Aucun paiement.</p><button onclick="createPayment()" class="w-full bg-blue-50 hover:bg-blue-100 text-accent font-medium py-2 rounded-lg">Créer le paiement</button>`;

      const delCard = delivery
        ? `<div class="flex items-center justify-between"><span class="text-textSecondary text-sm">Statut</span>${renderBadge(delivery.status)}</div>
           <a href="delivery-detail.html?id=${delivery.deliveryId}" class="mt-2 block text-center text-accent hover:underline text-sm">Gérer la livraison →</a>`
        : `<p class="text-sm text-textSecondary mb-2">Aucune livraison.</p>
           <input id="del-addr" placeholder="Adresse de livraison" class="w-full mb-2 px-3 py-2 border border-border rounded-lg text-sm" value="${(client && client.address) || ''}" />
           <input id="del-phone" placeholder="Téléphone" class="w-full mb-2 px-3 py-2 border border-border rounded-lg text-sm" value="${(client && client.phone) || ''}" />
           <input id="del-person" placeholder="Contact" class="w-full mb-2 px-3 py-2 border border-border rounded-lg text-sm" value="${(client && client.name) || ''}" />
           <button onclick="createDelivery()" class="w-full bg-blue-50 hover:bg-blue-100 text-accent font-medium py-2 rounded-lg">Créer la livraison</button>`;

      document.getElementById("content").innerHTML = `
        <div class="lg:col-span-2 bg-surface rounded-xl shadow-sm border border-border overflow-hidden">
          <div class="px-6 py-4 border-b border-border"><h2 class="font-semibold text-textPrimary">Articles</h2></div>
          <table class="w-full text-sm">
            <thead class="bg-gray-50 text-xs uppercase text-textSecondary"><tr><th class="px-4 py-2 text-left">Produit</th><th class="px-4 py-2 text-center">Qté</th><th class="px-4 py-2 text-right">PU</th><th class="px-4 py-2 text-right">Total</th></tr></thead>
            <tbody>${rows || `<tr><td colspan="4" class="px-4 py-6 text-center text-textSecondary">Aucun article</td></tr>`}</tbody>
          </table>
        </div>
        <div class="space-y-6">
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <p class="text-textSecondary text-sm">Montant</p><p class="text-2xl font-bold text-textPrimary mb-1">${order.totalAmount != null ? formatCurrency(order.totalAmount) : "—"}</p>
            <p class="text-sm text-textSecondary mb-4">Client : ${client ? (client.name || "—") : "#" + (order.clientId||"").slice(0,8)}</p>
            ${advanceBtn}
          </div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6"><h3 class="font-semibold text-textPrimary mb-3">Paiement</h3>${payCard}</div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6"><h3 class="font-semibold text-textPrimary mb-3">Livraison</h3>${delCard}</div>
        </div>`;
      lucide.createIcons();
    }

    async function advance(status) {
      const r = await apiFetch(`/orders/${orderId}/status`, { method: "PUT", body: JSON.stringify({ status }) });
      if (r && r.ok && r.data.success) { showToast("Statut mis à jour", "success"); load(); }
      else showToast(r?.data?.message || "Échec", "error");
    }
    async function createPayment() {
      const r = await apiFetch(`/payments/create/${orderId}`, { method: "POST" });
      if (r && r.ok && r.data.success) { showToast("Paiement créé", "success"); load(); }
      else showToast(r?.data?.message || "Échec", "error");
    }
    async function createDelivery() {
      const body = {
        deliveryAddress: document.getElementById("del-addr").value,
        contactPhone: document.getElementById("del-phone").value,
        contactPerson: document.getElementById("del-person").value,
      };
      const r = await apiFetch(`/deliveries/create/${orderId}`, { method: "POST", body: JSON.stringify(body) });
      if (r && r.ok && r.data.success) { showToast("Livraison créée", "success"); load(); }
      else showToast(r?.data?.message || "Échec", "error");
    }

    load();
  </script>
</body>
</html>
