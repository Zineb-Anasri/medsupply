<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestion des Paiements - MedSupply Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: {
      primary: "#0A2647", secondary: "#144272", accent: "#2C74B3",
      success: "#16A34A", warning: "#D97706", danger: "#DC2626",
      background: "#F8FAFC", surface: "#FFFFFF", border: "#E2E8F0",
      textPrimary: "#0F172A", textSecondary: "#64748B" } } } };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style> body { font-family: 'Inter', sans-serif; } .font-mono { font-family: 'JetBrains Mono', monospace; } </style>
</head>
<body class="bg-background">
  <div class="flex h-screen">
    <aside id="sidebar" class="w-72 bg-white border-r border-gray-200 flex-shrink-0"></aside>
    <div class="flex-1 flex flex-col">
      <header id="header"></header>
      <main id="main-content" class="flex-1 p-6 overflow-y-auto">
        <div class="flex items-center justify-between mb-6">
          <div><h1 class="text-2xl font-bold text-textPrimary">Gestion des Paiements</h1><p class="text-textSecondary">Encaissements et créances</p></div>
          <a href="receivables.html" class="bg-white border border-border hover:bg-gray-50 text-textPrimary font-medium px-4 py-2 rounded-lg flex items-center gap-2"><i data-lucide="alert-triangle" class="w-5 h-5 text-danger"></i> Créances en retard</a>
        </div>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <div class="bg-surface rounded-xl shadow-sm border border-border p-5"><p class="text-textSecondary text-sm">Encaissé</p><p class="text-2xl font-bold text-success" id="stat-received">—</p></div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-5"><p class="text-textSecondary text-sm">En attente</p><p class="text-2xl font-bold text-warning" id="stat-outstanding">—</p></div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-5"><p class="text-textSecondary text-sm">En retard</p><p class="text-2xl font-bold text-danger" id="stat-overdue">0</p></div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-5"><p class="text-textSecondary text-sm">Total</p><p class="text-2xl font-bold text-textPrimary" id="stat-total">0</p></div>
        </div>

        <div class="bg-surface rounded-xl shadow-sm border border-border p-4 mb-6">
          <select id="status-filter" onchange="render()" class="px-4 py-2 border border-border rounded-lg outline-none focus:ring-2 focus:ring-accent">
            <option value="">Tous les statuts</option><option value="PENDING">En attente</option><option value="PARTIAL">Partiel</option>
            <option value="PAID">Payé</option><option value="OVERDUE">En retard</option><option value="CANCELLED">Annulé</option>
          </select>
        </div>

        <div class="bg-surface rounded-xl shadow-sm border border-border overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-50 border-b border-border"><tr>
                <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Commande</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Client</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Montant</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Payé</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Échéance</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Statut</th>
                <th class="px-6 py-3 text-right text-xs font-semibold text-textSecondary uppercase">Actions</th>
              </tr></thead>
              <tbody id="pay-body" class="divide-y divide-border"><tr><td colspan="7" class="px-6 py-12 text-center text-textSecondary">Chargement...</td></tr></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script>requireAuth(["ADMIN"]);</script>
  <script src="../../js/router.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/header.js"></script>
  <script src="../../js/components/badge.js"></script>
  <script src="../../js/components/toast.js"></script>
  <script src="../../js/utils/format.js"></script>
  <script>
    initPage("ADMIN");
    renderSidebar(getCurrentRole().toLowerCase());
    renderHeader();

    let payments = [], orderById = {}, clientByUser = {};

    async function load() {
      const [pr, or, cr] = await Promise.all([apiFetch("/payments"), apiFetch("/orders"), apiFetch("/clients")]);
      if (or && or.ok) (or.data.orders || []).forEach((o) => (orderById[o.orderId] = o));
      if (cr && cr.ok) (cr.data.clients || []).forEach((c) => (clientByUser[c.userId] = c));
      if (!pr || !pr.ok) { document.getElementById("pay-body").innerHTML = `<tr><td colspan="7" class="px-6 py-12 text-center text-danger">${pr?.data?.message || "Erreur"}</td></tr>`; return; }
      payments = pr.data.payments || [];
      stats(); render();
    }

    function clientCell(p) {
      const o = orderById[p.orderId];
      const c = o && clientByUser[o.clientId];
      return c ? `<p class="font-medium text-textPrimary">${c.name || "Client"}</p>` : `<span class="text-textSecondary text-sm">—</span>`;
    }

    // Overdue is partly derived: an explicit OVERDUE status OR a PENDING/PARTIAL
    // payment whose due date is in the past (the backend may not have run its sweep).
    function isOverdue(p) {
      if (p.status === "OVERDUE") return true;
      return ["PENDING", "PARTIAL"].includes(p.status) && p.dueDate && new Date(p.dueDate) < new Date();
    }

    function stats() {
      document.getElementById("stat-received").textContent = formatCurrency(payments.reduce((s,p)=>s+(Number(p.paidAmount)||0),0));
      document.getElementById("stat-outstanding").textContent = formatCurrency(payments.filter(p=>["PENDING","PARTIAL","OVERDUE"].includes(p.status)).reduce((s,p)=>s+((Number(p.amount)||0)-(Number(p.paidAmount)||0)),0));
      document.getElementById("stat-overdue").textContent = payments.filter(isOverdue).length;
      document.getElementById("stat-total").textContent = payments.length;
    }

    function render() {
      const f = document.getElementById("status-filter").value;
      const rows = payments
        .filter(p => !f || (f === "OVERDUE" ? isOverdue(p) : p.status === f))
        .sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
      const tbody = document.getElementById("pay-body");
      if (rows.length===0) { tbody.innerHTML = `<tr><td colspan="7" class="px-6 py-12 text-center text-textSecondary">Aucun paiement</td></tr>`; return; }
      tbody.innerHTML = rows.map(p=>{
        const cancelable = ["PENDING","PARTIAL"].includes(p.status);
        return `<tr class="hover:bg-gray-50">
          <td class="px-6 py-4 font-mono text-textPrimary">#${(p.orderId||"").slice(0,8)}</td>
          <td class="px-6 py-4">${clientCell(p)}</td>
          <td class="px-6 py-4 font-medium text-textPrimary">${formatCurrency(p.amount||0)}</td>
          <td class="px-6 py-4 text-textSecondary">${formatCurrency(p.paidAmount||0)}</td>
          <td class="px-6 py-4 text-textSecondary">${p.dueDate ? formatDate(p.dueDate) : "—"}</td>
          <td class="px-6 py-4">${renderBadge(p.status)}</td>
          <td class="px-6 py-4 text-right">${cancelable ? `<button onclick="cancelPayment('${p.paymentId}')" class="text-danger hover:bg-red-50 text-sm font-medium px-3 py-1.5 rounded-lg inline-flex items-center gap-1"><i data-lucide="x-circle" class="w-4 h-4"></i> Annuler</button>` : '<span class="text-textSecondary text-sm">—</span>'}</td>
        </tr>`;
      }).join("");
      lucide.createIcons();
    }

    async function cancelPayment(id) {
      if (!confirm("Annuler ce paiement ?")) return;
      const r = await apiFetch(`/payments/${id}/cancel`, { method: "PUT" });
      if (r && r.ok && r.data.success) { showToast("Paiement annulé", "success"); load(); }
      else showToast(r?.data?.message || "Échec", "error");
    }

    load();
  </script>
</body>
</html>
