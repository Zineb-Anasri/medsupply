<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestion des Commandes - MedSupply Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: {
      primary: "#0A2647", secondary: "#144272", accent: "#2C74B3",
      success: "#16A34A", warning: "#D97706", danger: "#DC2626",
      background: "#F8FAFC", surface: "#FFFFFF", border: "#E2E8F0",
      textPrimary: "#0F172A", textSecondary: "#64748B" } } } };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style> body { font-family: 'Inter', sans-serif; } .font-mono { font-family: 'JetBrains Mono', monospace; } </style>
</head>
<body class="bg-background">
  <div class="flex h-screen">
    <aside id="sidebar" class="w-72 bg-white border-r border-gray-200 flex-shrink-0"></aside>
    <div class="flex-1 flex flex-col">
      <header id="header"></header>
      <main id="main-content" class="flex-1 p-6 overflow-y-auto">
        <div class="mb-6"><h1 class="text-2xl font-bold text-textPrimary">Gestion des Commandes</h1><p class="text-textSecondary">Suivez et faites avancer les commandes</p></div>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <div class="bg-surface rounded-xl shadow-sm border border-border p-5"><p class="text-textSecondary text-sm">Total</p><p class="text-2xl font-bold text-textPrimary" id="stat-total">0</p></div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-5"><p class="text-textSecondary text-sm">En traitement</p><p class="text-2xl font-bold text-blue-600" id="stat-processing">0</p></div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-5"><p class="text-textSecondary text-sm">Livrées</p><p class="text-2xl font-bold text-success" id="stat-delivered">0</p></div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-5"><p class="text-textSecondary text-sm">Chiffre d'affaires</p><p class="text-2xl font-bold text-textPrimary" id="stat-amount">—</p></div>
        </div>

        <!-- Approved quotes to convert -->
        <div id="convert-card" class="bg-surface rounded-xl shadow-sm border border-border p-6 mb-6 hidden">
          <h2 class="font-semibold text-textPrimary mb-3 flex items-center gap-2"><i data-lucide="git-merge" class="w-5 h-5 text-accent"></i> Devis approuvés à convertir</h2>
          <div id="convert-list" class="space-y-2"></div>
        </div>

        <div class="bg-surface rounded-xl shadow-sm border border-border p-4 mb-6">
          <select id="status-filter" onchange="render()" class="px-4 py-2 border border-border rounded-lg outline-none focus:ring-2 focus:ring-accent">
            <option value="">Tous les statuts</option>
            <option value="PENDING">En attente</option><option value="PROCESSING">En traitement</option>
            <option value="SHIPPED">Expédiée</option><option value="DELIVERED">Livrée</option><option value="COMPLETED">Terminée</option>
          </select>
        </div>

        <div class="bg-surface rounded-xl shadow-sm border border-border overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-50 border-b border-border"><tr>
                <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase">N°</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Client</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Montant</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Date</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Statut</th>
                <th class="px-6 py-3 text-right text-xs font-semibold text-textSecondary uppercase">Actions</th>
              </tr></thead>
              <tbody id="orders-body" class="divide-y divide-border"><tr><td colspan="6" class="px-6 py-12 text-center text-textSecondary">Chargement...</td></tr></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script>requireAuth(["ADMIN"]);</script>
  <script src="../../js/router.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/header.js"></script>
  <script src="../../js/components/badge.js"></script>
  <script src="../../js/components/toast.js"></script>
  <script src="../../js/utils/format.js"></script>
  <script>
    initPage("ADMIN");
    renderSidebar(getCurrentRole().toLowerCase());
    renderHeader();

    let allOrders = [], clientsByUser = {};

    async function load() {
      const cr = await apiFetch("/clients");
      if (cr && cr.ok) (cr.data.clients || []).forEach((c) => (clientsByUser[c.userId] = c));
      const r = await apiFetch("/orders");
      if (!r || !r.ok) { document.getElementById("orders-body").innerHTML = `<tr><td colspan="6" class="px-6 py-12 text-center text-danger">${r?.data?.message || "Erreur"}</td></tr>`; return; }
      allOrders = r.data.orders || [];
      updateStats(); render(); loadConvertible();
    }

    async function loadConvertible() {
      const r = await apiFetch("/quotes?status=APPROVED");
      if (!r || !r.ok) return;
      const quotes = r.data.quotes || [];
      if (quotes.length === 0) return;
      document.getElementById("convert-card").classList.remove("hidden");
      document.getElementById("convert-list").innerHTML = quotes.map((q) => `
        <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
          <div><span class="font-mono font-medium">#${q.quoteId.slice(0,8)}</span> <span class="text-textSecondary text-sm">${clientName(q.clientId)} · ${q.totalAmount != null ? formatCurrency(q.totalAmount) : ""}</span></div>
          <button onclick="convertQuote('${q.quoteId}')" class="bg-accent hover:bg-secondary text-white text-sm font-medium px-3 py-1.5 rounded-lg flex items-center gap-1"><i data-lucide="check" class="w-4 h-4"></i> Convertir</button>
        </div>`).join("");
      lucide.createIcons();
    }

    async function convertQuote(quoteId) {
      if (!confirm("Convertir ce devis en commande ?")) return;
      const r = await apiFetch(`/orders/convert/${quoteId}`, { method: "POST" });
      if (r && r.ok && r.data.success) { showToast("Commande créée", "success"); load(); }
      else showToast(r?.data?.message || "Échec de la conversion", "error");
    }

    function clientName(clientId) {
      const c = clientsByUser[clientId];
      return c ? (c.name || "Client") : "#" + (clientId || "").slice(0, 8);
    }
    function clientCell(clientId) {
      const c = clientsByUser[clientId];
      return c ? `<p class="font-medium text-textPrimary">${c.name || "Client"}</p>${c.type ? renderBadge(c.type) : ""}`
               : `<span class="font-mono text-textSecondary">#${(clientId||"").slice(0,8)}</span>`;
    }

    function updateStats() {
      document.getElementById("stat-total").textContent = allOrders.length;
      document.getElementById("stat-processing").textContent = allOrders.filter((o)=>o.status==="PROCESSING").length;
      document.getElementById("stat-delivered").textContent = allOrders.filter((o)=>["DELIVERED","COMPLETED"].includes(o.status)).length;
      document.getElementById("stat-amount").textContent = formatCurrency(allOrders.reduce((s,o)=>s+(Number(o.totalAmount)||0),0));
    }

    function render() {
      const filter = document.getElementById("status-filter").value;
      const rows = allOrders.filter((o)=>!filter||o.status===filter).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
      const tbody = document.getElementById("orders-body");
      if (rows.length===0) { tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-12 text-center text-textSecondary">Aucune commande</td></tr>`; return; }
      tbody.innerHTML = rows.map((o)=>`
        <tr class="hover:bg-gray-50 cursor-pointer" onclick="location.href='order-detail.html?id=${o.orderId}'">
          <td class="px-6 py-4 font-mono font-medium text-textPrimary">#${o.orderId.slice(0,8)}</td>
          <td class="px-6 py-4">${clientCell(o.clientId)}</td>
          <td class="px-6 py-4 font-medium text-textPrimary">${o.totalAmount != null ? formatCurrency(o.totalAmount) : "—"}</td>
          <td class="px-6 py-4 text-textSecondary">${formatDate(o.createdAt)}</td>
          <td class="px-6 py-4">${renderBadge(o.status)}</td>
          <td class="px-6 py-4 text-right" onclick="event.stopPropagation()">
            <a href="order-detail.html?id=${o.orderId}" class="inline-flex items-center gap-1 text-accent hover:underline text-sm font-medium"><i data-lucide="eye" class="w-4 h-4"></i> Gérer</a>
          </td>
        </tr>`).join("");
      lucide.createIcons();
    }

    load();
  </script>
</body>
</html>
