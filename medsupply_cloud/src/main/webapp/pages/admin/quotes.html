<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des Devis - MedSupply Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#0A2647",
            secondary: "#144272",
            accent: "#2C74B3",
            success: "#16A34A",
            warning: "#D97706",
            danger: "#DC2626",
            background: "#F8FAFC",
            surface: "#FFFFFF",
            border: "#E2E8F0",
            textPrimary: "#0F172A",
            textSecondary: "#64748B",
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-background">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <aside id="sidebar" class="bg-white border-r border-border flex-shrink-0"></aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <!-- Header -->
      <header id="header"></header>

      <!-- Content -->
      <main id="main-content" class="flex-1 p-6 overflow-y-auto">
        <!-- Page Header -->
        <div class="mb-6">
          <h1 class="text-2xl font-bold text-textPrimary">Gestion des Devis</h1>
          <p class="text-textSecondary">Traitez et chiffrez les demandes de devis des clients</p>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">En attente</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-pending">0</p>
              </div>
              <div class="w-12 h-12 bg-yellow-100 rounded-lg flex items-center justify-center">
                <i data-lucide="clock" class="w-6 h-6 text-yellow-600"></i>
              </div>
            </div>
          </div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">Chiffrés</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-reviewed">0</p>
              </div>
              <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                <i data-lucide="file-check" class="w-6 h-6 text-blue-600"></i>
              </div>
            </div>
          </div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">Approuvés</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-approved">0</p>
              </div>
              <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
                <i data-lucide="check-circle" class="w-6 h-6 text-green-600"></i>
              </div>
            </div>
          </div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">Rejetés</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-rejected">0</p>
              </div>
              <div class="w-12 h-12 bg-red-100 rounded-lg flex items-center justify-center">
                <i data-lucide="x-circle" class="w-6 h-6 text-red-600"></i>
              </div>
            </div>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="bg-surface rounded-xl shadow-sm border border-border p-4 mb-6">
          <div class="flex flex-wrap items-center gap-4">
            <select id="status-filter" onchange="applyFilters()" class="px-4 py-2 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all">
              <option value="">Tous les statuts</option>
              <option value="PENDING">En attente</option>
              <option value="REVIEWED">Devis chiffré</option>
              <option value="APPROVED">Approuvé</option>
              <option value="REJECTED">Rejeté</option>
              <option value="CONVERTED">Converti</option>
            </select>
            <button onclick="resetFilters()" class="bg-gray-200 hover:bg-gray-300 text-textPrimary font-medium px-4 py-2 rounded-lg transition-colors">
              Réinitialiser
            </button>
          </div>
        </div>

        <!-- Quote Table -->
        <div class="bg-surface rounded-xl shadow-sm border border-border overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-50 border-b border-border">
                <tr>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">N° Devis</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Client</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Montant total</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Date demande</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Statut</th>
                  <th class="px-6 py-3 text-right text-xs font-semibold text-textSecondary uppercase tracking-wider">Actions</th>
                </tr>
              </thead>
              <tbody id="quotes-table-body" class="divide-y divide-border">
                <tr>
                  <td colspan="6" class="px-6 py-12 text-center text-textSecondary">Chargement...</td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Pagination -->
          <div class="px-6 py-4 border-t border-border flex items-center justify-between">
            <p class="text-sm text-textSecondary">
              Affichage de <span id="showing-from">0</span> à <span id="showing-to">0</span> sur <span id="total-records">0</span> devis
            </p>
            <div class="flex items-center gap-2">
              <button onclick="previousPage()" id="prev-btn" class="px-3 py-1 border border-border rounded hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                <i data-lucide="chevron-left" class="w-4 h-4"></i>
              </button>
              <span class="px-3 py-1 bg-primary text-white rounded" id="current-page">1</span>
              <button onclick="nextPage()" id="next-btn" class="px-3 py-1 border border-border rounded hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                <i data-lucide="chevron-right" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    requireAuth(["ADMIN"]);
    const currentUser = getCurrentUser();
  </script>
  <script src="../../js/router.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/header.js"></script>
  <script src="../../js/components/badge.js"></script>
  <script src="../../js/components/toast.js"></script>
  <script src="../../js/utils/format.js"></script>
  <script>
    initPage("ADMIN");
    const role = getCurrentRole();
    if (role) {
      renderSidebar(role.toLowerCase());
    }
    renderHeader();

    let allQuotes = [];        // all quotes returned by the current fetch (status-filtered server-side)
    let filteredQuotes = [];   // == allQuotes (kept for clarity / future client filters)
    let clientsByUser = {};    // userId -> client profile (for name resolution)
    let currentPage = 1;
    const pageSize = 20;

    async function loadClients() {
      const res = await apiFetch("/clients");
      if (!res || !res.ok) return; // non-fatal: fall back to id slices
      (res.data.clients || []).forEach(c => { clientsByUser[c.userId] = c; });
    }

    function clientLabel(clientId) {
      const c = clientsByUser[clientId];
      if (c && c.name) return c.name;
      return "#" + String(clientId || "").slice(0, 8);
    }

    function clientType(clientId) {
      const c = clientsByUser[clientId];
      return c ? c.type : null;
    }

    async function loadQuotes() {
      const tbody = document.getElementById("quotes-table-body");
      tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-12 text-center text-textSecondary">Chargement...</td></tr>`;

      const status = document.getElementById("status-filter").value;
      const endpoint = status ? `/quotes?status=${encodeURIComponent(status)}` : "/quotes";

      const res = await apiFetch(endpoint);
      if (!res || !res.ok) {
        showToast(res?.data?.message || "Erreur lors du chargement des devis", "error");
        tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-12 text-center text-textSecondary">Impossible de charger les devis</td></tr>`;
        return;
      }

      allQuotes = res.data.quotes || [];
      // Newest first for a meaningful queue order.
      allQuotes.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
      filteredQuotes = allQuotes;
      currentPage = 1;

      updateStats();
      renderTable();
    }

    function updateStats() {
      // Stats are computed from the currently-loaded list. When a status filter
      // is active only that status is fetched, so reflect that honestly.
      const count = (s) => allQuotes.filter(q => q.status === s).length;
      document.getElementById("stat-pending").textContent = count("PENDING");
      document.getElementById("stat-reviewed").textContent = count("REVIEWED");
      document.getElementById("stat-approved").textContent = count("APPROVED");
      document.getElementById("stat-rejected").textContent = count("REJECTED");
    }

    function renderTable() {
      const tbody = document.getElementById("quotes-table-body");
      const total = filteredQuotes.length;
      const totalPages = Math.max(1, Math.ceil(total / pageSize));
      if (currentPage > totalPages) currentPage = totalPages;

      const start = (currentPage - 1) * pageSize;
      const pageItems = filteredQuotes.slice(start, start + pageSize);

      if (total === 0) {
        tbody.innerHTML = `
          <tr><td colspan="6" class="px-6 py-12 text-center">
            <div class="flex flex-col items-center gap-3 text-textSecondary">
              <i data-lucide="file-text" class="w-10 h-10 text-gray-300"></i>
              <p>Aucun devis trouvé</p>
            </div>
          </td></tr>`;
      } else {
        tbody.innerHTML = pageItems.map(quote => {
          const type = clientType(quote.clientId);
          return `
          <tr class="hover:bg-gray-50 cursor-pointer" onclick="viewQuote('${quote.quoteId}')">
            <td class="px-6 py-4">
              <span class="font-mono text-textPrimary font-medium">#${String(quote.quoteId).slice(0, 8)}</span>
            </td>
            <td class="px-6 py-4">
              <div class="flex items-center gap-2">
                <span class="font-medium text-textPrimary">${clientLabel(quote.clientId)}</span>
                ${type ? renderClientTypeBadge(type) : ""}
              </div>
            </td>
            <td class="px-6 py-4 text-textPrimary font-medium">${formatCurrency(quote.totalAmount || 0)}</td>
            <td class="px-6 py-4 text-textSecondary">${quote.createdAt ? formatDate(quote.createdAt) : "—"}</td>
            <td class="px-6 py-4">${renderBadge(quote.status)}</td>
            <td class="px-6 py-4">
              <div class="flex items-center justify-end gap-2" onclick="event.stopPropagation()">
                ${quote.status === "PENDING" ? `
                  <button onclick="viewQuote('${quote.quoteId}')" class="inline-flex items-center gap-1.5 bg-accent hover:bg-secondary text-white text-sm font-medium px-3 py-1.5 rounded-lg transition-colors" title="Chiffrer ce devis">
                    <i data-lucide="calculator" class="w-4 h-4"></i> Chiffrer
                  </button>
                ` : ""}
                <button onclick="viewQuote('${quote.quoteId}')" class="p-2 hover:bg-gray-100 rounded-lg transition-colors" title="Voir le détail">
                  <i data-lucide="eye" class="w-4 h-4 text-gray-600"></i>
                </button>
              </div>
            </td>
          </tr>`;
        }).join("");
      }

      // Pagination summary
      document.getElementById("showing-from").textContent = total === 0 ? 0 : start + 1;
      document.getElementById("showing-to").textContent = Math.min(start + pageSize, total);
      document.getElementById("total-records").textContent = total;
      document.getElementById("current-page").textContent = currentPage;
      document.getElementById("prev-btn").disabled = currentPage <= 1;
      document.getElementById("next-btn").disabled = currentPage >= totalPages;

      lucide.createIcons();
    }

    function applyFilters() {
      currentPage = 1;
      loadQuotes();
    }

    function resetFilters() {
      document.getElementById("status-filter").value = "";
      currentPage = 1;
      loadQuotes();
    }

    function previousPage() {
      if (currentPage > 1) {
        currentPage--;
        renderTable();
      }
    }

    function nextPage() {
      const totalPages = Math.max(1, Math.ceil(filteredQuotes.length / pageSize));
      if (currentPage < totalPages) {
        currentPage++;
        renderTable();
      }
    }

    function viewQuote(quoteId) {
      window.location.href = `quote-detail.html?id=${quoteId}`;
    }

    // Initial load: resolve client names first (non-blocking on failure), then quotes.
    (async function init() {
      await loadClients();
      await loadQuotes();
    })();
  </script>
</body>
</html>
