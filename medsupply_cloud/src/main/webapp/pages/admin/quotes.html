<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des Devis - MedSupply Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#0A2647",
            secondary: "#144272",
            accent: "#2C74B3",
            success: "#16A34A",
            warning: "#D97706",
            danger: "#DC2626",
            background: "#F8FAFC",
            surface: "#FFFFFF",
            border: "#E2E8F0",
            textPrimary: "#0F172A",
            textSecondary: "#64748B",
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-background">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-72 bg-white border-r border-gray-200 flex-shrink-0"></aside>
    
    <!-- Main Content -->
    <div class="flex-1 flex flex-col ml-72">
      <!-- Header -->
      <header id="header"></header>
      
      <!-- Content -->
      <main id="main-content" class="flex-1 p-6 overflow-y-auto">
        <!-- Page Header -->
        <div class="mb-6">
          <h1 class="text-2xl font-bold text-textPrimary">Gestion des Devis</h1>
          <p class="text-textSecondary">Traitez les demandes de devis des clients</p>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">En attente</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-pending">0</p>
              </div>
              <div class="w-12 h-12 bg-yellow-100 rounded-lg flex items-center justify-center">
                <i data-lucide="clock" class="w-6 h-6 text-yellow-600"></i>
              </div>
            </div>
          </div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">En traitement</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-processing">0</p>
              </div>
              <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                <i data-lucide="loader" class="w-6 h-6 text-blue-600"></i>
              </div>
            </div>
          </div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">Validés ce mois</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-validated">0</p>
              </div>
              <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
                <i data-lucide="check-circle" class="w-6 h-6 text-green-600"></i>
              </div>
            </div>
          </div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">Rejetés</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-rejected">0</p>
              </div>
              <div class="w-12 h-12 bg-red-100 rounded-lg flex items-center justify-center">
                <i data-lucide="x-circle" class="w-6 h-6 text-red-600"></i>
              </div>
            </div>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="bg-surface rounded-xl shadow-sm border border-border p-4 mb-6">
          <div class="flex flex-wrap items-center gap-4">
            <select id="status-filter" class="px-4 py-2 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all">
              <option value="">Tous les statuts</option>
              <option value="PENDING">En attente</option>
              <option value="PROCESSING">En traitement</option>
              <option value="VALIDATED">Validé</option>
              <option value="REJECTED">Rejeté</option>
              <option value="EXPIRED">Expiré</option>
            </select>
            <select id="client-filter" class="px-4 py-2 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all">
              <option value="">Tous les clients</option>
            </select>
            <div class="flex items-center gap-2">
              <input type="date" id="date-from" class="px-4 py-2 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all">
              <span class="text-textSecondary">à</span>
              <input type="date" id="date-to" class="px-4 py-2 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all">
            </div>
            <button onclick="applyFilters()" class="bg-accent hover:bg-secondary text-white font-medium px-4 py-2 rounded-lg transition-colors">
              Filtrer
            </button>
            <button onclick="resetFilters()" class="bg-gray-200 hover:bg-gray-300 text-textPrimary font-medium px-4 py-2 rounded-lg transition-colors">
              Réinitialiser
            </button>
          </div>
        </div>

        <!-- Quote Table -->
        <div class="bg-surface rounded-xl shadow-sm border border-border overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-50 border-b border-border">
                <tr>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">N° Devis</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Client</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Nb produits</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Montant total</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Date demande</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Statut</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Actions</th>
                </tr>
              </thead>
              <tbody id="quotes-table-body" class="divide-y divide-border">
                <tr>
                  <td colspan="7" class="px-6 py-12 text-center text-textSecondary">Chargement...</td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Pagination -->
          <div class="px-6 py-4 border-t border-border flex items-center justify-between">
            <p class="text-sm text-textSecondary">
              Affichage de <span id="showing-from">0</span> à <span id="showing-to">0</span> sur <span id="total-records">0</span> devis
            </p>
            <div class="flex items-center gap-2">
              <button onclick="previousPage()" id="prev-btn" class="px-3 py-1 border border-border rounded hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                <i data-lucide="chevron-left" class="w-4 h-4"></i>
              </button>
              <span class="px-3 py-1 bg-primary text-white rounded" id="current-page">1</span>
              <button onclick="nextPage()" id="next-btn" class="px-3 py-1 border border-border rounded hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                <i data-lucide="chevron-right" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    requireAuth(["ADMIN"]);
    const currentUser = getCurrentUser();
  </script>
  <script src="../../js/router.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/header.js"></script>
  <script src="../../js/components/badge.js"></script>
  <script src="../../js/components/toast.js"></script>
  <script src="../../js/components/skeleton.js"></script>
  <script src="../../js/utils/format.js"></script>
  <script>
    initPage("ADMIN");
    const role = getCurrentRole();
    if (role) {
      renderSidebar(role.toLowerCase());
    }
    renderHeader();

    let currentPage = 1;
    const pageSize = 20;
    let totalRecords = 0;

    async function loadQuotes() {
      try {
        // Show skeleton while loading
        showSkeleton('quotes-table-body', 'table', { rows: 5, columns: 7 });

        const status = document.getElementById('status-filter').value;
        const client = document.getElementById('client-filter').value;
        const dateFrom = document.getElementById('date-from').value;
        const dateTo = document.getElementById('date-to').value;

        const response = await apiFetch(`/quotes?status=${status}&page=${currentPage}&size=${pageSize}`);
        const data = response?.data || {};

        // Update stats
        document.getElementById("stat-pending").textContent = data.stats?.pending || 0;
        document.getElementById("stat-processing").textContent = data.stats?.processing || 0;
        document.getElementById("stat-validated").textContent = data.stats?.validated || 0;
        document.getElementById("stat-rejected").textContent = data.stats?.rejected || 0;

        // Update client filter options
        if (data.clients && data.clients.length > 0) {
          const clientSelect = document.getElementById('client-filter');
          clientSelect.innerHTML = '<option value="">Tous les clients</option>' +
            data.clients.map(client => `<option value="${client.clientId}">${client.organizationName}</option>`).join('');
        }

        // Update table
        const tbody = document.getElementById("quotes-table-body");
        const quotes = data.quotes || [];
        if (quotes.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="px-6 py-12 text-center text-textSecondary">Aucun devis trouvé</td></tr>`;
        } else {
          tbody.innerHTML = quotes.map(quote => `
            <tr class="hover:bg-gray-50 cursor-pointer" onclick="viewQuote('${quote.quoteId}')">
              <td class="px-6 py-4">
                <span class="font-mono text-textPrimary font-medium">${quote.quoteRef}</span>
              </td>
              <td class="px-6 py-4">
                <div class="flex items-center gap-3">
                  <p class="font-medium text-textPrimary">${quote.clientName}</p>
                  ${renderClientTypeBadge(quote.clientType)}
                </div>
              </td>
              <td class="px-6 py-4 text-textPrimary">${quote.itemCount}</td>
              <td class="px-6 py-4 text-textPrimary font-medium">${formatCurrency(quote.totalAmount)}</td>
              <td class="px-6 py-4 text-textSecondary">${formatDate(quote.createdAt)}</td>
              <td class="px-6 py-4">
                ${renderStatusBadge(quote.status)}
              </td>
              <td class="px-6 py-4">
                <div class="flex items-center gap-2" onclick="event.stopPropagation()">
                  ${quote.status === 'PENDING' ? `
                    <button onclick="processQuote('${quote.quoteId}')" class="p-2 hover:bg-blue-100 rounded transition-colors" title="Traiter">
                      <i data-lucide="settings" class="w-4 h-4 text-blue-600"></i>
                    </button>
                  ` : ''}
                  <button onclick="viewQuote('${quote.quoteId}')" class="p-2 hover:bg-gray-100 rounded transition-colors" title="Voir">
                    <i data-lucide="eye" class="w-4 h-4 text-gray-600"></i>
                  </button>
                  ${quote.status === 'PENDING' ? `
                    <button onclick="rejectQuote('${quote.quoteId}')" class="p-2 hover:bg-red-100 rounded transition-colors" title="Rejeter">
                      <i data-lucide="x" class="w-4 h-4 text-red-600"></i>
                    </button>
                  ` : ''}
                </div>
              </td>
            </tr>
          `).join("");
        }

        // Update pagination
        totalRecords = data.total;
        document.getElementById("showing-from").textContent = (currentPage - 1) * pageSize + 1;
        document.getElementById("showing-to").textContent = Math.min(currentPage * pageSize, totalRecords);
        document.getElementById("total-records").textContent = totalRecords;
        document.getElementById("current-page").textContent = currentPage;

        document.getElementById("prev-btn").disabled = currentPage === 1;
        document.getElementById("next-btn").disabled = currentPage * pageSize >= totalRecords;

        lucide.createIcons();

        // Hide skeleton
        hideSkeleton('quotes-table-body');
      } catch (error) {
        console.error("Failed to load quotes:", error);
        showToast("Erreur lors du chargement des devis", "error");
      }
    }

    function renderClientTypeBadge(type) {
      const colors = {
        HOSPITAL: "bg-blue-100 text-blue-800",
        LABORATORY: "bg-purple-100 text-purple-800",
        CLINIC: "bg-teal-100 text-teal-800",
        DOCTOR: "bg-green-100 text-green-800",
        MEDICAL_OFFICE: "bg-orange-100 text-orange-800",
        RESELLER: "bg-slate-100 text-slate-800"
      };
      const labels = {
        HOSPITAL: "Hôpital",
        LABORATORY: "Laboratoire",
        CLINIC: "Clinique",
        DOCTOR: "Médecin",
        MEDICAL_OFFICE: "Cabinet",
        RESELLER: "Revendeur"
      };
      return `<span class="inline-flex items-center px-2 py-1 rounded-md text-xs font-medium ${colors[type] || 'bg-gray-100 text-gray-800'}">${labels[type] || type}</span>`;
    }

    function renderStatusBadge(status) {
      const colors = {
        PENDING: "bg-yellow-100 text-yellow-800",
        PROCESSING: "bg-blue-100 text-blue-800",
        VALIDATED: "bg-green-100 text-green-800",
        REJECTED: "bg-red-100 text-red-800",
        EXPIRED: "bg-gray-100 text-gray-800"
      };
      const labels = {
        PENDING: "En attente",
        PROCESSING: "En traitement",
        VALIDATED: "Validé",
        REJECTED: "Rejeté",
        EXPIRED: "Expiré"
      };
      return `<span class="inline-flex items-center px-2 py-1 rounded-md text-xs font-medium ${colors[status] || 'bg-gray-100 text-gray-800'}">${labels[status] || status}</span>`;
    }

    function applyFilters() {
      currentPage = 1;
      loadQuotes();
    }

    function resetFilters() {
      document.getElementById('status-filter').value = '';
      document.getElementById('client-filter').value = '';
      document.getElementById('date-from').value = '';
      document.getElementById('date-to').value = '';
      currentPage = 1;
      loadQuotes();
    }

    function previousPage() {
      if (currentPage > 1) {
        currentPage--;
        loadQuotes();
      }
    }

    function nextPage() {
      if (currentPage * pageSize < totalRecords) {
        currentPage++;
        loadQuotes();
      }
    }

    function viewQuote(quoteId) {
      window.location.href = `quote-detail.html?id=${quoteId}`;
    }

    function processQuote(quoteId) {
      window.location.href = `quote-detail.html?id=${quoteId}`;
    }

    async function rejectQuote(quoteId) {
      const reason = prompt("Raison du rejet:");
      if (reason) {
        try {
          await apiFetch(`/admin/quotes/${quoteId}/reject`, {
            method: 'PUT',
            body: JSON.stringify({ reason })
          });
          loadQuotes();
        } catch (error) {
          console.error("Failed to reject quote:", error);
        }
      }
    }

    // Load quotes on page load
    loadQuotes();
  </script>
</body>
</html>
