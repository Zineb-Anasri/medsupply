<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogue Médical - MedSupply Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#0A2647",
            secondary: "#144272",
            accent: "#2C74B3",
            success: "#16A34A",
            warning: "#D97706",
            danger: "#DC2626",
            background: "#F8FAFC",
            surface: "#FFFFFF",
            border: "#E2E8F0",
            textPrimary: "#0F172A",
            textSecondary: "#64748B",
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-background">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <aside id="sidebar" class="w-72 bg-white border-r border-gray-200 flex-shrink-0"></aside>
    
    <!-- Main Content -->
    <div class="flex-1 flex flex-col ml-72">
      <!-- Header -->
      <header id="header"></header>
      
      <!-- Content -->
      <main id="main-content" class="flex-1 p-6 overflow-y-auto">
        <!-- Page Header -->
        <div class="flex items-center justify-between mb-6">
          <div>
            <h1 class="text-2xl font-bold text-textPrimary">Catalogue Médical</h1>
            <p class="text-textSecondary">Gérez votre catalogue de produits</p>
          </div>
          <button onclick="window.location.href='product-form.html'" class="bg-primary hover:bg-secondary text-white font-medium px-4 py-2 rounded-lg transition-colors flex items-center gap-2">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>Ajouter un produit</span>
          </button>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">Total produits</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-total">0</p>
              </div>
              <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                <i data-lucide="package" class="w-6 h-6 text-blue-600"></i>
              </div>
            </div>
          </div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">En stock</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-in-stock">0</p>
              </div>
              <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
                <i data-lucide="check-circle" class="w-6 h-6 text-green-600"></i>
              </div>
            </div>
          </div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">Stock faible</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-low-stock">0</p>
              </div>
              <div class="w-12 h-12 bg-yellow-100 rounded-lg flex items-center justify-center">
                <i data-lucide="alert-triangle" class="w-6 h-6 text-yellow-600"></i>
              </div>
            </div>
          </div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">Rupture de stock</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-out-of-stock">0</p>
              </div>
              <div class="w-12 h-12 bg-red-100 rounded-lg flex items-center justify-center">
                <i data-lucide="x-circle" class="w-6 h-6 text-red-600"></i>
              </div>
            </div>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="bg-surface rounded-xl shadow-sm border border-border p-4 mb-6">
          <div class="flex flex-wrap items-center gap-4">
            <div class="flex-1 min-w-[200px]">
              <div class="relative">
                <i data-lucide="search" class="w-5 h-5 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                <input type="text" id="search-input" placeholder="Rechercher..."
                  class="w-full pl-10 pr-4 py-2 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all">
              </div>
            </div>
            <select id="category-filter" class="px-4 py-2 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all">
              <option value="">Toutes les catégories</option>
            </select>
            <select id="brand-filter" class="px-4 py-2 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all">
              <option value="">Toutes les marques</option>
            </select>
            <select id="supplier-filter" class="px-4 py-2 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all">
              <option value="">Tous les fournisseurs</option>
            </select>
            <select id="stock-filter" class="px-4 py-2 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all">
              <option value="">Tous les stocks</option>
              <option value="in-stock">En stock</option>
              <option value="low-stock">Stock faible</option>
              <option value="out-of-stock">Rupture</option>
            </select>
            <button onclick="applyFilters()" class="bg-accent hover:bg-secondary text-white font-medium px-4 py-2 rounded-lg transition-colors">
              Filtrer
            </button>
            <button onclick="resetFilters()" class="bg-gray-200 hover:bg-gray-300 text-textPrimary font-medium px-4 py-2 rounded-lg transition-colors">
              Réinitialiser
            </button>
          </div>
        </div>

        <!-- Product Table -->
        <div class="bg-surface rounded-xl shadow-sm border border-border overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-50 border-b border-border">
                <tr>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Produit</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Catégorie / Marque</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Fournisseur</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Prix unitaire</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Stock</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Garantie</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Actions</th>
                </tr>
              </thead>
              <tbody id="products-table-body" class="divide-y divide-border">
                <tr>
                  <td colspan="7" class="px-6 py-12 text-center text-textSecondary">Chargement...</td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Pagination -->
          <div class="px-6 py-4 border-t border-border flex items-center justify-between">
            <p class="text-sm text-textSecondary">
              Affichage de <span id="showing-from">0</span> à <span id="showing-to">0</span> sur <span id="total-records">0</span> produits
            </p>
            <div class="flex items-center gap-2">
              <button onclick="previousPage()" id="prev-btn" class="px-3 py-1 border border-border rounded hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                <i data-lucide="chevron-left" class="w-4 h-4"></i>
              </button>
              <span class="px-3 py-1 bg-primary text-white rounded" id="current-page">1</span>
              <button onclick="nextPage()" id="next-btn" class="px-3 py-1 border border-border rounded hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                <i data-lucide="chevron-right" class="w-4 h-4"></i>
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    requireAuth(["ADMIN"]);
    const currentUser = getCurrentUser();
  </script>
  <script src="../../js/router.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/header.js"></script>
  <script src="../../js/components/badge.js"></script>
  <script src="../../js/components/toast.js"></script>
  <script src="../../js/components/skeleton.js"></script>
  <script src="../../js/utils/format.js"></script>
  <script>
    initPage("ADMIN");
    const role = getCurrentRole();
    if (role) {
      renderSidebar(role.toLowerCase());
    }
    renderHeader();

    let currentPage = 1;
    const pageSize = 20;
    let totalRecords = 0;

    async function loadProducts() {
      try {
        // Show skeleton while loading
        showSkeleton('products-table-body', 'table', { rows: 5, columns: 7 });

        const search = document.getElementById('search-input').value;
        const category = document.getElementById('category-filter').value;
        const brand = document.getElementById('brand-filter').value;
        const supplier = document.getElementById('supplier-filter').value;
        const stockStatus = document.getElementById('stock-filter').value;

        const response = await apiFetch(`/products?search=${search}&categoryId=${category}&brandId=${brand}&supplierId=${supplier}&page=${currentPage}&size=${pageSize}`);
        const data = response?.data || {};

        // Update stats
        document.getElementById("stat-total").textContent = data.stats?.total || 0;
        document.getElementById("stat-in-stock").textContent = data.stats?.inStock || 0;
        document.getElementById("stat-low-stock").textContent = data.stats?.lowStock || 0;
        document.getElementById("stat-out-of-stock").textContent = data.stats?.outOfStock || 0;

        // Update filter options
        updateFilterOptions(data.categories || [], data.brands || [], data.suppliers || []);

        // Update table
        const tbody = document.getElementById("products-table-body");
        const products = data.products || [];
        if (products.length === 0) {
          tbody.innerHTML = `<tr><td colspan="7" class="px-6 py-12 text-center text-textSecondary">Aucun produit trouvé</td></tr>`;
        } else {
          tbody.innerHTML = products.map(product => `
            <tr class="hover:bg-gray-50">
              <td class="px-6 py-4">
                <div class="flex items-center gap-3">
                  <div class="w-12 h-12 bg-gray-100 rounded-lg overflow-hidden flex-shrink-0">
                    ${product.imageUrl 
                      ? `<img src="${product.imageUrl}" alt="${product.name}" class="w-full h-full object-cover">`
                      : `<div class="w-full h-full flex items-center justify-center bg-primary bg-opacity-10">
                          <i data-lucide="package" class="w-6 h-6 text-primary"></i>
                        </div>`
                    }
                  </div>
                  <div>
                    <p class="font-medium text-textPrimary">${product.name}</p>
                    <p class="text-sm text-textSecondary font-mono">${product.reference}</p>
                  </div>
                </div>
              </td>
              <td class="px-6 py-4">
                <p class="text-textPrimary">${product.category}</p>
                <p class="text-sm text-textSecondary">${product.brand}</p>
              </td>
              <td class="px-6 py-4 text-textPrimary">${product.supplier}</td>
              <td class="px-6 py-4 text-textPrimary font-medium">${formatCurrency(product.unitPrice)}</td>
              <td class="px-6 py-4">
                ${renderStockBadge(product.quantity, product.minQuantity)}
              </td>
              <td class="px-6 py-4 text-textSecondary">${product.warrantyMonths} mois</td>
              <td class="px-6 py-4">
                <div class="flex items-center gap-2">
                  <button onclick="viewProduct('${product.productId}')" class="p-2 hover:bg-gray-100 rounded transition-colors" title="Voir">
                    <i data-lucide="eye" class="w-4 h-4 text-gray-600"></i>
                  </button>
                  <button onclick="editProduct('${product.productId}')" class="p-2 hover:bg-blue-100 rounded transition-colors" title="Modifier">
                    <i data-lucide="edit" class="w-4 h-4 text-blue-600"></i>
                  </button>
                  ${product.active ? `
                    <button onclick="deactivateProduct('${product.productId}')" class="p-2 hover:bg-red-100 rounded transition-colors" title="Désactiver">
                      <i data-lucide="ban" class="w-4 h-4 text-red-600"></i>
                    </button>
                  ` : `
                    <button onclick="activateProduct('${product.productId}')" class="p-2 hover:bg-green-100 rounded transition-colors" title="Activer">
                      <i data-lucide="check" class="w-4 h-4 text-green-600"></i>
                    </button>
                  `}
                </div>
              </td>
            </tr>
          `).join("");
        }

        // Update pagination
        totalRecords = data.total;
        document.getElementById("showing-from").textContent = (currentPage - 1) * pageSize + 1;
        document.getElementById("showing-to").textContent = Math.min(currentPage * pageSize, totalRecords);
        document.getElementById("total-records").textContent = totalRecords;
        document.getElementById("current-page").textContent = currentPage;

        document.getElementById("prev-btn").disabled = currentPage === 1;
        document.getElementById("next-btn").disabled = currentPage * pageSize >= totalRecords;

        lucide.createIcons();

        // Hide skeleton
        hideSkeleton('products-table-body');
      } catch (error) {
        console.error("Failed to load products:", error);
        showToast("Erreur lors du chargement des produits", "error");
      }
    }

    function updateFilterOptions(categories, brands, suppliers) {
      const categorySelect = document.getElementById('category-filter');
      const brandSelect = document.getElementById('brand-filter');
      const supplierSelect = document.getElementById('supplier-filter');

      if (categories && categories.length > 0) {
        categorySelect.innerHTML = '<option value="">Toutes les catégories</option>' +
          categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
      }

      if (brands && brands.length > 0) {
        brandSelect.innerHTML = '<option value="">Toutes les marques</option>' +
          brands.map(brand => `<option value="${brand}">${brand}</option>`).join('');
      }

      if (suppliers && suppliers.length > 0) {
        supplierSelect.innerHTML = '<option value="">Tous les fournisseurs</option>' +
          suppliers.map(sup => `<option value="${sup}">${sup}</option>`).join('');
      }
    }

    function renderStockBadge(quantity, minQuantity) {
      if (quantity === 0) {
        return `<span class="inline-flex items-center px-2 py-1 rounded-md text-xs font-medium bg-red-100 text-red-800">Rupture</span>`;
      } else if (quantity <= minQuantity) {
        return `<span class="inline-flex items-center px-2 py-1 rounded-md text-xs font-medium bg-yellow-100 text-yellow-800">Stock limité (${quantity})</span>`;
      } else {
        return `<span class="inline-flex items-center px-2 py-1 rounded-md text-xs font-medium bg-green-100 text-green-800">En stock (${quantity})</span>`;
      }
    }

    function applyFilters() {
      currentPage = 1;
      loadProducts();
    }

    function resetFilters() {
      document.getElementById('search-input').value = '';
      document.getElementById('category-filter').value = '';
      document.getElementById('brand-filter').value = '';
      document.getElementById('supplier-filter').value = '';
      document.getElementById('stock-filter').value = '';
      currentPage = 1;
      loadProducts();
    }

    function previousPage() {
      if (currentPage > 1) {
        currentPage--;
        loadProducts();
      }
    }

    function nextPage() {
      if (currentPage * pageSize < totalRecords) {
        currentPage++;
        loadProducts();
      }
    }

    function viewProduct(productId) {
      window.location.href = `product-detail.html?id=${productId}`;
    }

    function editProduct(productId) {
      window.location.href = `product-form.html?id=${productId}`;
    }

    async function deactivateProduct(productId) {
      if (confirm("Êtes-vous sûr de vouloir désactiver ce produit ?")) {
        try {
          await apiFetch(`/admin/products/${productId}/deactivate`, { method: "PUT" });
          loadProducts();
        } catch (error) {
          console.error("Failed to deactivate product:", error);
        }
      }
    }

    async function activateProduct(productId) {
      if (confirm("Êtes-vous sûr de vouloir activer ce produit ?")) {
        try {
          await apiFetch(`/admin/products/${productId}/activate`, { method: "PUT" });
          loadProducts();
        } catch (error) {
          console.error("Failed to activate product:", error);
        }
      }
    }

    // Load products on page load
    loadProducts();
  </script>
</body>
</html>
