<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogue Médical - MedSupply Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#0A2647",
            secondary: "#144272",
            accent: "#2C74B3",
            success: "#16A34A",
            warning: "#D97706",
            danger: "#DC2626",
            background: "#F8FAFC",
            surface: "#FFFFFF",
            border: "#E2E8F0",
            textPrimary: "#0F172A",
            textSecondary: "#64748B",
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-background">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <aside id="sidebar" class="bg-white border-r border-gray-200 flex-shrink-0"></aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden">
      <!-- Header -->
      <header id="header"></header>

      <!-- Content -->
      <main id="main-content" class="flex-1 p-6 overflow-y-auto">
        <!-- Page Header -->
        <div class="flex items-center justify-between mb-6">
          <div>
            <h1 class="text-2xl font-bold text-textPrimary">Catalogue Médical</h1>
            <p class="text-textSecondary">Gérez votre catalogue de produits</p>
          </div>
          <button onclick="window.location.href='product-form.html'" class="bg-accent hover:bg-secondary text-white font-medium px-4 py-2 rounded-lg transition-colors flex items-center gap-2">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>Ajouter un produit</span>
          </button>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">Total produits actifs</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-total">0</p>
              </div>
              <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                <i data-lucide="package" class="w-6 h-6 text-blue-600"></i>
              </div>
            </div>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="bg-surface rounded-xl shadow-sm border border-border p-4 mb-6">
          <div class="flex flex-wrap items-center gap-4">
            <div class="flex-1 min-w-[200px]">
              <div class="relative">
                <i data-lucide="search" class="w-5 h-5 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                <input type="text" id="search-input" placeholder="Rechercher par nom ou référence..."
                  class="w-full pl-10 pr-4 py-2 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all">
              </div>
            </div>
            <button onclick="resetFilters()" class="bg-gray-200 hover:bg-gray-300 text-textPrimary font-medium px-4 py-2 rounded-lg transition-colors">
              Réinitialiser
            </button>
          </div>
        </div>

        <!-- Product Table -->
        <div class="bg-surface rounded-xl shadow-sm border border-border overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-50 border-b border-border">
                <tr>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Produit</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Prix unitaire</th>
                  <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase tracking-wider">Garantie</th>
                  <th class="px-6 py-3 text-right text-xs font-semibold text-textSecondary uppercase tracking-wider">Actions</th>
                </tr>
              </thead>
              <tbody id="products-table-body" class="divide-y divide-border">
                <tr>
                  <td colspan="4" class="px-6 py-12 text-center text-textSecondary">Chargement...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <p class="mt-3 text-xs text-textSecondary flex items-center gap-1.5">
          <i data-lucide="info" class="w-3.5 h-3.5"></i>
          La suppression désactive le produit (suppression logique). Seuls les produits actifs apparaissent dans cette liste.
        </p>
      </main>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script>
    requireAuth(["ADMIN"]);
    const currentUser = getCurrentUser();
  </script>
  <script src="../../js/router.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/header.js"></script>
  <script src="../../js/components/badge.js"></script>
  <script src="../../js/components/toast.js"></script>
  <script src="../../js/components/skeleton.js"></script>
  <script src="../../js/utils/format.js"></script>
  <script>
    initPage("ADMIN");
    const role = getCurrentRole();
    if (role) {
      renderSidebar(role.toLowerCase());
    }
    renderHeader();

    let allProducts = [];

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    async function loadProducts() {
      showSkeleton("products-table-body", "table", { rows: 5, columns: 4 });

      const r = await apiFetch("/products");
      if (!r || !r.ok) {
        showToast(r?.data?.message || "Erreur lors du chargement des produits", "error");
        document.getElementById("products-table-body").innerHTML =
          `<tr><td colspan="4" class="px-6 py-12 text-center text-textSecondary">Erreur lors du chargement</td></tr>`;
        return;
      }

      allProducts = r.data.products || [];
      document.getElementById("stat-total").textContent = allProducts.length;
      renderProducts();
    }

    function renderProducts() {
      const tbody = document.getElementById("products-table-body");
      const search = document.getElementById("search-input").value.trim().toLowerCase();

      let products = allProducts;
      if (search) {
        products = products.filter(p =>
          (p.name || "").toLowerCase().includes(search) ||
          (p.reference || "").toLowerCase().includes(search)
        );
      }

      if (products.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4" class="px-6 py-12 text-center">
              <div class="flex flex-col items-center gap-2 text-textSecondary">
                <i data-lucide="package-search" class="w-10 h-10 text-gray-300"></i>
                <p>${search ? "Aucun produit ne correspond à votre recherche" : "Aucun produit dans le catalogue"}</p>
              </div>
            </td>
          </tr>`;
        lucide.createIcons();
        return;
      }

      tbody.innerHTML = products.map(product => {
        const id = product.id;
        const name = escapeHtml(product.name);
        const reference = escapeHtml(product.reference || "—");
        const imageUrl = product.imageUrl ? escapeHtml(product.imageUrl) : "";
        const warranty = (product.warrantyMonths != null) ? `${product.warrantyMonths} mois` : "—";
        return `
          <tr class="hover:bg-gray-50">
            <td class="px-6 py-4">
              <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-gray-100 rounded-lg overflow-hidden flex-shrink-0">
                  ${imageUrl
                    ? `<img src="${imageUrl}" alt="${name}" class="w-full h-full object-cover" onerror="this.style.display='none'">`
                    : `<div class="w-full h-full flex items-center justify-center bg-accent bg-opacity-10">
                        <i data-lucide="package" class="w-6 h-6 text-accent"></i>
                      </div>`
                  }
                </div>
                <div>
                  <p class="font-medium text-textPrimary">${name}</p>
                  <p class="text-sm text-textSecondary font-mono">${reference}</p>
                </div>
              </div>
            </td>
            <td class="px-6 py-4 text-textPrimary font-medium">${formatCurrency(product.unitPrice)}</td>
            <td class="px-6 py-4 text-textSecondary">${warranty}</td>
            <td class="px-6 py-4">
              <div class="flex items-center justify-end gap-2">
                <button onclick="viewProduct('${id}')" class="p-2 hover:bg-gray-100 rounded transition-colors" title="Voir">
                  <i data-lucide="eye" class="w-4 h-4 text-gray-600"></i>
                </button>
                <button onclick="editProduct('${id}')" class="p-2 hover:bg-blue-100 rounded transition-colors" title="Modifier">
                  <i data-lucide="edit" class="w-4 h-4 text-blue-600"></i>
                </button>
                <button onclick="deleteProduct('${id}', '${name.replace(/'/g, "\\'")}')" class="p-2 hover:bg-red-100 rounded transition-colors" title="Supprimer">
                  <i data-lucide="trash-2" class="w-4 h-4 text-red-600"></i>
                </button>
              </div>
            </td>
          </tr>`;
      }).join("");

      lucide.createIcons();
    }

    function resetFilters() {
      document.getElementById("search-input").value = "";
      renderProducts();
    }

    function viewProduct(id) {
      window.location.href = `product-detail.html?id=${id}`;
    }

    function editProduct(id) {
      window.location.href = `product-form.html?id=${id}`;
    }

    async function deleteProduct(id, name) {
      if (!confirm(`Êtes-vous sûr de vouloir supprimer le produit "${name}" ? Il sera désactivé et retiré du catalogue.`)) {
        return;
      }
      const r = await apiFetch("/products/" + id, { method: "DELETE" });
      if (!r || !r.ok) {
        showToast(r?.data?.message || "Échec de la suppression du produit", "error");
        return;
      }
      showToast("Produit supprimé", "success");
      loadProducts();
    }

    document.getElementById("search-input").addEventListener("input", renderProducts);

    loadProducts();
    lucide.createIcons();
  </script>
</body>
</html>
