<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fournisseurs - MedSupply Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#0A2647",
              secondary: "#144272",
              accent: "#2C74B3",
              success: "#16A34A",
              warning: "#D97706",
              danger: "#DC2626",
              background: "#F8FAFC",
              surface: "#FFFFFF",
              border: "#E2E8F0",
              textPrimary: "#0F172A",
              textSecondary: "#64748B",
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="bg-background">
    <div class="flex h-screen">
      <aside
        id="sidebar"
        class="w-72 bg-white border-r border-gray-200 flex-shrink-0"
      ></aside>
      <div class="flex-1 flex flex-col ml-72">
        <header id="header"></header>
        <main id="main-content" class="flex-1 p-6 overflow-y-auto">
          <div class="flex items-center justify-between mb-6">
            <div>
              <h1 class="text-2xl font-bold text-textPrimary">Fournisseurs</h1>
              <p class="text-textSecondary">
                Gestion des fournisseurs partenaires
              </p>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div
              class="bg-surface rounded-xl shadow-sm border border-border p-6"
            >
              <p class="text-textSecondary text-sm">Total fournisseurs</p>
              <p class="text-2xl font-bold text-primary" id="stat-total">0</p>
            </div>
            <div
              class="bg-surface rounded-xl shadow-sm border border-border p-6"
            >
              <p class="text-textSecondary text-sm">Actifs</p>
              <p class="text-2xl font-bold text-success" id="stat-active">0</p>
            </div>
            <div
              class="bg-surface rounded-xl shadow-sm border border-border p-6"
            >
              <p class="text-textSecondary text-sm">En attente</p>
              <p class="text-2xl font-bold text-warning" id="stat-pending">0</p>
            </div>
          </div>

          <div
            class="bg-surface rounded-xl shadow-sm border border-border overflow-hidden"
          >
            <div class="overflow-x-auto">
              <table class="w-full">
                <thead class="bg-gray-50 border-b border-border">
                  <tr>
                    <th
                      class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase"
                    >
                      Fournisseur
                    </th>
                    <th
                      class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase"
                    >
                      Entreprise
                    </th>
                    <th
                      class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase"
                    >
                      Contact
                    </th>
                    <th
                      class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase"
                    >
                      Ville
                    </th>
                    <th
                      class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase"
                    >
                      Statut
                    </th>
                  </tr>
                </thead>
                <tbody id="suppliers-body" class="divide-y divide-border">
                  <tr>
                    <td
                      colspan="5"
                      class="px-6 py-12 text-center text-textSecondary"
                    >
                      Chargement...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script src="../../js/api.js"></script>
    <script src="../../js/auth.js"></script>
    <script>
      requireAuth(["ADMIN"]);
    </script>
    <script src="../../js/router.js"></script>
    <script src="../../js/components/sidebar.js"></script>
    <script src="../../js/components/header.js"></script>
    <script src="../../js/components/badge.js"></script>
    <script src="../../js/components/toast.js"></script>
    <script src="../../js/utils/format.js"></script>
    <script>
      initPage("ADMIN");
      const role = getCurrentRole();
      if (role) {
        renderSidebar(role.toLowerCase());
      }
      renderHeader();

      async function loadSuppliers() {
        try {
          const response = await apiFetch("/admin/suppliers");
          const suppliers = response?.data?.suppliers || [MOCK_USERS[2]];

          document.getElementById("stat-total").textContent = suppliers.length;
          document.getElementById("stat-active").textContent = suppliers.length;
          document.getElementById("stat-pending").textContent = 0;

          const tbody = document.getElementById("suppliers-body");
          if (suppliers.length === 0) {
            tbody.innerHTML =
              '<tr><td colspan="5" class="px-6 py-12 text-center text-textSecondary">Aucun fournisseur trouvé</td></tr>';
          } else {
            tbody.innerHTML = suppliers
              .map(
                (s) => `
              <tr class="hover:bg-gray-50">
                <td class="px-6 py-4 font-medium text-sm">${s.firstName || ""} ${s.lastName || ""}</td>
                <td class="px-6 py-4 text-sm text-textSecondary">${s.company || ""}</td>
                <td class="px-6 py-4 text-sm">${s.email || ""}</td>
                <td class="px-6 py-4 text-sm text-textSecondary">${s.address?.city || ""}</td>
                <td class="px-6 py-4">${renderBadge("ACTIVE")}</td>
              </tr>
            `,
              )
              .join("");
          }
          lucide.createIcons();
        } catch (error) {
          console.error("Failed to load suppliers:", error);
        }
      }
      loadSuppliers();
    </script>
  </body>
</html>
