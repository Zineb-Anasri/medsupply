<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Détail Devis - MedSupply Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: {
      primary: "#0A2647", secondary: "#144272", accent: "#2C74B3",
      success: "#16A34A", warning: "#D97706", danger: "#DC2626",
      background: "#F8FAFC", surface: "#FFFFFF", border: "#E2E8F0",
      textPrimary: "#0F172A", textSecondary: "#64748B" } } } };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style> body { font-family: 'Inter', sans-serif; } .font-mono { font-family: 'JetBrains Mono', monospace; } </style>
</head>
<body class="bg-background">
  <div class="flex h-screen">
    <aside id="sidebar" class="w-72 bg-white border-r border-gray-200 flex-shrink-0"></aside>
    <div class="flex-1 flex flex-col">
      <header id="header"></header>
      <main id="main-content" class="flex-1 p-6 overflow-y-auto">
        <div class="flex items-center gap-3 mb-6">
          <a href="/medsupply-cloud/pages/admin/quotes.html" class="p-2 rounded-lg hover:bg-gray-100">
            <i data-lucide="arrow-left" class="w-5 h-5 text-textSecondary"></i>
          </a>
          <div>
            <h1 class="text-2xl font-bold text-textPrimary" id="quote-title">Devis</h1>
            <p class="text-textSecondary" id="quote-sub">Chargement...</p>
          </div>
        </div>
        <div id="content" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <p class="text-textSecondary">Chargement...</p>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script>requireAuth(["ADMIN"]);</script>
  <script src="../../js/router.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/header.js"></script>
  <script src="../../js/components/badge.js"></script>
  <script src="../../js/components/toast.js"></script>
  <script src="../../js/utils/format.js"></script>
  <script>
    initPage("ADMIN");
    renderSidebar(getCurrentRole().toLowerCase());
    renderHeader();

    const quoteId = new URLSearchParams(location.search).get("id");
    let productMap = {};
    let currentItems = [];
    let currentStatus = null;

    async function load() {
      if (!quoteId) { location.href = "quotes.html"; return; }
      const pr = await apiFetch("/products");
      if (pr && pr.ok) (pr.data.products || []).forEach((p) => (productMap[p.id] = p));

      const r = await apiFetch(`/quotes/${quoteId}`);
      if (!r || !r.ok) {
        document.getElementById("content").innerHTML = `<p class="text-danger">${r?.data?.message || "Devis introuvable"}</p>`;
        return;
      }
      const quote = r.data.quote;
      currentItems = r.data.items || [];
      currentStatus = quote.status;

      let client = null;
      const cr = await apiFetch(`/clients/${quote.clientId}`);
      if (cr && cr.ok) client = cr.data.client;

      render(quote, currentItems, client);
    }

    function render(quote, items, client) {
      document.getElementById("quote-title").textContent = "Devis #" + quote.quoteId.slice(0, 8);
      document.getElementById("quote-sub").innerHTML = `Créé le ${formatDate(quote.createdAt)} &middot; ${renderBadge(quote.status)}`;

      const editable = quote.status === "PENDING";
      const rows = items.map((it) => {
        const p = productMap[it.productId] || {};
        const priceCell = editable
          ? `<input type="number" min="0" step="0.01" data-item="${it.itemId}" value="${it.adminPrice != null ? it.adminPrice : (it.proposedPrice != null ? it.proposedPrice : '')}"
                    oninput="recalc()" class="w-28 px-2 py-1 border border-border rounded text-right" />`
          : (it.adminPrice != null ? formatCurrency(it.adminPrice) : '<span class="text-textSecondary">—</span>');
        return `
          <tr class="border-b border-border">
            <td class="px-4 py-3">
              <p class="font-medium text-textPrimary">${p.name || "Produit #" + it.productId.slice(0, 8)}</p>
              <p class="text-xs text-textSecondary font-mono">${p.reference || ""}</p>
            </td>
            <td class="px-4 py-3 text-center">${it.quantity}</td>
            <td class="px-4 py-3 text-right">${it.proposedPrice != null ? formatCurrency(it.proposedPrice) : "—"}</td>
            <td class="px-4 py-3 text-right">${priceCell}</td>
            <td class="px-4 py-3 text-right font-semibold line-total" data-item="${it.itemId}" data-qty="${it.quantity}">—</td>
          </tr>`;
      }).join("");

      const clientCard = client
        ? `<div class="bg-surface rounded-xl shadow-sm border border-border p-6">
             <h3 class="font-semibold text-textPrimary mb-3">Client</h3>
             <p class="font-medium text-textPrimary">${client.name || "—"}</p>
             ${client.type ? `<div class="mt-1">${renderBadge(client.type)}</div>` : ""}
             <p class="text-sm text-textSecondary mt-2">${client.email || ""}</p>
             <p class="text-sm text-textSecondary">${client.phone || ""}</p>
           </div>`
        : `<div class="bg-surface rounded-xl shadow-sm border border-border p-6"><h3 class="font-semibold text-textPrimary mb-1">Client</h3><p class="font-mono text-textSecondary">#${(quote.clientId||"").slice(0,8)}</p></div>`;

      const reviewBtn = editable
        ? `<button onclick="submitReview()" class="w-full bg-accent hover:bg-secondary text-white font-medium px-4 py-2.5 rounded-lg flex items-center justify-center gap-2"><i data-lucide="check-circle" class="w-5 h-5"></i> Valider le chiffrage</button>
           <p class="text-xs text-textSecondary mt-2">Le devis passera au statut « Chiffré » et le client pourra l'accepter ou le refuser.</p>`
        : `<p class="text-sm text-textSecondary">Ce devis n'est plus modifiable (statut ${renderBadge(quote.status)}).</p>`;

      document.getElementById("content").innerHTML = `
        <div class="lg:col-span-2 bg-surface rounded-xl shadow-sm border border-border overflow-hidden">
          <div class="px-6 py-4 border-b border-border"><h2 class="font-semibold text-textPrimary">Articles ${editable ? "— saisissez les prix validés" : ""}</h2></div>
          <table class="w-full text-sm">
            <thead class="bg-gray-50 text-xs uppercase text-textSecondary">
              <tr><th class="px-4 py-2 text-left">Produit</th><th class="px-4 py-2 text-center">Qté</th><th class="px-4 py-2 text-right">Prix proposé</th><th class="px-4 py-2 text-right">Prix validé</th><th class="px-4 py-2 text-right">Total</th></tr>
            </thead>
            <tbody>${rows || `<tr><td colspan="5" class="px-4 py-6 text-center text-textSecondary">Aucun article</td></tr>`}</tbody>
          </table>
        </div>
        <div class="space-y-6">
          ${clientCard}
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <p class="text-textSecondary text-sm">Montant total</p>
            <p class="text-3xl font-bold text-textPrimary mb-4" id="grand-total">—</p>
            ${reviewBtn}
          </div>
        </div>`;
      lucide.createIcons();
      recalc();
    }

    function recalc() {
      let total = 0;
      document.querySelectorAll(".line-total").forEach((cell) => {
        const itemId = cell.getAttribute("data-item");
        const qty = parseInt(cell.getAttribute("data-qty"), 10) || 0;
        let unit;
        const input = document.querySelector(`input[data-item="${itemId}"]`);
        if (input) unit = parseFloat(input.value);
        else {
          const it = currentItems.find((i) => i.itemId === itemId);
          unit = it && it.adminPrice != null ? it.adminPrice : null;
        }
        if (unit != null && !isNaN(unit)) { const line = unit * qty; total += line; cell.textContent = formatCurrency(line); }
        else cell.textContent = "—";
      });
      document.getElementById("grand-total").textContent = formatCurrency(total);
    }

    async function submitReview() {
      const itemPrices = {};
      let valid = true;
      document.querySelectorAll("input[data-item]").forEach((input) => {
        const v = parseFloat(input.value);
        if (isNaN(v) || v <= 0) valid = false;
        itemPrices[input.getAttribute("data-item")] = v;
      });
      if (!valid) { showToast("Saisissez un prix valide (> 0) pour chaque article", "warning"); return; }
      const r = await apiFetch(`/quotes/${quoteId}/review`, { method: "PUT", body: JSON.stringify({ itemPrices }) });
      if (r && r.ok && r.data.success) { showToast("Devis chiffré et envoyé au client", "success"); load(); }
      else showToast(r?.data?.message || "Échec du chiffrage", "error");
    }

    load();
  </script>
</body>
</html>
