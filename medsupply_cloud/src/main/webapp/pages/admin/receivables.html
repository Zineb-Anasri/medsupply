<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Créances en retard - MedSupply Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: {
      primary: "#0A2647", secondary: "#144272", accent: "#2C74B3",
      success: "#16A34A", warning: "#D97706", danger: "#DC2626",
      background: "#F8FAFC", surface: "#FFFFFF", border: "#E2E8F0",
      textPrimary: "#0F172A", textSecondary: "#64748B" } } } };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style> body { font-family: 'Inter', sans-serif; } .font-mono { font-family: 'JetBrains Mono', monospace; } </style>
</head>
<body class="bg-background">
  <div class="flex h-screen">
    <aside id="sidebar" class="w-72 bg-white border-r border-gray-200 flex-shrink-0"></aside>
    <div class="flex-1 flex flex-col">
      <header id="header"></header>
      <main id="main-content" class="flex-1 p-6 overflow-y-auto">
        <div class="flex items-center gap-3 mb-6">
          <a href="/medsupply-cloud/pages/admin/payments.html" class="p-2 rounded-lg hover:bg-gray-100"><i data-lucide="arrow-left" class="w-5 h-5 text-textSecondary"></i></a>
          <div><h1 class="text-2xl font-bold text-textPrimary">Créances en retard</h1><p class="text-textSecondary">Paiements échus non réglés</p></div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-6">
          <div class="bg-surface rounded-xl shadow-sm border border-border p-5"><p class="text-textSecondary text-sm">Nombre de créances</p><p class="text-2xl font-bold text-danger" id="stat-count">0</p></div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-5"><p class="text-textSecondary text-sm">Montant total dû</p><p class="text-2xl font-bold text-textPrimary" id="stat-amount">—</p></div>
        </div>

        <div class="bg-surface rounded-xl shadow-sm border border-border overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full">
              <thead class="bg-gray-50 border-b border-border"><tr>
                <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Commande</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Client</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Reste dû</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Échéance</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-textSecondary uppercase">Retard</th>
                <th class="px-6 py-3 text-right text-xs font-semibold text-textSecondary uppercase">Actions</th>
              </tr></thead>
              <tbody id="body" class="divide-y divide-border"><tr><td colspan="6" class="px-6 py-12 text-center text-textSecondary">Chargement...</td></tr></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../../js/auth.js"></script>
  <script>requireAuth(["ADMIN"]);</script>
  <script src="../../js/router.js"></script>
  <script src="../../js/components/sidebar.js"></script>
  <script src="../../js/components/header.js"></script>
  <script src="../../js/components/badge.js"></script>
  <script src="../../js/components/toast.js"></script>
  <script src="../../js/utils/format.js"></script>
  <script>
    initPage("ADMIN");
    renderSidebar(getCurrentRole().toLowerCase());
    renderHeader();

    let orderById = {}, clientByUser = {};

    function daysOverdue(dueDate) {
      if (!dueDate) return 0;
      const d = Math.floor((Date.now() - new Date(dueDate).getTime()) / 86400000);
      return d > 0 ? d : 0;
    }

    async function load() {
      const [or, cr] = await Promise.all([apiFetch("/orders"), apiFetch("/clients")]);
      if (or && or.ok) (or.data.orders || []).forEach((o) => (orderById[o.orderId] = o));
      if (cr && cr.ok) (cr.data.clients || []).forEach((c) => (clientByUser[c.userId] = c));

      const r = await apiFetch("/payments/overdue");
      if (!r || !r.ok) { document.getElementById("body").innerHTML = `<tr><td colspan="6" class="px-6 py-12 text-center text-danger">${r?.data?.message || "Erreur"}</td></tr>`; return; }
      const list = r.data.payments || [];
      const totalDue = list.reduce((s,p)=>s+((Number(p.amount)||0)-(Number(p.paidAmount)||0)),0);
      document.getElementById("stat-count").textContent = list.length;
      document.getElementById("stat-amount").textContent = formatCurrency(totalDue);

      const tbody = document.getElementById("body");
      if (list.length===0) { tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-12 text-center text-success">Aucune créance en retard 🎉</td></tr>`; return; }
      tbody.innerHTML = list.map(p=>{
        const o = orderById[p.orderId];
        const c = o && clientByUser[o.clientId];
        const due = (Number(p.amount)||0)-(Number(p.paidAmount)||0);
        const dd = daysOverdue(p.dueDate);
        return `<tr class="hover:bg-gray-50">
          <td class="px-6 py-4 font-mono text-textPrimary">#${(p.orderId||"").slice(0,8)}</td>
          <td class="px-6 py-4">${c ? `<p class="font-medium text-textPrimary">${c.name||"Client"}</p>` : '<span class="text-textSecondary">—</span>'}</td>
          <td class="px-6 py-4 font-semibold text-danger">${formatCurrency(due)}</td>
          <td class="px-6 py-4 text-textSecondary">${p.dueDate ? formatDate(p.dueDate) : "—"}</td>
          <td class="px-6 py-4"><span class="px-2 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800">${dd} j</span></td>
          <td class="px-6 py-4 text-right">${o ? `<button onclick="remind('${o.clientId}','${(p.orderId||'').slice(0,8)}', ${due})" class="text-accent hover:bg-blue-50 text-sm font-medium px-3 py-1.5 rounded-lg inline-flex items-center gap-1"><i data-lucide="bell" class="w-4 h-4"></i> Relancer</button>` : ''}</td>
        </tr>`;
      }).join("");
      lucide.createIcons();
    }

    async function remind(clientUserId, orderRef, due) {
      if (!confirm("Envoyer une relance de paiement au client ?")) return;
      const body = {
        userId: clientUserId,
        title: "Rappel de paiement",
        message: `La commande #${orderRef} présente un solde impayé de ${formatCurrency(due)}. Merci de procéder au règlement.`,
        type: "PAYMENT",
      };
      const r = await apiFetch("/notifications", { method: "POST", body: JSON.stringify(body) });
      if (r && r.ok && r.data.success) showToast("Relance envoyée", "success");
      else showToast(r?.data?.message || "Échec de l'envoi", "error");
    }

    load();
  </script>
</body>
</html>
