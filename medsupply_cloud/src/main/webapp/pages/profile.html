<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mon Profil - MedSupply Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: {
      primary: "#0A2647", secondary: "#144272", accent: "#2C74B3",
      success: "#16A34A", warning: "#D97706", danger: "#DC2626",
      background: "#F8FAFC", surface: "#FFFFFF", border: "#E2E8F0",
      textPrimary: "#0F172A", textSecondary: "#64748B" } } } };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-background">
  <div class="flex h-screen">
    <aside id="sidebar" class="bg-white border-r border-gray-200 flex-shrink-0"></aside>
    <div class="flex-1 flex flex-col">
      <header id="header"></header>
      <main id="main-content" class="flex-1 p-6 overflow-y-auto">
        <div class="mb-6">
          <h1 class="text-2xl font-bold text-textPrimary">Mon Profil</h1>
          <p class="text-textSecondary">Gérez vos informations et votre mot de passe</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 max-w-5xl">
          <!-- Account summary -->
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6 h-fit">
            <div class="w-16 h-16 rounded-full bg-[#2C74B3]/10 flex items-center justify-center mx-auto mb-3">
              <i data-lucide="user" class="w-8 h-8 text-accent"></i>
            </div>
            <p class="text-center font-semibold text-textPrimary" id="acct-name">—</p>
            <p class="text-center text-sm text-textSecondary mb-3" id="acct-email">—</p>
            <div class="text-center" id="acct-role"></div>
          </div>

          <!-- Forms -->
          <div class="lg:col-span-2 space-y-6">
            <!-- Profile info -->
            <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
              <h2 class="text-lg font-semibold text-textPrimary mb-4 flex items-center gap-2">
                <i data-lucide="id-card" class="w-5 h-5"></i> Informations
              </h2>
              <form id="profile-form" class="space-y-4" onsubmit="saveProfile(event)">
                <div id="profile-fields" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <p class="text-textSecondary">Chargement...</p>
                </div>
                <div id="profile-actions" class="hidden">
                  <button type="submit" class="bg-accent hover:bg-secondary text-white font-medium px-5 py-2.5 rounded-lg flex items-center gap-2">
                    <i data-lucide="save" class="w-5 h-5"></i> Enregistrer les modifications
                  </button>
                </div>
              </form>
            </div>

            <!-- Password -->
            <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
              <h2 class="text-lg font-semibold text-textPrimary mb-4 flex items-center gap-2">
                <i data-lucide="lock" class="w-5 h-5"></i> Sécurité
              </h2>
              <form class="space-y-4 max-w-md" onsubmit="changePassword(event)">
                <div>
                  <label class="block text-sm font-medium text-textPrimary mb-1">Mot de passe actuel</label>
                  <input id="pwd-old" type="password" required class="w-full px-3 py-2 border border-border rounded-lg outline-none focus:ring-2 focus:ring-accent" />
                </div>
                <div>
                  <label class="block text-sm font-medium text-textPrimary mb-1">Nouveau mot de passe</label>
                  <input id="pwd-new" type="password" required minlength="6" class="w-full px-3 py-2 border border-border rounded-lg outline-none focus:ring-2 focus:ring-accent" />
                </div>
                <div>
                  <label class="block text-sm font-medium text-textPrimary mb-1">Confirmer le nouveau mot de passe</label>
                  <input id="pwd-confirm" type="password" required minlength="6" class="w-full px-3 py-2 border border-border rounded-lg outline-none focus:ring-2 focus:ring-accent" />
                </div>
                <button type="submit" class="bg-white border border-border hover:border-accent text-textPrimary font-medium px-5 py-2.5 rounded-lg">
                  Changer le mot de passe
                </button>
              </form>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script>requireAuth();</script>
  <script src="../js/router.js"></script>
  <script src="../js/components/sidebar.js"></script>
  <script src="../js/components/header.js"></script>
  <script src="../js/components/badge.js"></script>
  <script src="../js/components/toast.js"></script>
  <script src="../js/utils/format.js"></script>
  <script>
    initPage(getCurrentRole());
    renderSidebar(getCurrentRole().toLowerCase());
    renderHeader();

    let role = getCurrentRole();

    // field definitions per role: [id, label, profileKey, type]
    const FIELDS = {
      CLIENT: [
        ["f-name", "Organisation", "name", "text"],
        ["f-email", "Email", "email", "email"],
        ["f-phone", "Téléphone", "phone", "tel"],
        ["f-address", "Adresse", "address", "text"],
        ["f-taxId", "ICE", "taxId", "text"],
      ],
      SUPPLIER: [
        ["f-company", "Société", "companyName", "text"],
        ["f-contact", "Personne de contact", "contactPerson", "text"],
        ["f-email", "Email", "email", "email"],
        ["f-phone", "Téléphone", "phone", "tel"],
        ["f-address", "Adresse", "address", "text"],
      ],
    };

    async function load() {
      const r = await apiFetch("/profile");
      if (!r || !r.ok) { showToast(r?.data?.message || "Erreur de chargement", "error"); return; }
      const acct = r.data.account || {};
      const profile = r.data.profile || {};

      document.getElementById("acct-email").textContent = acct.email || "—";
      document.getElementById("acct-role").innerHTML = renderBadge(acct.role);
      document.getElementById("acct-name").textContent =
        profile.name || profile.companyName || (acct.email ? acct.email.split("@")[0] : "Utilisateur");

      const defs = FIELDS[role];
      const container = document.getElementById("profile-fields");
      if (!defs) {
        container.innerHTML = `<p class="text-textSecondary sm:col-span-2">Les administrateurs n'ont pas de profil d'organisation à modifier.</p>`;
        return;
      }
      container.innerHTML = defs.map(([id, label, key, type]) => `
        <div${key === "address" ? ' class="sm:col-span-2"' : ""}>
          <label class="block text-sm font-medium text-textPrimary mb-1">${label}</label>
          <input id="${id}" data-key="${key}" type="${type}" value="${(profile[key] ?? "").toString().replace(/"/g, "&quot;")}"
                 class="w-full px-3 py-2 border border-border rounded-lg outline-none focus:ring-2 focus:ring-accent" />
        </div>`).join("");
      document.getElementById("profile-actions").classList.remove("hidden");
      lucide.createIcons();
    }

    async function saveProfile(e) {
      e.preventDefault();
      const body = {};
      document.querySelectorAll("#profile-fields input[data-key]").forEach((inp) => {
        body[inp.getAttribute("data-key")] = inp.value.trim();
      });
      const r = await apiFetch("/profile", { method: "PUT", body: JSON.stringify(body) });
      if (r && r.ok && r.data.success) { showToast("Profil mis à jour", "success"); load(); }
      else showToast(r?.data?.message || "Échec de la mise à jour", "error");
    }

    async function changePassword(e) {
      e.preventDefault();
      const oldPassword = document.getElementById("pwd-old").value;
      const newPassword = document.getElementById("pwd-new").value;
      const confirm = document.getElementById("pwd-confirm").value;
      if (newPassword !== confirm) { showToast("Les mots de passe ne correspondent pas", "warning"); return; }
      const r = await apiFetch("/profile/password", { method: "PUT", body: JSON.stringify({ oldPassword, newPassword }) });
      if (r && r.ok && r.data.success) {
        showToast("Mot de passe mis à jour", "success");
        e.target.reset();
      } else showToast(r?.data?.message || "Échec", "error");
    }

    load();
  </script>
</body>
</html>
