<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications - MedSupply Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: {
      primary: "#0A2647", secondary: "#144272", accent: "#2C74B3",
      success: "#16A34A", warning: "#D97706", danger: "#DC2626",
      background: "#F8FAFC", surface: "#FFFFFF", border: "#E2E8F0",
      textPrimary: "#0F172A", textSecondary: "#64748B" } } } };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-background">
  <div class="flex h-screen">
    <aside id="sidebar" class="bg-white border-r border-gray-200 flex-shrink-0"></aside>
    <div class="flex-1 flex flex-col">
      <header id="header"></header>
      <main id="main-content" class="flex-1 p-6 overflow-y-auto">
        <div class="flex items-center justify-between mb-6">
          <div>
            <h1 class="text-2xl font-bold text-textPrimary">Notifications</h1>
            <p class="text-textSecondary"><span id="unread-count">0</span> non lue(s)</p>
          </div>
          <button onclick="markAllRead()" class="bg-white border border-border hover:bg-gray-50 text-textPrimary font-medium px-4 py-2 rounded-lg transition-colors flex items-center gap-2">
            <i data-lucide="check-check" class="w-5 h-5"></i> Tout marquer comme lu
          </button>
        </div>

        <div class="bg-surface rounded-xl shadow-sm border border-border p-2 mb-4 inline-flex gap-1">
          <button data-tab="all" onclick="setTab('all')" class="tab-btn px-4 py-1.5 rounded-lg text-sm font-medium">Toutes</button>
          <button data-tab="unread" onclick="setTab('unread')" class="tab-btn px-4 py-1.5 rounded-lg text-sm font-medium">Non lues</button>
        </div>

        <div id="list" class="space-y-2 max-w-3xl">
          <p class="text-textSecondary">Chargement...</p>
        </div>
      </main>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>requireAuth();</script>
  <script src="js/router.js"></script>
  <script src="js/components/sidebar.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/components/badge.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/utils/format.js"></script>
  <script>
    initPage(getCurrentRole());
    renderSidebar(getCurrentRole().toLowerCase());
    renderHeader();

    let all = [];
    let tab = "all";

    const typeIcon = (t) => ({
      QUOTE: "file-text", ORDER: "shopping-cart", PAYMENT: "credit-card",
      DELIVERY: "truck", MAINTENANCE: "wrench", TENDER: "gavel", SYSTEM: "bell",
    }[t] || "bell");

    async function load() {
      const r = await apiFetch("/notifications");
      if (!r || !r.ok) {
        document.getElementById("list").innerHTML = `<p class="text-danger">${r?.data?.message || "Erreur de chargement"}</p>`;
        return;
      }
      all = r.data.notifications || [];
      render();
    }

    function setTab(t) { tab = t; render(); }

    function render() {
      document.querySelectorAll(".tab-btn").forEach((b) => {
        const active = b.getAttribute("data-tab") === tab;
        b.className = "tab-btn px-4 py-1.5 rounded-lg text-sm font-medium " + (active ? "bg-accent text-white" : "text-textSecondary hover:bg-gray-100");
      });
      const unread = all.filter((n) => !n.isRead);
      document.getElementById("unread-count").textContent = unread.length;

      const rows = (tab === "unread" ? unread : all).sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      const el = document.getElementById("list");
      if (rows.length === 0) {
        el.innerHTML = `<div class="bg-surface rounded-xl border border-border p-10 text-center text-textSecondary"><i data-lucide="bell-off" class="w-8 h-8 mx-auto mb-2"></i><p>Aucune notification</p></div>`;
        lucide.createIcons(); return;
      }
      el.innerHTML = rows.map((n) => `
        <div class="bg-surface rounded-xl border ${n.isRead ? "border-border" : "border-accent/40 bg-blue-50/40"} p-4 flex items-start gap-4">
          <div class="w-10 h-10 rounded-lg bg-blue-100 flex items-center justify-center flex-shrink-0">
            <i data-lucide="${typeIcon(n.type)}" class="w-5 h-5 text-accent"></i>
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2">
              <p class="font-medium text-textPrimary">${n.title || "Notification"}</p>
              ${n.isRead ? "" : '<span class="w-2 h-2 bg-accent rounded-full"></span>'}
            </div>
            <p class="text-sm text-textSecondary">${n.message || ""}</p>
            <p class="text-xs text-textSecondary mt-1">${formatRelativeTime(n.createdAt)}</p>
          </div>
          ${n.isRead ? "" : `<button onclick="markRead('${n.notificationId}')" class="text-accent hover:bg-blue-50 p-2 rounded-lg" title="Marquer comme lu"><i data-lucide="check" class="w-4 h-4"></i></button>`}
        </div>`).join("");
      lucide.createIcons();
    }

    async function markRead(id) {
      const r = await apiFetch(`/notifications/${id}/read`, { method: "PUT" });
      if (r && r.ok && r.data.success) {
        const n = all.find((x) => x.notificationId === id);
        if (n) n.isRead = true;
        render();
        if (typeof updateNotificationBadge === "function") updateNotificationBadge();
      } else showToast(r?.data?.message || "Erreur", "error");
    }

    async function markAllRead() {
      const r = await apiFetch("/notifications/read-all", { method: "PUT" });
      if (r && r.ok && r.data.success) {
        all.forEach((n) => (n.isRead = true));
        render();
        showToast("Toutes les notifications sont lues", "success");
        if (typeof updateNotificationBadge === "function") updateNotificationBadge();
      } else showToast(r?.data?.message || "Aucune notification à marquer", "info");
    }

    load();
  </script>
</body>
</html>
