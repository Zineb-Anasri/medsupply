<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace B2B - MedSupply Cloud</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#0A2647",
            secondary: "#144272",
            accent: "#2C74B3",
            success: "#16A34A",
            warning: "#D97706",
            danger: "#DC2626",
            background: "#F8FAFC",
            surface: "#FFFFFF",
            border: "#E2E8F0",
            textPrimary: "#0F172A",
            textSecondary: "#64748B",
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-background">
  <div class="flex h-screen">
    <!-- Sidebar -->
    <aside id="sidebar" class="bg-white border-r border-gray-200 flex-shrink-0"></aside>
    
    <!-- Main Content -->
    <div class="flex-1 flex flex-col">
      <!-- Header -->
      <header id="header"></header>
      
      <!-- Content -->
      <main id="main-content" class="flex-1 p-6 overflow-y-auto">
        <!-- Page Header -->
        <div class="flex items-center justify-between mb-6">
          <div>
            <h1 class="text-2xl font-bold text-textPrimary">Marketplace B2B — Mes Appels d'Offres</h1>
            <p class="text-textSecondary">Gérez vos appels d'offres et les offres des fournisseurs</p>
          </div>
          <button onclick="window.location.href='marketplace-new.html'" class="bg-primary hover:bg-secondary text-white font-medium px-4 py-2 rounded-lg transition-colors flex items-center gap-2">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>Lancer un appel d'offres</span>
          </button>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">Ouverts</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-open">0</p>
              </div>
              <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
                <i data-lucide="gavel" class="w-6 h-6 text-green-600"></i>
              </div>
            </div>
          </div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">En cours</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-active">0</p>
              </div>
              <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                <i data-lucide="clock" class="w-6 h-6 text-blue-600"></i>
              </div>
            </div>
          </div>
          <div class="bg-surface rounded-xl shadow-sm border border-border p-6">
            <div class="flex items-center justify-between">
              <div>
                <p class="text-textSecondary text-sm">Attribués</p>
                <p class="text-2xl font-bold text-textPrimary" id="stat-awarded">0</p>
              </div>
              <div class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center">
                <i data-lucide="check-circle" class="w-6 h-6 text-purple-600"></i>
              </div>
            </div>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="bg-surface rounded-xl shadow-sm border border-border p-4 mb-6">
          <div class="flex flex-wrap items-center gap-4">
            <select id="status-filter" class="px-4 py-2 border border-border rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent outline-none transition-all">
              <option value="">Tous les statuts</option>
              <option value="OPEN">Ouvert</option>
              <option value="CLOSED">Fermé</option>
              <option value="AWARDED">Attribué</option>
              <option value="CANCELLED">Annulé</option>
            </select>
            <button onclick="applyFilters()" class="bg-accent hover:bg-secondary text-white font-medium px-4 py-2 rounded-lg transition-colors">
              Filtrer
            </button>
            <button onclick="resetFilters()" class="bg-gray-200 hover:bg-gray-300 text-textPrimary font-medium px-4 py-2 rounded-lg transition-colors">
              Réinitialiser
            </button>
          </div>
        </div>

        <!-- Tender Cards Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="tenders-grid">
          <div class="col-span-full text-center py-12 text-textSecondary">Chargement...</div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    requireAuth(["CLIENT"]);
  </script>
  <script src="/js/router.js"></script>
  <script src="/js/components/sidebar.js"></script>
  <script src="/js/components/header.js"></script>
  <script src="/js/components/badge.js"></script>
  <script src="/js/components/toast.js"></script>
  <script src="/js/utils/format.js"></script>
  <script>
    initPage("CLIENT");
    const role = getCurrentRole();
    if (role) {
      renderSidebar(role.toLowerCase());
    }
    renderHeader();

    let countdownIntervals = {};

    async function loadTenders() {
      try {
        const status = document.getElementById('status-filter').value;

        const response = await apiFetch(`/tenders?status=${status}`);
        const data = response?.data || {};

        // Update stats
        document.getElementById("stat-open").textContent = data.stats?.open || 0;
        document.getElementById("stat-active").textContent = data.stats?.active || 0;
        document.getElementById("stat-awarded").textContent = data.stats?.awarded || 0;

        // Clear existing countdown intervals
        Object.values(countdownIntervals).forEach(interval => clearInterval(interval));
        countdownIntervals = {};

        // Update tender cards grid
        const grid = document.getElementById('tenders-grid');
        const tenders = data.tenders || [];
        if (tenders.length === 0) {
          grid.innerHTML = `<div class="col-span-full text-center py-12 text-textSecondary">Aucun appel d'offres trouvé</div>`;
        } else {
          grid.innerHTML = tenders.map(tender => {
            const countdownId = `countdown-${tender.tenderId}`;
            return `
              <div class="bg-surface rounded-xl shadow-sm border border-border overflow-hidden">
                <div class="p-6">
                  <div class="flex items-start justify-between mb-4">
                    <h3 class="font-semibold text-textPrimary text-lg">${tender.title}</h3>
                    ${renderStatusBadge(tender.status)}
                  </div>
                  <div class="space-y-3 mb-4">
                    <div class="flex items-center gap-2">
                      <i data-lucide="wallet" class="w-4 h-4 text-accent"></i>
                      <span class="text-sm text-textSecondary">Budget max: ${formatCurrency(tender.maxBudget)}</span>
                    </div>
                    <div class="flex items-center gap-2">
                      <i data-lucide="clock" class="w-4 h-4 ${getDeadlineUrgencyClass(tender.deadline)}"></i>
                      <span class="text-sm ${getDeadlineUrgencyClass(tender.deadline)}" id="${countdownId}">--</span>
                    </div>
                    <div class="flex items-center gap-2">
                      <i data-lucide="file-text" class="w-4 h-4 text-textSecondary"></i>
                      <span class="text-sm text-textSecondary">${tender.offerCount} offre(s) reçue(s)</span>
                    </div>
                  </div>
                  <button onclick="viewTender('${tender.tenderId}')" class="w-full bg-accent hover:bg-secondary text-white font-medium py-2 rounded-lg transition-colors">
                    Voir les offres
                  </button>
                </div>
              </div>
            `;
          }).join('');

          // Start countdown timers
          data.tenders.forEach(tender => {
            startCountdown(tender.tenderId, tender.deadline);
          });
        }

        lucide.createIcons();
      } catch (error) {
        console.error("Failed to load tenders:", error);
      }
    }

    function startCountdown(tenderId, deadline) {
      const elementId = `countdown-${tenderId}`;
      const element = document.getElementById(elementId);
      
      if (!element) return;

      const updateCountdown = () => {
        const now = new Date();
        const deadlineDate = new Date(deadline);
        const diffMs = deadlineDate - now;
        
        if (diffMs <= 0) {
          element.textContent = 'Expiré';
          element.className = 'text-sm text-red-600 font-medium';
          clearInterval(countdownIntervals[tenderId]);
          return;
        }

        const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));
        const diffHours = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const diffMinutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));

        let text = '';
        if (diffDays > 0) {
          text = `Ferme dans ${diffDays} jour${diffDays > 1 ? 's' : ''}`;
        } else if (diffHours > 0) {
          text = `Ferme dans ${diffHours} heure${diffHours > 1 ? 's' : ''}`;
        } else {
          text = `Ferme dans ${diffMinutes} minute${diffMinutes > 1 ? 's' : ''}`;
        }

        element.textContent = text;
        element.className = `text-sm ${getDeadlineUrgencyClass(deadline)}`;
      };

      updateCountdown();
      countdownIntervals[tenderId] = setInterval(updateCountdown, 60000); // Update every minute
    }

    function getDeadlineUrgencyClass(deadline) {
      const now = new Date();
      const deadlineDate = new Date(deadline);
      const diffHours = (deadlineDate - now) / (1000 * 60 * 60);
      
      if (diffHours < 24) return 'text-red-600 font-medium';
      if (diffHours < 168) return 'text-amber-600 font-medium'; // 7 days
      return 'text-textSecondary';
    }

    function renderStatusBadge(status) {
      const colors = {
        OPEN: "bg-green-100 text-green-800",
        CLOSED: "bg-gray-100 text-gray-800",
        AWARDED: "bg-blue-100 text-blue-800",
        CANCELLED: "bg-red-100 text-red-800"
      };
      const labels = {
        OPEN: "Ouvert",
        CLOSED: "Fermé",
        AWARDED: "Attribué",
        CANCELLED: "Annulé"
      };
      return `<span class="inline-flex items-center px-2 py-1 rounded-md text-xs font-medium ${colors[status] || 'bg-gray-100 text-gray-800'}">${labels[status] || status}</span>`;
    }

    function applyFilters() {
      loadTenders();
    }

    function resetFilters() {
      document.getElementById('status-filter').value = '';
      loadTenders();
    }

    function viewTender(tenderId) {
      window.location.href = `marketplace-detail.html?id=${tenderId}`;
    }

    // Load tenders on page load
    loadTenders();

    // Cleanup intervals on page unload
    window.addEventListener('beforeunload', () => {
      Object.values(countdownIntervals).forEach(interval => clearInterval(interval));
    });
  </script>
</body>
</html>
